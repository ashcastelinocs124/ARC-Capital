      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.adoption.extract.AdoptionExtractor
    summary: >-
      Reads AI passages from a company's latest 10-K/10-Q and returns verbatim quotes rated
      1 pilot, 2 deployed, 3 revenue-linked. Feeds the Talk pillar of the AI Adoption Index
      (`ckm adoption run`); research metric, not wired into the trading pipeline.
    tools:
      - {name: "ai_passages", does: "Deterministic keyword prefilter: only text windows around AI mentions are sent"}
      - {name: "keep_verified (quote guard)", does: "Drops any claim whose quote is not in the filing text, has a depth outside 1-3, or repeats"}
    memory:
      reads: ["AI passages from one filing"]
      writes: ["Guard-passed claims → Talk score"]
      persists: "Claims and Talk cached per filing in data/adoption/adoption.db; an unchanged filing is never re-sent."

  - id: recipe_writer
    name: AI Adoption · Job-board recipe writer
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "GPT-6 Astra tool loop (OpenAI Responses API)"}
    prompt: "castelino.adoption.recipe_agent:SYSTEM"
    schema: "castelino.adoption.sources.recipes:Recipe"
    summary: >-
      Layer 3 of the Hire pillar. For a company whose careers site has no known data address,
      GPT-6 Astra explores it once in a headless browser and proposes a Recipe saying where the
      job titles live. Our replay code tests and saves it; every refresh replays the recipe with
      no model. Run by hand (scripts/write_recipes.py), capped at 15 steps and $3 per company.
    tools:
      - {name: "open_page", does: "Headless Chromium load: visible text, job links, and the JSON requests the page made"}
      - {name: "sample_selector", does: "Texts matching a CSS selector, to check a page-element recipe"}
      - {name: "test_recipe", does: "Runs the recipe with our replay code; returns count and 10 sample titles"}
      - {name: "submit_recipe (guard)", does: "Accepted only if our replay returns titles from the company's site or a known hiring platform"}
    memory:
      reads: ["Ticker, company name, careers start URL", "Its own tool results within one company"]
      writes: ["Recipe → data/adoption/recipes/<TICKER>.json (saved by the script)"]
      persists: "Only the accepted recipe file; nothing carries over between companies."

  # ── Triggers ────────────────────────────────────────────────────────────
# System architecture diagrams on /agents: one entry per `group` above. The first entry is
# the page's default view. A lane is a list of steps (left → right) and each step is a list
# of boxes drawn stacked (parallel). Box string = "kind:text|caption", where kind is
# agent (text = an agent id; opens it), code (deterministic), gate (waits for a human),
# end (output), system (text = another group; opens its diagram), or no kind = an input.
# loops/regions use 0-based step indexes. Keep lanes ≤ 5 steps (so they fit the card); split long ones into
# numbered stages. tests/test_agent_catalog.py checks every reference.
systems:
  - group: Briefings
    trigger: "Top-bar Refresh button (once a day)"
    output: "The /updates Morning Note and the Fear & Greed · Sector Sentiment card on Radar"
    blurb: >-
      An Orchestrator briefs four research agents and reviews what they find; an Editor writes
      the Morning Note. Code supplies every number, and a guard checks each figure before saving.
    lanes:
      - title: "Daily Update 1 · Research"
        flow: [["Refresh"], ["agent:update_orchestrator|plan briefs"], ["agent:macro_agent|FRED · BLS · Yahoo", "agent:news_agent|web_search", "agent:alt_agent|Polymarket · X", "agent:ai_agent|AI models · chips"], ["agent:update_orchestrator|review"], ["end:↓ to stage 2"]]
        regions: [{from: 1, to: 3, label: "Loop · max 2 follow-up rounds"}]
        loops: [{from: 3, to: 2, label: "follow-ups"}]
      - title: "Daily Update 2 · Write"
        flow: [["code:Background|stock · data · past notes", "code:Day's calendar|releases · earnings"], ["agent:update_editor|Morning Note"], ["code:Number guard|1 retry"], ["code:Chart agent|8 chart forms", "agent:cover_artist|Substack cover"], ["end:/updates|+ 2-tier memory"]]
        loops: [{from: 2, to: 1, label: "retry with errors"}]
      - title: "Admin · Daily desk"
        flow: [["Your question on /admin"], ["agent:desk_chat|one day · one agent"], ["end:Answer with fact ids"]]
      - title: "Sector Sentiment"
        flow: [["Refresh"], ["code:Divergence scores|top-10 per sector", "code:Fear & Greed|5 market signals"], ["agent:sector_narrative|1 call", "agent:sector_prose|11 calls"], ["end:Card on Radar"]]

  - group: Trade Lab
    trigger: "You, in /admin → Trade Lab"
    output: "A Special Topics draft on Substack (you publish)"
    blurb: >-
      A bull and a bear debate your trade idea with real data, you talk it through, three desks dig into
      what's open, you pick a chart per section, and Claude writes a checked draft. Then you edit it by
      talking to an assistant.
    lanes:
      - title: "Trade Lab 1 · Debate"
        flow: [["Your idea"], ["agent:trade_framer|thesis + tickers"], ["agent:trade_bull|own research", "agent:trade_bear|own research"], ["agent:trade_moderator|settled · open"], ["end:↓ Talk 1"]]
        loops: [{from: 2, to: 2, label: "2 rebuttals"}]
      - title: "Trade Lab 2 · Talk and research"
        flow: [["agent:trade_talk|Talk 1"], ["agent:trade_decide|research? yes/no"], ["agent:trade_orchestrator|3 briefs"], ["agent:trade_news_desk|2 news desks", "agent:trade_technical_desk|technical"], ["end:↓ charts"]]
      - title: "Trade Lab 3 · Charts and draft"
        flow: [["agent:trade_chartist|up to 3 per section"], ["gate:You pick|one per section"], ["agent:trade_editor|Claude"], ["code:Number guard|1 retry"], ["end:Substack draft|↓ Talk 2"]]
      - title: "Trade Lab 4 · Talk 2 assistant"
        flow: [["Your message"], ["agent:trade_decide|research? edit?"], ["agent:trade_news_desk|≤4 searches, if needed"], ["agent:trade_talk|Haiku answers + edits"], ["end:Draft updated|Sonnet if checks fail"]]
      - title: "Charts tab · chat and compare"
        flow: [["Your idea"], ["agent:chart_desk|gpt-6-luna · or 2-8 models"], ["code:Spec check|1 retry"], ["code:Chart forms|FRED · Yahoo"], ["end:Admin Charts|chat · ★ vote"]]

  - group: Deep research
    trigger: "You, in /admin → Research"
    output: "A cited report of points in data/research/, drafted on Substack (Artificial Intelligence); you question any point"
    blurb: >-
      Any topic. The Lead invents up to 8 angles, one research agent each (DeepSeek V4.1 Flash, 12 tool calls
      over web, X, FRED, Yahoo, BLS and Polymarket, with a shared board). The Critic checks the findings and
      may add one gap round, then Claude Opus writes the points. On the editor desk the agent behind a point
      rethinks in its own thread, Claude Haiku rewrites only that point, and you approve or reject. Add angles
      to a finished report and up to 3 new agents research them; Claude adds new points only.
    lanes:
      - title: "1 · Clarify and plan"
        flow: [["Your topic"], ["agent:research_clarifier|≤3 questions"], ["gate:You answer|or skip"], ["agent:research_lead|≤8 angles"], ["end:↓ research"]]
      - title: "2 · Research and write"
        flow: [["agent:research_agent|×8 · 12 tool calls"], ["agent:research_critic|findings enough?"], ["agent:research_writer|Claude · points · number guard"], ["agent:research_charter|a chart per point"], ["end:Report + Substack draft|↓ editor desk"]]
        loops: [{from: 1, to: 0, label: "1 gap round"}]
      - title: "3 · Editor desk"
        flow: [["gate:You ask|about one point"], ["agent:research_agent|rethinks in its thread"], ["agent:research_revise|that point only"], ["gate:You approve|or reject"], ["end:Point v2"]]
      - title: "4 · After 14 days"
        flow: [["code:Open or list|older than 14 days"], ["agent:research_compact|summary per agent"], ["end:Transcripts dropped|report kept"]]
      - title: "5 · Add angles"
        flow: [["gate:You add angles|to a finished report"], ["agent:research_lead|≤3 angles"], ["agent:research_agent|new agents only"], ["agent:research_writer|new points, charted"], ["end:Points appended|old points unchanged"]]

  - group: Theme Charts
    trigger: "Cron on the Fly server at 08:00 ET, weekdays"
    output: "The top macro theme, three signals and 5-6 charts, published on Substack (a card on /themes) and posted to X as a thread"
    blurb: >-
      Code gathers three signals: what news and financial X discuss most, the biggest market moves
      and Polymarket odds swings. One Theme Picker call names the theme and picks the charts; code
      fetches and draws every plotted number, and a guard checks each figure.
    lanes:
      - title: "Theme Charts 1 · Pick"
        flow: [["08:00 ET · Mon-Fri"], ["code:News & X|cited web search", "code:Market moves|1d · 1w · 1m", "code:Polymarket|odds swings", "code:Today's calendar|Week Ahead"], ["agent:theme_picker|pre-open theme + 5-6 charts"], ["code:Number guard|1 retry"], ["end:↓ to stage 2"]]
        loops: [{from: 3, to: 2, label: "retry with errors"}]
      - title: "Theme Charts 2 · Chart & publish"
        flow: [["code:Fetch series|FRED · Yahoo"], ["code:Chart forms|heatmap · together · range"], ["code:Save run|last 6 runs = memory"], ["agent:chart_explainer|X: a trader read per chart", "agent:chart_commentary|Substack: a trader read per chart"], ["end:Substack post|08:00 weekdays · /themes card", "end:X thread|08:00 weekdays"]]

  - group: Market alerts
    trigger: "Cron on the Fly server every 30 minutes, 9:35-16:05 ET on weekdays"
    output: "A post on X with one chart for each market move of at least 2.5 sigma (dry run until X_MOVES_LIVE=1)"
    blurb: >-
      Code measures today's move in 10 markets against their past year and decides what to post.
      One Move Explainer search adds a cited reason; code writes every number in the post.
    lanes:
      - title: "Market alerts"
        flow: [["Every 30 min"], ["code:Market check|10 markets · z ≥ 2.5"], ["agent:move_explainer|cited why"], ["agent:x_chart_picker|intraday or context chart"], ["end:Post on X|+ chart · or dry-run log"]]

  - group: X Scout
    trigger: "Cron on the Fly server: the Scout every 2 hours, 10:15-22:15 ET on weekdays and 08:15-22:15 at weekends; the calendar card at 07:00 and its watcher every 5 min, 07:00-19:55, on weekdays"
    output: "On X, with the card and findings also as Substack Notes (dry run until X_SCOUT_LIVE=1): up to 2 cited findings a day with a chart and a reply; a calendar card each weekday morning (the week on Mondays); a post on X for each watched release as it lands, up to 4 a day"
    blurb: >-
      A cited search finds the last 6 hours of macro and AI news; the Scout picks one item worth a
      post (usually none) and the series that chart it. Code draws the chart, and every figure the
      Writer uses must come from the source line or the chart data. Its Calendar lane posts the week's
      or today's calendar card each weekday morning and each key release as it lands; code writes
      every number and the two writers only add words.
    lanes:
      - title: "Findings"
        flow: [["Every 2 h"], ["agent:x_scout_search|cited macro + AI"], ["agent:x_scout|1 item, 24h retry"], ["agent:x_scout_writer|post + reply"], ["end:X + Substack Note|+ chart · or dry-run log"]]
      - title: "Calendar"
        flow: [["7:00 · every 5 min"], ["code:Week Ahead|pick + card · watch list"], ["agent:x_calendar_writer|week or day read"], ["agent:x_earnings_reader|earnings from cited news", "agent:x_release_writer|one line per release"], ["end:X + Notes|card on both · releases X only ≤6/day"]]

  - group: Research metrics
    trigger: "Refresh (AI Adoption Index); recipes are written by hand"
    output: "Talk and Hire scores in the AI Adoption Index"
    blurb: >-
      The LLM is fenced in by code on both sides: a quote is kept only if it is really in the
      filing, and a recipe only if our own replay returns real job titles.
    lanes:
      - title: "Talk pillar"
        flow: [["10-K / 10-Q"], ["code:AI-passage prefilter"], ["agent:adoption_extractor"], ["code:Quote guard|quote must be in filing"], ["end:Talk score|cached per filing"]]
      - title: "Hire pillar · layer 3"
        flow: [["Custom careers site"], ["agent:recipe_writer|≤15 steps, $3"], ["code:Replay test|≥90% coverage"], ["end:Saved recipe|replayed, no model"]]
        loops: [{from: 2, to: 1, label: "rejected → try again"}]

  - group: Weekly deep dive
    trigger: "Sunday 06:00 ET (cron), or Refresh once a report is due"
    output: "The Weekly Deep Dive on /deep-research and a full Substack draft"
    blurb: >-
      A Lead picks the week's 10-12 trends and staffs 5 desks that pull their own data and share a
      board. Claude Opus 5.5 grills every desk, then writes the report; code checks each figure.
    lanes:
      - title: "Weekly Deep Dive 1 · Research"
        flow: [["Week's Morning Notes"], ["agent:weekly_lead|trends + desks"], ["agent:deep_trend_agent|desk 1", "agent:deep_trend_agent|desk 2", "agent:deep_trend_agent|5 desks, shared board"], ["end:↓ to stage 2"]]
      - title: "Weekly Deep Dive 2 · Grill & write"
        flow: [["agent:deep_editor|grill"], ["agent:deep_trend_agent|answers"], ["agent:deep_editor|write"], ["code:Number guard + charts", "agent:cover_artist|Substack cover"], ["end:/deep-research|+ Substack draft"]]
        regions: [{from: 0, to: 1, label: "Loop · max 2 grill rounds"}]
        loops: [{from: 1, to: 0, label: "next round"}]

# Pipelines on the public /agents page: one layered graph per product, with a ▶ Play run walk-through.
# Layers, top to bottom: sources (where facts come from), agents, guardrails (code that checks their
# work), delivery (where you read it). A node sits in its layer at x (px on the canvas, left edge;
# the layer labels take the first 140px), centred vertically and nudged by dy. Default size 150×58;
# a source with no `sub` is a small chip. kind: source | llm | code | guard | trigger | human | out | stop.
# `agent` links an llm node to an agent id above. Groups draw a dashed box round their nodes and can
# be an edge's end. Edges are "from > to", routed from the boxes' positions, or
# "from > to | below|above|right|left | label" for a loop drawn round that side. A step lights its
# nodes (a group lights its members) and edges; its number sits on its first edge.
# tests/test_agent_catalog.py checks every reference and that each agent is drawn (desk_chat is admin-only).
pipelines:
  - id: morning-note
    name: Morning Note
    trigger: "cron · 17:00 ET · every day"
    guardrails: "number check · charts drawn by code"
    delivery: "Morning Note on Substack"
    groups:
      - {id: tools, label: ANALYST TOOLS, nodes: [fred, bls, yahoo, web, polymarket, x]}
      - {id: analysts, label: 4 ANALYSTS, note: RUN IN PARALLEL, nodes: [macro, news, alt, ai]}
    nodes:
      - {id: memory, kind: source, layer: sources, x: 316, w: 140, name: ARC memory, sub: recent notes, does: "The themes and trends from ARC's recent notes, so each run builds on what came before."}
      - {id: fred, kind: source, layer: sources, x: 514, dy: -18, w: 100, name: FRED, does: "Federal Reserve economic data: inflation, rates, jobs and hundreds of other official series."}
      - {id: bls, kind: source, layer: sources, x: 624, dy: -18, w: 100, name: BLS, does: "Bureau of Labor Statistics: the parts of CPI, wages and payroll detail."}
      - {id: yahoo, kind: source, layer: sources, x: 734, dy: -18, w: 100, name: Yahoo Finance, does: "Market prices: stocks, indexes, bonds, currencies and commodities."}
      - {id: web, kind: source, layer: sources, x: 514, dy: 18, w: 100, name: web search, does: "A web search that returns cited sources; only lines with a citation are kept."}
      - {id: polymarket, kind: source, layer: sources, x: 624, dy: 18, w: 100, name: Polymarket, does: "Prediction-market odds and how they moved."}
      - {id: x, kind: source, layer: sources, x: 734, dy: 18, w: 100, name: X, does: "Posts from financial X, found through a cited search."}
      - {id: background, kind: code, layer: sources, x: 872, dy: -18, w: 164, name: Background facts, sub: prices · past notes, does: "Plain code adds context to the findings: a stock's moves this year, a data series' recent history, ARC's earlier notes."}
      - {id: calendar, kind: code, layer: sources, x: 872, dy: 18, w: 164, name: Day's calendar, sub: releases · earnings, does: "Plain code reads the day's data releases and earnings from Nasdaq's calendar. Each result goes to the Editor as a fact, and the full list runs under the note."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: 17:00 ET, does: "A scheduled job on ARC's server starts the run at 5 pm New York time every day."}
      - {id: orch, kind: llm, agent: update_orchestrator, layer: agents, x: 316, w: 140, name: Orchestrator, sub: plan · review, does: "The lead agent. It writes each analyst a brief, then reviews what they found and can send follow-up questions."}
      - {id: macro, kind: llm, agent: macro_agent, layer: agents, x: 518, dy: -40, w: 145, name: Macro analyst, sub: fred · bls · yahoo, does: "Reads today's official data releases (inflation, jobs, rates) and market moves, and picks the ones that matter."}
      - {id: news, kind: llm, agent: news_agent, layer: agents, x: 675, dy: -40, w: 145, name: News analyst, sub: web search, does: "Searches the day's market-moving news. Every line it keeps has a cited source."}
      - {id: alt, kind: llm, agent: alt_agent, layer: agents, x: 518, dy: 40, w: 145, name: Alt-data analyst, sub: polymarket · x, does: "Checks prediction-market odds and what financial X is saying."}
      - {id: ai, kind: llm, agent: ai_agent, layer: agents, x: 675, dy: 40, w: 145, name: AI analyst, sub: web search, does: "Tracks AI model launches, chips and AI-industry news, with sources."}
      - {id: editor, kind: llm, agent: update_editor, layer: agents, x: 884, w: 140, name: Editor, sub: writes 5 stories, does: "Writes the note's five stories (what happened, why, what to watch) and cites a fact for every claim."}
      - {id: guard, kind: guard, layer: guardrails, x: 884, w: 140, name: Number guard, sub: figures vs facts, does: "Plain code compares every number in the draft with the facts. A number that isn't in the data sends the draft back to the Editor."}
      - {id: charts, kind: code, layer: guardrails, x: 660, w: 160, name: Chart renderer, sub: from source data, does: "Draws each chart straight from the source data. The Editor picks the chart type, never the numbers."}
      - {id: cover, kind: llm, agent: cover_artist, layer: guardrails, x: 440, w: 160, name: Cover Artist, sub: cover image, does: "Turns the note's headline and stories into a short title and a scene, and an image model draws the post's cover."}
      - {id: substack, kind: out, layer: delivery, x: 660, w: 160, name: Substack, sub: Morning Note, does: "The finished Morning Note is published on Substack."}
      - {id: memo, kind: out, layer: delivery, x: 440, w: 160, name: Memo page, sub: lists every note, does: "The Memo page on this site lists every published note and links to it."}
    edges:
      - schedule > orch
      - memory > orch
      - orch > analysts
      - tools > analysts
      - analysts > orch | below | follow-ups · max 2 rounds
      - analysts > editor
      - background > editor
      - calendar > editor
      - editor > guard
      - guard > editor | right | retry
      - guard > charts
      - charts > cover
      - cover > substack
      - substack > memo
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > orch], io: ["in: clock", "out: start run"], text: "A scheduled job starts the run at 5 pm New York time every day. Nobody has to press a button."}
      - {title: Plan, nodes: [orch, memory], edges: [orch > analysts, memory > orch], io: ["in: recent notes", "out: 4 briefs"], text: "The Orchestrator, an LLM agent, reads ARC's memory of recent notes and writes each analyst a brief: what to look into today."}
      - {title: Pull data with tools, nodes: [tools, analysts], edges: [tools > analysts], io: ["in: brief + data", "out: findings + fact ids"], text: "Four analyst agents run at the same time, each limited to its own tools: official data (FRED, BLS, Yahoo Finance), a cited web search, prediction markets and X. Code turns every result into numbered facts that the agents must cite."}
      - {title: Report back, nodes: [analysts, orch], edges: [analysts > orch], io: ["in: findings", "out: follow-ups or done"], text: "The analysts' findings go back to the Orchestrator, which can send any of them a follow-up question, for at most two rounds."}
      - {title: Write, nodes: [background, calendar, editor], edges: [analysts > editor, background > editor, calendar > editor], io: ["in: findings + background + calendar", "out: draft note"], text: "Code adds background (price history, earlier notes) and the day's calendar (each data release and earnings result, listed in full under the note). The Editor agent writes five stories (what happened, why, what to watch) and cites a fact for every claim."}
      - {title: Check every number, nodes: [guard, editor], edges: [editor > guard, guard > editor], io: ["in: draft", "out: pass or errors"], text: "Plain code checks every number in the draft against the facts. If a figure isn't in the data, the draft goes back to the Editor with the errors, once."}
      - {title: Chart and publish, nodes: [charts, cover, substack, memo], edges: [guard > charts, charts > cover, cover > substack, substack > memo], io: ["in: checked note", "out: Substack post"], text: "Code draws each chart from the source data, the Cover Artist draws the post's cover image, and the note is published on Substack and listed on the Memo page."}

  - id: weekly-deep-dive
    name: Weekly Deep Dive
    trigger: "first 17:00 ET run from Sunday"
    guardrails: "number check incl. chart values"
    delivery: "Weekly Deep Dive on Substack"
    groups:
      - {id: tools, label: DESK TOOLS, nodes: [fred, bls, yahoo, polymarket, web]}
      - {id: desks, label: 5 DESKS, note: SHARED BOARD, nodes: [desk1, desk2]}
    nodes:
      - {id: notes, kind: source, layer: sources, x: 316, w: 150, name: Morning Notes, sub: Monday to Friday, does: "The week's five Morning Notes: the starting point for picking the week's trends."}
      - {id: fred, kind: source, layer: sources, x: 516, dy: -18, w: 64, name: FRED, does: "Federal Reserve economic data."}
      - {id: bls, kind: source, layer: sources, x: 588, dy: -18, w: 64, name: BLS, does: "Bureau of Labor Statistics data."}
      - {id: yahoo, kind: source, layer: sources, x: 660, dy: -18, w: 64, name: Yahoo, does: "Market prices from Yahoo Finance."}
      - {id: polymarket, kind: source, layer: sources, x: 516, dy: 18, w: 100, name: Polymarket, does: "Prediction-market odds."}
      - {id: web, kind: source, layer: sources, x: 624, dy: 18, w: 100, name: web search, does: "A web search that returns cited sources."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: Sunday, does: "The report is due once the week is over: the first 5 pm New York run from Sunday builds it, and later runs skip it."}
      - {id: lead, kind: llm, agent: weekly_lead, layer: agents, x: 316, w: 150, name: Deep Lead, sub: trends · desks, does: "Reads the week's Morning Notes, picks the 10-12 trends that mattered and splits them across five research desks."}
      - {id: desk1, kind: llm, agent: deep_trend_agent, layer: agents, x: 520, dy: -40, w: 204, name: Desk 1, sub: 2-3 trends · own tools, does: "One of five desk agents: researches its trends with its own tools and shares facts with related desks on a board."}
      - {id: desk2, kind: llm, agent: deep_trend_agent, layer: agents, x: 520, dy: 40, w: 204, name: Desks 2-5, sub: "same, in parallel", does: "The other four desks, running at the same time."}
      - {id: editor, kind: llm, agent: deep_editor, layer: agents, x: 790, w: 160, name: Deep Editor, sub: Claude Opus, does: "Claude Opus questions every desk's research, then writes each trend: what happened, why, what's under the surface, what it means for markets."}
      - {id: guard, kind: guard, layer: guardrails, x: 790, w: 160, name: Number guard, sub: figures + charts, does: "Plain code checks every figure, including chart values, against the facts the desks pulled."}
      - {id: charts, kind: code, layer: guardrails, x: 560, w: 160, name: Chart renderer, sub: from source data, does: "Draws each exhibit from the source data in the form the Editor picked."}
      - {id: cover, kind: llm, agent: cover_artist, layer: guardrails, x: 340, w: 160, name: Cover Artist, sub: cover image, does: "Turns the report's title and trends into a short title and a scene, and an image model draws the post's cover."}
      - {id: substack, kind: out, layer: delivery, x: 560, w: 160, name: Substack, sub: Weekly Deep Dive, does: "The report is drafted on Substack and published there."}
      - {id: page, kind: out, layer: delivery, x: 340, w: 170, name: Deep Research page, sub: lists every week, does: "The Deep Research page on this site lists every weekly report and links to it."}
    edges:
      - schedule > lead
      - notes > lead
      - lead > desks
      - tools > desks
      - desks > editor
      - editor > desks | below | grill · max 2 rounds
      - editor > guard
      - guard > editor | right | retry
      - guard > charts
      - charts > cover
      - cover > substack
      - substack > page
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > lead], io: ["in: a finished week", "out: start run"], text: "Once Monday to Friday's Morning Notes are in, the first scheduled run from Sunday builds the report."}
      - {title: Plan, nodes: [lead, notes], edges: [lead > desks, notes > lead], io: ["in: 5 Morning Notes", "out: 10-12 trends · 5 desks"], text: "The Deep Lead reads the week's Morning Notes, picks the 10-12 trends that mattered and splits them across five research desks."}
      - {title: Research in parallel, nodes: [tools, desks], edges: [tools > desks], io: ["in: trends + tools", "out: findings + facts"], text: "Five desk agents research their trends at the same time, each with its own tools (official data, prices, prediction markets, a cited web search), and share facts on a common board. Code turns every result into a numbered fact."}
      - {title: Grill, nodes: [editor, desks], edges: [desks > editor, editor > desks], io: ["in: desk findings", "out: questions + answers"], text: "Claude, as the Deep Editor, questions every desk's research for up to two rounds, and the desks answer with fresh data."}
      - {title: Write and check, nodes: [editor, guard], edges: [editor > guard, guard > editor], io: ["in: report draft", "out: pass or errors"], text: "The Editor writes the report. Plain code checks every figure, chart values included, against the facts, and sends the draft back once if one doesn't match."}
      - {title: Chart and publish, nodes: [charts, cover, substack, page], edges: [guard > charts, charts > cover, cover > substack, substack > page], io: ["in: checked report", "out: Substack post"], text: "Code draws each exhibit from the source data, the Cover Artist draws the cover image, and the report goes out on Substack and onto the Deep Research page."}

  - id: theme-charts
    name: Theme Charts
    trigger: "cron · 08:00 ET · weekdays"
    guardrails: "number check · charts drawn by code"
    delivery: "Substack post + X thread"
    groups:
      - {id: signals, label: SIGNALS, nodes: [web, x, yahoo, polymarket, calendar]}
    nodes:
      - {id: web, kind: source, layer: sources, x: 316, dy: -18, w: 110, name: web search, does: "A cited web search for the macro themes news and financial X discuss most."}
      - {id: x, kind: source, layer: sources, x: 316, dy: 18, w: 110, name: X, does: "Financial X, found through a cited search."}
      - {id: yahoo, kind: source, layer: sources, x: 438, w: 116, name: Yahoo Finance, does: "Market prices: the biggest 1-day, 1-week and 1-month moves."}
      - {id: polymarket, kind: source, layer: sources, x: 566, dy: -18, w: 104, name: Polymarket, does: "The biggest swings in prediction-market odds."}
      - {id: calendar, kind: source, layer: sources, x: 566, dy: 18, w: 104, name: Week Ahead, does: "Today's scheduled releases (time, consensus, previous) and the biggest companies reporting, from ARC's Week Ahead calendar."}
      - {id: memory, kind: source, layer: sources, x: 720, w: 140, name: ARC memory, sub: last 6 runs, does: "The picker's last six runs, so it doesn't pick the same theme again."}
      - {id: series, kind: source, layer: sources, x: 900, w: 150, name: FRED · Yahoo, sub: series to plot, does: "Every series that ends up on a chart is downloaded straight from FRED or Yahoo Finance."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: 08:00 ET, does: "A scheduled job starts the run at 8 am New York time, Monday to Friday."}
      - {id: gather, kind: code, layer: agents, x: 316, w: 170, name: Signal gatherer, sub: signals + calendar → facts, does: "Plain code gathers the three signals and today's calendar and turns them into numbered facts."}
      - {id: picker, kind: llm, agent: theme_picker, layer: agents, x: 560, w: 170, name: Theme picker, sub: theme + 5-6 charts, does: "One LLM call names the macro theme a trader must know before the open, the three signals behind it and the 5-6 charts that tell it."}
      - {id: guard, kind: guard, layer: guardrails, x: 560, w: 170, name: Number guard, sub: figures vs facts, does: "Every figure in the write-up must be among the facts' numbers, or the picker tries again once."}
      - {id: charts, kind: code, layer: guardrails, x: 800, w: 160, name: Chart renderer, sub: fetch + draw, does: "Downloads every series and draws the charts (lines, heatmaps, together lines, ranges). The AI never supplies a plotted number."}
      - {id: substack, kind: out, layer: delivery, x: 800, w: 160, name: Substack, sub: post · /themes card, does: "Each run is published on Substack and shown as a card on the Theme Charts page."}
      - {id: xthread, kind: out, layer: delivery, x: 990, w: 140, name: X thread, sub: links the post, does: "Posted to X as a thread that links the Substack post."}
      - {id: explainer, kind: llm, agent: chart_explainer, layer: agents, x: 990, w: 150, name: Chart explainer, sub: a read per chart, does: "A light model writes a short trader read under every chart in the X thread. It may quote levels, but only numbers code drew on that chart or the facts; any other number drops the line."}
      - {id: commentary, kind: llm, agent: chart_commentary, layer: delivery, x: 600, w: 160, name: Chart commentary, sub: a read per chart, does: "A light model writes a bold trader read and one or two sentences under every chart in the Substack post. A read with a number code can't trace to that chart or the facts is dropped."}
    edges:
      - schedule > gather
      - signals > gather
      - gather > picker
      - memory > picker
      - picker > guard
      - guard > picker | right | retry
      - guard > charts
      - series > charts
      - charts > substack
      - substack > xthread
      - explainer > xthread
      - commentary > substack
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > gather], io: ["in: clock", "out: start run"], text: "A scheduled job starts the run at 8 am New York time, Monday to Friday."}
      - {title: Gather signals, nodes: [signals, gather], edges: [signals > gather], io: ["in: web · prices · odds · calendar", "out: facts"], text: "Plain code gathers three signals: what news and financial X discuss most, the biggest market moves, and the biggest swings in prediction-market odds, plus today's calendar of releases and earnings."}
      - {title: Pick the theme, nodes: [picker, memory], edges: [gather > picker, memory > picker], io: ["in: facts + memory", "out: theme + chart plan"], text: "One LLM call names the macro theme a trader must know before the open and the 5-6 charts that tell it. It sees its last six runs so it doesn't repeat itself."}
      - {title: Check every number, nodes: [guard, picker], edges: [picker > guard, guard > picker], io: ["in: write-up", "out: pass or errors"], text: "Code checks every figure in the write-up against the facts; a miss sends it back to the picker once."}
      - {title: Chart, nodes: [charts, series], edges: [guard > charts, series > charts], io: ["in: chart plan", "out: charts"], text: "Code downloads every series from FRED and Yahoo Finance and draws the charts, so every plotted number comes from the source."}
      - {title: Publish, nodes: [substack, xthread, explainer, commentary], edges: [charts > substack, substack > xthread, explainer > xthread, commentary > substack], io: ["in: charts + text", "out: post + thread"], text: "The run is published on Substack with a light model's short trader read under each chart and today's calendar, and posted to X as a thread with a read under every chart. Any number in a read must be one code drew on that chart."}

  - id: market-alerts
    name: Market alerts
    trigger: "cron · every 30 min · market hours"
    guardrails: "unusual-move test · numbers by code"
    delivery: "post on X · max 3 a day"
    nodes:
      - {id: yahoo, kind: source, layer: sources, x: 326, name: Yahoo Finance, sub: 10 markets · 5y bars, does: "Prices for 10 markets: stocks, Treasuries, oil, gold, the dollar and more."}
      - {id: web, kind: source, layer: sources, x: 560, name: web search, sub: cited sources, does: "A web search that returns cited sources."}
      - {id: series, kind: source, layer: sources, x: 794, name: FRED · Yahoo, sub: context series, does: "A longer data series for a context chart, downloaded straight from the source."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: every 30 min, does: "Runs every 30 minutes while US markets are open on weekdays."}
      - {id: explainer, kind: llm, agent: move_explainer, layer: agents, x: 560, name: Move explainer, sub: cited why, does: "Searches for why the market moved and keeps the reason only if it can cite a source."}
      - {id: picker, kind: llm, agent: x_chart_picker, layer: agents, x: 794, name: Chart picker, sub: intraday | context, does: "Chooses the chart: today's intraday moves, or a longer backdrop series."}
      - {id: test, kind: guard, layer: guardrails, x: 326, name: Unusual-move test, sub: z ≥ 2.5 vs 1 year, does: "Plain code compares today's move in each market with the past year of daily moves. Only a move 2.5 standard deviations from normal goes on."}
      - {id: writer, kind: guard, layer: guardrails, x: 794, name: Post writer, sub: numbers by code, does: "Code writes every number in the post and enforces the limits: each market once a day, at most three posts a day."}
      - {id: stop, kind: stop, layer: delivery, x: 326, name: No big move, sub: until next check, does: "Most checks find nothing unusual, and the run simply stops."}
      - {id: post, kind: out, layer: delivery, x: 794, name: X post, sub: + chart, does: "The alert is posted to X with its chart. While the feature is in test mode, posts are only logged."}
    edges:
      - schedule > test
      - yahoo > test
      - test > stop
      - test > explainer
      - web > explainer
      - explainer > picker
      - series > picker
      - picker > writer
      - writer > post
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > test], io: ["in: clock", "out: start check"], text: "Every 30 minutes during US market hours, a scheduled job starts a check."}
      - {title: Unusual-move test, nodes: [test, yahoo, stop], edges: [yahoo > test, test > stop], io: ["in: prices", "out: big moves or stop"], text: "Plain code compares today's move in 10 markets with a normal day over the past year. Only a move 2.5 standard deviations or more goes on; otherwise the run stops here."}
      - {title: Explain, nodes: [explainer, web], edges: [test > explainer, web > explainer], io: ["in: the move", "out: cited reason"], text: "The Move explainer agent searches the web for the reason and keeps it only if it can cite a source."}
      - {title: Pick a chart, nodes: [picker, series], edges: [explainer > picker, series > picker], io: ["in: post text", "out: chart choice"], text: "The Chart picker agent chooses today's intraday moves or a longer backdrop series."}
      - {title: Write and post, nodes: [writer, post], edges: [picker > writer, writer > post], io: ["in: text + chart", "out: X post"], text: "Code writes every number in the post, enforces the daily limits and draws the chart, and the alert goes out on X."}

  - id: x-scout
    name: X Scout
    trigger: "cron · findings every 2 h · calendar 07:00 + every 5 min"
    guardrails: "numbers from sources · no repeats · daily caps"
    delivery: "X + Substack Notes: findings, calendar cards; release posts on X"
    nodes:
      - {id: web, kind: source, layer: sources, x: 170, name: web search, sub: cited sources, does: "A web search that returns cited sources; only lines with a citation are kept."}
      - {id: series, kind: source, layer: sources, x: 490, name: FRED · Yahoo, sub: chart series, does: "The data series behind a finding's chart, downloaded straight from the source."}
      - {id: calendar, kind: source, layer: sources, x: 790, name: Week Ahead, sub: the week's calendar, does: "ARC's calendar of the week's economic releases (with consensus and previous) and the companies reporting, refreshed every evening."}
      - {id: nasdaq, kind: source, layer: sources, x: 1110, name: Nasdaq calendar, sub: live actuals, does: "Nasdaq's economic and earnings calendars, which show the actual number or EPS within minutes of a release."}
      - {id: schedule, kind: trigger, layer: agents, x: 20, w: 120, name: Findings, sub: every 2 h, does: "Runs every 2 hours, 10:15 to 22:15 New York time on weekdays and 08:15 to 22:15 at weekends, never within an hour of the morning Theme Charts thread."}
      - {id: search, kind: llm, agent: x_scout_search, layer: agents, x: 170, name: Scout search, sub: macro + AI news, does: "Searches the last 6 hours of macro and AI news and keeps only the lines it can cite."}
      - {id: scout, kind: llm, agent: x_scout, layer: agents, x: 330, name: Scout, sub: 1 item, 24h retry, does: "Picks the one item worth a post and names the data series that chart it; if nothing clears the bar, a second search covers 24 hours and the Scout must pick the best item not yet posted."}
      - {id: writer, kind: llm, agent: x_scout_writer, layer: agents, x: 490, name: Writer, sub: post + reply, does: "Writes the post and one reply of analysis from the cited line and the chart's numbers."}
      - {id: calsched, kind: trigger, layer: agents, x: 650, w: 120, name: Calendar, sub: 07:00 · every 5 min, does: "The calendar card goes out at 7:00 New York time on weekdays (the whole week on Mondays); the release watcher checks every 5 minutes from 7:00 to 19:55."}
      - {id: pick, kind: code, layer: agents, x: 790, name: Pick + card, sub: key rows · drawn by code, does: "Plain code picks the key US releases, inflation and jobs abroad and the largest companies reporting, draws the card and saves the four most important releases to watch."}
      - {id: cardw, kind: llm, agent: x_calendar_writer, layer: agents, x: 950, name: Calendar writer, sub: week or day read, does: "Writes the short read on top of the card from the card's own rows."}
      - {id: earnread, kind: llm, agent: x_earnings_reader, layer: agents, x: 1110, dy: -40, name: Earnings reader, sub: cited news, does: "Nasdaq doesn't show reported EPS, so a cited news search checks each watched company once its session opens; this agent reads the lines into the numbers line, posted only if every figure is a cited one's."}
      - {id: releasew, kind: llm, agent: x_release_writer, layer: agents, x: 1110, dy: 40, name: Release writer, sub: one plain line, does: "Adds one plain sentence, with no numbers, under each release post."}
      - {id: limits, kind: guard, layer: guardrails, x: 330, name: No repeats, sub: 7 days · 2 a day, does: "The Scout sees what this account posted in the last week and today's market alerts; code refuses a story already posted and stops after two findings a day."}
      - {id: check, kind: guard, layer: guardrails, x: 490, name: Number check, sub: source or chart data, does: "Code draws the chart. Every number in the post must come from the cited source or the chart's data, and each post must fit 280 characters, or the post is dropped after one retry."}
      - {id: cardcheck, kind: guard, layer: guardrails, x: 950, name: Card check, sub: card's figures only, does: "Every figure in the read must be on the card, and the post must fit 280 characters, or the card goes out with a plain code-written line."}
      - {id: watchcap, kind: guard, layer: guardrails, x: 1110, name: Watch list, sub: once · 6 a day, does: "Only the morning card's watched releases post, each once, at most six a day; every number in the post comes from Nasdaq or a cited line."}
      - {id: stop, kind: stop, layer: delivery, x: 330, name: Nothing worth posting, sub: until next run, does: "Most findings runs find nothing worth a post, and the run simply stops."}
      - {id: post, kind: out, layer: delivery, x: 490, name: Finding, sub: X + Substack Note, does: "The finding is posted to X with its chart, naming its source, and the analysis follows as a reply; the same finding goes out as one Substack Note with the chart and the source link. While the feature is in test mode, posts are only logged."}
      - {id: cardpost, kind: out, layer: delivery, x: 950, name: Calendar card, sub: X + Substack Note, does: "The week's or today's calendar card posted to X with its read, and as a Substack Note. While the feature is in test mode, posts are only logged."}
      - {id: relpost, kind: out, layer: delivery, x: 1110, name: Release post, sub: actual vs expected, does: "A post on X as each watched release or earnings report lands. While the feature is in test mode, posts are only logged."}
    edges:
      - schedule > search
      - web > search
      - search > scout
      - limits > scout
      - scout > stop
      - scout > writer
      - series > writer
      - writer > check
      - check > post
      - calsched > pick
      - calendar > pick
      - pick > cardw
      - cardw > cardcheck
      - cardcheck > cardpost
      - cardcheck > watchcap
      - nasdaq > releasew
      - watchcap > releasew
      - web > earnread
      - earnread > releasew
      - releasew > relpost
    steps:
      - {title: Find, nodes: [schedule, search, web], edges: [schedule > search, web > search], io: ["in: last 6 hours of news", "out: cited items"], text: "Every 2 hours the Scout search agent lists the macro and AI news of the last 6 hours, and only lines with a citation go on."}
      - {title: Pick, nodes: [scout, limits, stop], edges: [search > scout, limits > scout, scout > stop], io: ["in: cited items + past posts", "out: one item or stop"], text: "The Scout agent picks the one item worth a post and the series that chart it. It skips anything already posted, and most runs stop here."}
      - {title: Chart, write and post, nodes: [writer, series, check, post], edges: [scout > writer, series > writer, writer > check, check > post], io: ["in: item + chart data", "out: finding on X"], text: "Code draws the chart; the Writer agent writes the post and one reply; code checks every number, then the finding goes out on X."}
      - {title: Calendar card, nodes: [calsched, pick, calendar, cardw], edges: [calsched > pick, calendar > pick, pick > cardw], io: ["in: the week's calendar", "out: card + read"], text: "At 7:00 on weekdays code picks the key releases and reporters and draws the card; the Calendar writer adds a short read."}
      - {title: Check and post the card, nodes: [cardcheck, cardpost], edges: [cardw > cardcheck, cardcheck > cardpost], io: ["in: card + read", "out: card on X"], text: "Code checks every figure in the read against the card, then the card goes out on X."}
      - {title: Release posts, nodes: [watchcap, nasdaq, earnread, releasew, relpost], edges: [cardcheck > watchcap, watchcap > releasew, nasdaq > releasew, web > earnread, earnread > releasew, releasew > relpost], io: ["in: watch list + live calendar + cited news", "out: release posts"], text: "Every 5 minutes code checks Nasdaq's live calendar for the morning's watched data, and a cited news search (read by the Earnings Reader) for each watched company once its session opens; each release that lands posts once with its numbers against what was expected, plus one plain sentence."}

  - id: sector-sentiment
    name: Sector Sentiment
    trigger: "cron · 09:30 + 17:00 ET"
    guardrails: "every sector scored, or keep the last one"
    delivery: "Fear & Greed card on Radar"
    groups:
      - {id: data, label: MARKET DATA, nodes: [yahoo, fred]}
      - {id: calc, label: SCORES, nodes: [scores, feargreed]}
      - {id: writers, label: EXPLAINERS, nodes: [narrative, prose]}
    nodes:
      - {id: yahoo, kind: source, layer: sources, x: 340, w: 112, name: Yahoo Finance, does: "Prices, valuations and analysts' earnings estimates for the 10 biggest companies in each sector, plus the S&P 500, VIX and Treasuries."}
      - {id: fred, kind: source, layer: sources, x: 462, w: 48, name: FRED, does: "The high-yield credit spread, one of the five Fear & Greed signals."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 140, name: Schedule, sub: 09:30 + 17:00 ET, does: "Runs twice a day: after the 8:30 data releases and with the 5 pm run."}
      - {id: scores, kind: code, layer: agents, x: 340, dy: -40, w: 170, name: Divergence scores, sub: top 10 per sector, does: "Plain code scores each sector's mood: how far price momentum has run ahead of (or behind) the fundamentals."}
      - {id: feargreed, kind: code, layer: agents, x: 340, dy: 40, w: 170, name: Fear & Greed, sub: 5 market signals, does: "Plain code ranks five market signals against the past two years and averages them into one 0-100 reading."}
      - {id: narrative, kind: llm, agent: sector_narrative, layer: agents, x: 600, dy: -40, w: 180, name: Narrative, sub: 1 call · the summary, does: "Writes the card's short summary of what the numbers say."}
      - {id: prose, kind: llm, agent: sector_prose, layer: agents, x: 600, dy: 40, w: 180, name: Sector explainer, sub: one call per sector, does: "Writes a short explanation for each sector from its scores and its 10 companies."}
      - {id: check, kind: guard, layer: guardrails, x: 600, w: 180, name: Snapshot check, sub: all sectors or keep last, does: "If any sector can't be scored, code keeps the previous snapshot instead of publishing a partial one. If the writing fails, the card ships with numbers only."}
      - {id: card, kind: out, layer: delivery, x: 600, w: 180, name: Radar card, sub: Fear & Greed · sectors, does: "The Fear & Greed · Sector Sentiment card on the Radar page."}
    edges:
      - schedule > calc
      - data > calc
      - calc > writers
      - writers > check
      - check > card
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > calc], io: ["in: clock", "out: start run"], text: "A scheduled job runs at 9:30 am, after the morning data releases, and again at 5 pm New York time."}
      - {title: Score, nodes: [data, calc], edges: [data > calc], io: ["in: prices · estimates · spreads", "out: scores"], text: "Plain code scores each sector's mood (price momentum against fundamentals) from its 10 biggest companies, and the market's Fear & Greed reading from five signals."}
      - {title: Explain, nodes: [writers], edges: [calc > writers], io: ["in: scores", "out: summary + sector notes"], text: "Two LLM agents turn the numbers into words: one writes the summary, the other a short note for each sector. They never change a number."}
      - {title: Check, nodes: [check], edges: [writers > check], io: ["in: snapshot", "out: publish or keep last"], text: "If any sector couldn't be scored, code keeps the previous snapshot rather than publish a partial one."}
      - {title: Publish, nodes: [card], edges: [check > card], io: ["in: checked snapshot", "out: Radar card"], text: "The scores and notes appear on the Fear & Greed · Sector Sentiment card on Radar."}

  - id: ai-adoption
    name: AI Adoption
    trigger: "cron · 17:00 ET · recipes by hand"
    guardrails: "quote check · recipe replay test"
    delivery: "Talk and Hire scores"
    nodes:
      - {id: filings, kind: source, layer: sources, x: 316, w: 160, name: SEC filings, sub: latest 10-K / 10-Q, does: "Each company's latest annual or quarterly report from the SEC."}
      - {id: careers, kind: source, layer: sources, x: 880, w: 160, name: Careers sites, sub: custom job boards, does: "Company careers sites that no standard job-board reader covers."}
      - {id: run, kind: trigger, layer: agents, x: 150, w: 120, name: Index run, sub: 17:00 ET, does: "The AI Adoption Index runs with the 5 pm New York job."}
      - {id: filter, kind: code, layer: agents, x: 316, w: 160, name: AI-passage filter, sub: keyword prefilter, does: "Plain code keeps only the passages of a filing that mention AI, so the model reads less."}
      - {id: extractor, kind: llm, agent: adoption_extractor, layer: agents, x: 530, w: 160, name: Claim extractor, sub: verbatim quotes, does: "Returns word-for-word quotes about AI, each rated pilot, deployed or revenue-linked."}
      - {id: hand, kind: human, layer: agents, x: 720, w: 120, name: By hand, sub: one company, does: "Someone runs the Recipe writer by hand for a company whose careers site has no known data address."}
      - {id: recipe, kind: llm, agent: recipe_writer, layer: agents, x: 880, w: 160, name: Recipe writer, sub: ≤ 15 steps · $3, does: "Explores the careers site once in a headless browser and proposes a recipe saying where the job titles live."}
      - {id: quote, kind: guard, layer: guardrails, x: 530, w: 160, name: Quote check, sub: found in the filing, does: "Code keeps a quote only if it really appears in the filing."}
      - {id: replay, kind: guard, layer: guardrails, x: 880, w: 160, name: Replay test, sub: ≥ 90% coverage, does: "Our own code replays the recipe; it's saved only if it returns real job titles covering at least 90% of what the site shows."}
      - {id: talk, kind: out, layer: delivery, x: 530, w: 160, name: Talk score, sub: cached per filing, does: "How deeply each company talks about AI in its filings, scored from the kept quotes."}
      - {id: hire, kind: out, layer: delivery, x: 880, w: 160, name: Hire score, sub: "replayed, no model", does: "The share of each company's open jobs that are AI or ML roles, counted in code from the replayed recipe."}
    edges:
      - run > filter
      - filings > filter
      - filter > extractor
      - extractor > quote
      - quote > talk
      - hand > recipe
      - careers > recipe
      - recipe > replay
      - replay > recipe | right | rejected → try again
      - replay > hire
    steps:
      - {title: Read the filings, nodes: [run, filings, filter], edges: [filings > filter, run > filter], io: ["in: SEC filing", "out: AI passages"], text: "On each index run, code downloads each company's latest 10-K or 10-Q from the SEC and keeps only the passages that mention AI."}
      - {title: Extract claims, nodes: [extractor], edges: [filter > extractor], io: ["in: AI passages", "out: rated quotes"], text: "The Claim extractor returns word-for-word quotes, each rated pilot, deployed or revenue-linked."}
      - {title: Check the quotes, nodes: [quote, talk], edges: [extractor > quote, quote > talk], io: ["in: quotes", "out: Talk score"], text: "Code keeps a quote only if it really appears in the filing, and the kept quotes become the Talk score."}
      - {title: Write a recipe, nodes: [hand, careers, recipe], edges: [careers > recipe, hand > recipe], io: ["in: careers site", "out: proposed recipe"], text: "For a careers site no standard reader covers, someone runs the Recipe writer by hand: it explores the site once and proposes where the job titles live."}
      - {title: Replay test, nodes: [replay, recipe], edges: [recipe > replay, replay > recipe], io: ["in: recipe", "out: saved or rejected"], text: "Our own code replays the recipe and saves it only if it returns real job titles covering at least 90% of what the site shows."}
      - {title: Hire score, nodes: [hire], edges: [replay > hire], io: ["in: saved recipe", "out: Hire score"], text: "Every index run replays the saved recipes with no model and counts AI and ML job titles in code."}
