# Agent registry — one entry per LLM agent, shown on the dashboard's /agents page.
#
# Adding an agent: add an entry here. `class` (a StructuredAgent) makes the page read the
# live system prompt, model tier and output schema from code. For agents that aren't
# StructuredAgents, point `prompt` at a module-level prompt constant and `schema` at the
# output model ("module.path:NAME"). tools/memory/dependencies are descriptions you maintain
# here; `dependencies` lists the env keys the agent needs (required or optional).
# tests/test_agent_catalog.py fails if a StructuredAgent class is missing from this file.

agents:
  # ── Briefings ───────────────────────────────────────────────────────────
  - id: update_orchestrator
    name: Update Orchestrator
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM calls (gpt-6-sol)"}
    class: castelino.agents.update.orchestrator.UpdateOrchestrator
    summary: >-
      Runs the morning research desk: briefs the Macro, News and Alt agents from memory, then
      reviews what they found and sends up to one follow-up ask per agent (max 2 rounds).
    tools:
      - {name: "plan()", does: "One brief per agent, no numbers"}
      - {name: "review()", does: "done, or follow-up asks for gaps or conflicts between agents"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: []
      persists: "Nothing of its own; the Editor's themes update the shared two-tier memory."

  - id: macro_agent
    name: Macro Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
      - {key: BLS_API_KEY, required: false, why: "BLS data; keyless allows 25 requests a day"}
    class: castelino.agents.update.macro.MacroAgent
    summary: >-
      Code pulls FRED releases, BLS CPI components and wages, jobless claims and market moves into
      numbered facts; the agent picks the findings that matter and cites the facts they rest on.
    tools:
      - {name: "collect()", does: "FRED releases + 1d/1w/1m returns for the instrument universe"}
      - {name: "bls_facts()", does: "CPI shelter, energy, food and average hourly earnings m/m"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: news_agent
    name: News Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.news.NewsAgent
    summary: >-
      One cited web search for the day's market-moving stories; every cited line becomes a fact,
      and the agent picks findings from those facts only.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: alt_agent
    name: Alt Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search for X (gpt-6-luna)"}
    class: castelino.agents.update.alt.AltAgent
    summary: >-
      Polymarket odds and their 1-day / 1-week moves on economy markets (code, no key) plus what
      financial X is saying (cited web search); picks the findings where the crowd moved.
    tools:
      - {name: "polymarket.facts()", does: "Gamma API economy events ranked by odds move"}
      - {name: "X via web_search", does: "Cited lines of what macro accounts are posting"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: ai_agent
    name: AI Analyst
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.ai.AiAgent
    summary: >-
      One cited web search for the day's AI model releases, credibly reported upcoming releases,
      new AI chips and AI industry news; every cited line becomes a fact, and the agent picks
      findings from those facts only. The Editor always gives it one item when it found any.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: update_editor
    name: Update Editor
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol)"}
    class: castelino.agents.update.editor.UpdateEditor
    summary: >-
      Writes the Morning Note (headline, 3 key takeaways, 5 ranked items of about 400 words that
      run what happened, why, then how it came about from code-pulled background) and picks each
      item's chart form. A number guard checks every figure.
    tools:
      - {name: "Background (code)", does: "Stock price history, a release's last 12 readings or a series' recent moves, and earlier ARC notes, linked to the findings as facts"}
      - {name: "Chart agent (code)", does: "Draws the picked form (range, movers, ladder, columns, dumbbell, vs expected, compare, line); a bad pick falls back to a line chart"}
      - {name: "check_note (guard)", does: "Every %, bp or pp must be in the facts behind the cited findings; one retry"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: ["Theme notes (touched and new)", "data/updates/<date>.json — written last, marks the day done"]
      persists: >-
        Two-tier markdown in data/update_agent/memory/. Caps (5 short / 20 long) and eviction by
        importance minus whole months unused are enforced in code, not the prompt.

  - id: theme_picker
    name: Theme Picker
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol) + web search (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED series; falls back to the keyless CSV endpoint when unset"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN and X_ACCESS_SECRET, the 08:00 weekday run posts its X thread; else it only logs it"}
    class: castelino.agents.themes.ThemePicker
    summary: >-
      At 08:00 and 20:00 ET, picks the single most popular US macro theme from what news and
      financial X discuss, the biggest market moves and Polymarket odds swings, then picks 6
      charts that show it (at least 5 must draw). Code fetches and draws every plotted number. On
      weekdays the 08:00 run is published on Substack (a card on /themes) and posted to X as a thread
      linking that post, with no approval step for either.
    tools:
      - {name: "gather() (code)", does: "One cited web search for the most-discussed macro themes, 1d/1w/1m market moves, Polymarket economy + Fed odds swings"}
      - {name: "resolve() (code)", does: "Fetches each fred:/yahoo: series a chart names; the weekly guard drops a chart that can't be drawn"}
      - {name: "Chart renderer (code)", does: "The Weekly Deep Dive's line / compare / movers exhibits plus heatmap, scatter and range (theme_charts.py), kicker THEME CHARTS"}
      - {name: "Number guard", does: "Every %, bp or pp in the theme, why and signals must be in the cited facts; one retry"}
      - {name: "Substack post (code)", does: "Weekdays at 08:00: theme as title, why, the three signals, every chart, sources; published in Financial Markets, web only (no email); URL in data/themes/substack/, never posted twice"}
      - {name: "X thread (code)", does: "Weekdays after the 08:00 publish: theme + why with chart 1, one post per further chart (title + code-written subtitle), then the Substack post's link; ids in data/x_posts/themes/, never posted twice"}
    memory:
      reads: ["The last 6 runs' themes (data/themes/*.json)"]
      writes: ["data/themes/<date>-<am|pm>.json + charts/<run>/exhibit_N.png"]
      persists: "Each run's record; its theme and streak are the next run's memory."

  - id: move_explainer
    name: Move Explainer
    group: Market alerts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Web search (web_search.model)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_MOVES_LIVE=1, posts go live; else dry run"}
    prompt: "castelino.x_moves:SYSTEM"
    summary: >-
      Every 30 minutes in US trading hours code checks 10 markets on Yahoo; one that moves at least
      2.5x its typical daily move is posted to X. Code writes every number; this one cited web
      search adds the one-sentence "Why:" line, dropped when the search cited nothing.
    tools:
      - {name: "check() (code)", does: "5y of Yahoo daily bars per market: today's move, z vs the past 252 days, last day as big"}
      - {name: "web_search", does: "One cited search per post; only a cited sentence of at most 200 characters is kept"}
      - {name: "compose() + post (code)", does: "Lead move, up to 3 others, the why if it fits 280 characters, the link; x_post.post or the dry-run log"}
    memory:
      reads: ["Today's posts (data/x_posts/moves/<date>.json)"]
      writes: ["data/x_posts/moves/<date>.json"]
      persists: "Each day's posts: a market posts once a day, at most 3 posts a day."

  - id: x_chart_picker
    name: Chart Picker
    group: Market alerts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (fast tier)"}
      - {key: FRED_API_KEY, required: false, why: "A fred: context series; falls back to the keyless CSV endpoint when unset"}
    class: castelino.x_moves.ChartPicker
    summary: >-
      Picks the one chart for each market-alert post: today's intraday path (the default) or a
      context chart of one series the Why line points at (a yield, oil, a stock, a release). Code
      fetches and draws every plotted value; any failure falls back to the intraday chart, then to
      a text-only post.
    tools:
      - {name: "intraday_chart() (code)", does: "Yahoo 5-minute bars, change since yesterday's close, one line per market of the lead's unit"}
      - {name: "context_chart() (code)", does: "One fred:/yahoo: series over 30-365 days via Theme Charts' fetch_series, drawn with the Morning Note's line chart"}
    memory:
      reads: ["The post being made: its markets, moves and Why line"]
      writes: ["data/x_posts/moves/<date>/<HHMM>.png"]
      persists: "Nothing; the day file records which chart went out and why."

  - id: desk_chat
    name: Desk Chat
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.update.desk.DeskChatAgent
    summary: >-
      On the private admin Daily desk, answers questions about one agent's work on one day
      (Macro, News, Alt, AI or the Editor), from that day's saved findings and facts only, citing
      their ids. Read-only: re-runs, rebuilds and Substack drafts are separate buttons.
    tools: []
    memory: {reads: ["The day's findings and facts for that agent (the Editor also sees the note)", "The conversation so far, sent by the browser"], writes: [], persists: "Nothing."}

  - id: sector_narrative
    name: Sector Sentiment Narrative
    group: Briefings
    family: Sector Sentiment
    dependencies:
      - {key: OPENAI_API_KEY, required: false, why: "LLM call (OpenAI); without it the Sector Sentiment numbers still ship, just without the narrative"}
    class: castelino.agents.sector_explainer.SectorNarrativeAgent
    summary: >-
      Once a day after the Sector Sentiment refresh on dashboard start: a 3-5 sentence read
      of the sector divergence table, shown on /models. Describes only; never recommends.
    tools: []
    memory:
      reads: ["Today's SectorSentimentSnapshot (sectors, verdicts, notable stocks)", "The previous snapshot's narrative"]
      writes: ["snapshot.narrative in data/sector_sentiment.json"]
      persists: "The narrative is stored on the snapshot; the next day's run reads it for continuity."

  - id: sector_prose
    name: Sector Explainer
    group: Briefings
    family: Sector Sentiment
    dependencies:
      - {key: OPENAI_API_KEY, required: false, why: "LLM call (OpenAI); without it each sector drawer shows only the computed stats"}
    class: castelino.agents.sector_explainer.SectorProseAgent
    summary: >-
      One call per sector (11/day): 2-3 sentences explaining whether a sector's divergence is
      one stock's story or the whole sector's. The verdict is computed in code; the agent only
      explains it.
    tools: []
    memory:
      reads: ["One SectorScore + its 10 constituents' metrics and contributions"]
      writes: ["sector.explanation.prose in data/sector_sentiment.json"]
      persists: "None of its own."

  # ── Weekly deep dive ────────────────────────────────────────────────────
  - id: deep_lead
    name: Deep Lead
    group: Weekly deep dive
    family: Weekly Deep Dive
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol)"}
    class: castelino.agents.weekly.lead.DeepLead
    summary: >-
      Sunday morning: reads Monday–Friday's Morning Notes, picks the 10-12 trends that mattered and
      staffs 5 specialist desks, each owning 2-3 named trends with a goal and the tools it may use.
    tools:
      - {name: "plan()", does: "Trends + desk specs {name, description, goal, tools, related}"}
    memory:
      reads: ["The week's Morning Notes (data/updates/<day>.json)", "MEMORY.md — top 5 themes"]
      writes: []
      persists: "Nothing; the plan is saved in data/deep/<week>.json."

  - id: deep_trend_agent
    name: Trend Desk (sub-agent)
    group: Weekly deep dive
    family: Weekly Deep Dive
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Tool loop and web search (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
      - {key: BLS_API_KEY, required: false, why: "BLS data; keyless allows 25 requests a day"}
    prompt: "castelino.agents.weekly.subagent:SYSTEM"
    schema: "castelino.agents.weekly.models:FindingDrafts"
    summary: >-
      One instance per desk the Lead staffs (5, in parallel, 2-3 trends each). Owns the deep
      research: for each trend it works out why it happened, pulls a breakdown (sectors,
      components, regions) and the market reaction, with only the tools it was given (≤16 calls);
      code turns every result into a fact. Shares facts with related desks on a board, and
      answers the Editor's challenges with up to 4 more calls.
    tools:
      - {name: "fred_series / yahoo_prices / bls_series", does: "A series over a chosen window → one fact with levels and changes"}
      - {name: "polymarket_odds / web_search", does: "Odds and moves; cited search lines → facts"}
      - {name: "post_to_board / read_board", does: "Share facts with related desks"}
    memory: {reads: ["Its goal and trends from the Lead", "The week's Morning Notes"], writes: [], persists: "Nothing."}

  - id: deep_editor
    name: Deep Editor
    group: Weekly deep dive
    family: Weekly Deep Dive
    dependencies:
      - {key: ANTHROPIC_API_KEY, required: true, why: "Claude Opus 5.5 (effort high)"}
    prompt: "castelino.agents.weekly.editor:SYSTEM"
    schema: "castelino.agents.weekly.models:WeeklyReport"
    summary: >-
      Claude Opus 5.5 in one append-only conversation: grills every desk's research against the
      week's Morning Notes for up to 2 rounds, then writes each trend as a high level (from our
      notes) plus deep research (why, under the surface, what it means for markets, what to
      watch). A number guard checks every figure, including chart values.
    tools:
      - {name: "Grill", does: "Questions routed back to the owning desk, answers appended"}
      - {name: "check_report (guard)", does: "Every %, bp or pp must be in the cited facts; one retry"}
      - {name: "Chart agent (code)", does: "Editor-chosen form per exhibit: line, compare, release, breakdown, movers, dumbbell"}
    memory:
      reads: ["The plan, every desk's findings and facts, the board"]
      writes: ["data/deep/<week>.json — written last, marks the week done"]
      persists: "The report and the grill log in the week's record."

  # ── Trading pipeline ────────────────────────────────────────────────────
  - id: deep_clarifier
    name: Deep Research · Clarifier
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.deep.clarifier.ClarifierAgent
    summary: "Rewords the raw question and asks up to 3 clarifying questions before research starts."
    tools: []
    memory:
      reads: ["The raw query"]
      writes: ["Reworded query + clarifying questions"]
      persists: "Session saved to data/research/<id>.json."

  - id: deep_lead
    name: Deep Research · Lead
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.deep.lead.LeadAgent
    summary: "Decomposes the clarified question into at most 6 sub-questions; re-plans on gaps in later rounds."
    tools: []
    memory:
      reads: ["Reworded query + answers", "Round number", "Gaps from the previous synthesis"]
      writes: ["Sub-questions → parallel sub-agents"]
      persists: "Session file."

  - id: deep_sub_agent
    name: Deep Research · Sub-agent
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (OpenAI web_search tool)"}
    prompt: "castelino.agents.research.deep.sub_agent:SYSTEM"
    schema: "castelino.agents.research.deep.models:SubFinding"
    tier: fast
    summary: "One per sub-question, run in parallel: searches the web (OpenAI web_search) and distils cited findings."
    tools:
      - {name: "OpenAI web_search", does: "Web search with citations (global budget of 15 calls per report)"}
    memory:
      reads: ["One sub-question"]
      writes: ["Cited findings → Synthesizer"]
      persists: "Session file."

  - id: deep_synthesizer
    name: Deep Research · Synthesizer
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: OPENBB_PAT, required: false, why: "OpenBB data; uses saved OpenBB user settings or degrades gracefully when unset"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
    prompt: "castelino.agents.research.deep.synthesizer:SYNTH_SYSTEM"
    schema: "castelino.agents.research.deep.models:DeepResearchReport"
    tier: reasoning
    summary: "Writes the cited report from all findings, reflects on gaps (up to 2 rounds) and proposes supporting charts."
    tools:
      - {name: "ChartResolver", does: "Deterministic: maps chart specs to OpenBB/FRED data; bad specs are dropped"}
    memory:
      reads: ["All sub-agent findings", "Previous round's gaps"]
      writes: ["DeepResearchReport (answer, citations, charts)"]
      persists: "Report saved to data/research/<id>.json; not fed into the trading pipeline."

  # ── Research metrics ────────────────────────────────────────────────────
  - id: adoption_extractor
    name: AI Adoption · Claim extractor
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.adoption.extract.AdoptionExtractor
    summary: >-
      Reads AI passages from a company's latest 10-K/10-Q and returns verbatim quotes rated
      1 pilot, 2 deployed, 3 revenue-linked. Feeds the Talk pillar of the AI Adoption Index
      (`ckm adoption run`); research metric, not wired into the trading pipeline.
    tools:
      - {name: "ai_passages", does: "Deterministic keyword prefilter: only text windows around AI mentions are sent"}
      - {name: "keep_verified (quote guard)", does: "Drops any claim whose quote is not in the filing text, has a depth outside 1-3, or repeats"}
    memory:
      reads: ["AI passages from one filing"]
      writes: ["Guard-passed claims → Talk score"]
      persists: "Claims and Talk cached per filing in data/adoption/adoption.db; an unchanged filing is never re-sent."

  - id: recipe_writer
    name: AI Adoption · Job-board recipe writer
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "GPT-6 Astra tool loop (OpenAI Responses API)"}
    prompt: "castelino.adoption.recipe_agent:SYSTEM"
    schema: "castelino.adoption.sources.recipes:Recipe"
    summary: >-
      Layer 3 of the Hire pillar. For a company whose careers site has no known data address,
      GPT-6 Astra explores it once in a headless browser and proposes a Recipe saying where the
      job titles live. Our replay code tests and saves it; every refresh replays the recipe with
      no model. Run by hand (scripts/write_recipes.py), capped at 15 steps and $3 per company.
    tools:
      - {name: "open_page", does: "Headless Chromium load: visible text, job links, and the JSON requests the page made"}
      - {name: "sample_selector", does: "Texts matching a CSS selector, to check a page-element recipe"}
      - {name: "test_recipe", does: "Runs the recipe with our replay code; returns count and 10 sample titles"}
      - {name: "submit_recipe (guard)", does: "Accepted only if our replay returns titles from the company's site or a known hiring platform"}
    memory:
      reads: ["Ticker, company name, careers start URL", "Its own tool results within one company"]
      writes: ["Recipe → data/adoption/recipes/<TICKER>.json (saved by the script)"]
      persists: "Only the accepted recipe file; nothing carries over between companies."

  # ── Triggers ────────────────────────────────────────────────────────────
# System architecture diagrams on /agents: one entry per `group` above. The first entry is
# the page's default view. A lane is a list of steps (left → right) and each step is a list
# of boxes drawn stacked (parallel). Box string = "kind:text|caption", where kind is
# agent (text = an agent id; opens it), code (deterministic), gate (waits for a human),
# end (output), system (text = another group; opens its diagram), or no kind = an input.
# loops/regions use 0-based step indexes. Keep lanes ≤ 5 steps (so they fit the card); split long ones into
# numbered stages. tests/test_agent_catalog.py checks every reference.
systems:
  - group: Briefings
    trigger: "Top-bar Refresh button (once a day)"
    output: "The /updates Morning Note and the Fear & Greed · Sector Sentiment card on Radar"
    blurb: >-
      An Orchestrator briefs four research agents and reviews what they find; an Editor writes
      the Morning Note. Code supplies every number, and a guard checks each figure before saving.
    lanes:
      - title: "Daily Update 1 · Research"
        flow: [["Refresh"], ["agent:update_orchestrator|plan briefs"], ["agent:macro_agent|FRED · BLS · Yahoo", "agent:news_agent|web_search", "agent:alt_agent|Polymarket · X", "agent:ai_agent|AI models · chips"], ["agent:update_orchestrator|review"], ["end:↓ to stage 2"]]
        regions: [{from: 1, to: 3, label: "Loop · max 2 follow-up rounds"}]
        loops: [{from: 3, to: 2, label: "follow-ups"}]
      - title: "Daily Update 2 · Write"
        flow: [["code:Background|stock · data · past notes"], ["agent:update_editor|Morning Note"], ["code:Number guard|1 retry"], ["code:Chart agent|8 chart forms"], ["end:/updates|+ 2-tier memory"]]
        loops: [{from: 2, to: 1, label: "retry with errors"}]
      - title: "Admin · Daily desk"
        flow: [["Your question on /admin"], ["agent:desk_chat|one day · one agent"], ["end:Answer with fact ids"]]
      - title: "Sector Sentiment"
        flow: [["Refresh"], ["code:Divergence scores|top-10 per sector", "code:Fear & Greed|5 market signals"], ["agent:sector_narrative|1 call", "agent:sector_prose|11 calls"], ["end:Card on Radar"]]

  - group: Theme Charts
    trigger: "Cron on the Fly server at 08:00 and 20:00 ET"
    output: "The top macro theme, three signals and 5-6 charts; the 08:00 weekday run is published on Substack (a card on /themes) and posted to X as a thread"
    blurb: >-
      Code gathers three signals: what news and financial X discuss most, the biggest market moves
      and Polymarket odds swings. One Theme Picker call names the theme and picks the charts; code
      fetches and draws every plotted number, and a guard checks each figure.
    lanes:
      - title: "Theme Charts 1 · Pick"
        flow: [["08:00 · 20:00 ET"], ["code:News & X|cited web search", "code:Market moves|1d · 1w · 1m", "code:Polymarket|odds swings"], ["agent:theme_picker|#1 theme + 5-6 charts"], ["code:Number guard|1 retry"], ["end:↓ to stage 2"]]
        loops: [{from: 3, to: 2, label: "retry with errors"}]
      - title: "Theme Charts 2 · Chart & publish"
        flow: [["code:Fetch series|FRED · Yahoo"], ["code:Chart forms|heatmap · scatter · range"], ["code:Save run|last 6 runs = memory"], ["end:Substack post|08:00 weekdays · /themes card", "end:X thread|08:00 weekdays"]]

  - group: Market alerts
    trigger: "Cron on the Fly server every 30 minutes, 9:35-16:05 ET on weekdays"
    output: "A post on X with one chart for each market move of at least 2.5 sigma (dry run until X_MOVES_LIVE=1)"
    blurb: >-
      Code measures today's move in 10 markets against their past year and decides what to post.
      One Move Explainer search adds a cited reason; code writes every number in the post.
    lanes:
      - title: "Market alerts"
        flow: [["Every 30 min"], ["code:Market check|10 markets · z ≥ 2.5"], ["agent:move_explainer|cited why"], ["agent:x_chart_picker|intraday or context chart"], ["end:Post on X|+ chart · or dry-run log"]]

  - group: Deep research
    trigger: "A question asked on /deep-research"
    output: "A cited report with charts in data/research/"
    blurb: >-
      A plain asyncio state machine. Sub-agents search the web in parallel and the Synthesizer
      can send gaps back to the Lead. Capped at 15 web searches per report.
    lanes:
      - title: "1 · Clarify"
        flow: [["Your question"], ["agent:deep_clarifier"], ["gate:You answer|or skip"], ["end:↓ to stage 2"]]
      - title: "2 · Research"
        flow: [["agent:deep_lead"], ["agent:deep_sub_agent|web_search", "agent:deep_sub_agent|web_search", "agent:deep_sub_agent|≤6 in parallel"], ["agent:deep_synthesizer"], ["code:ChartResolver|OpenBB / FRED"], ["end:Cited report"]]
        regions: [{from: 0, to: 2, label: "Loop · max 2 rounds"}]
        loops: [{from: 2, to: 0, label: "gaps → re-plan"}]

  - group: Research metrics
    trigger: "Refresh (AI Adoption Index); recipes are written by hand"
    output: "Talk and Hire scores in the AI Adoption Index"
    blurb: >-
      The LLM is fenced in by code on both sides: a quote is kept only if it is really in the
      filing, and a recipe only if our own replay returns real job titles.
    lanes:
      - title: "Talk pillar"
        flow: [["10-K / 10-Q"], ["code:AI-passage prefilter"], ["agent:adoption_extractor"], ["code:Quote guard|quote must be in filing"], ["end:Talk score|cached per filing"]]
      - title: "Hire pillar · layer 3"
        flow: [["Custom careers site"], ["agent:recipe_writer|≤15 steps, $3"], ["code:Replay test|≥90% coverage"], ["end:Saved recipe|replayed, no model"]]
        loops: [{from: 2, to: 1, label: "rejected → try again"}]

  - group: Weekly deep dive
    trigger: "Sunday 06:00 ET (cron), or Refresh once a report is due"
    output: "The Weekly Deep Dive on /deep-research and a full Substack draft"
    blurb: >-
      A Lead picks the week's 10-12 trends and staffs 5 desks that pull their own data and share a
      board. Claude Opus 5.5 grills every desk, then writes the report; code checks each figure.
    lanes:
      - title: "Weekly Deep Dive 1 · Research"
        flow: [["Week's Morning Notes"], ["agent:deep_lead|trends + desks"], ["agent:deep_trend_agent|desk 1", "agent:deep_trend_agent|desk 2", "agent:deep_trend_agent|5 desks, shared board"], ["end:↓ to stage 2"]]
      - title: "Weekly Deep Dive 2 · Grill & write"
        flow: [["agent:deep_editor|grill"], ["agent:deep_trend_agent|answers"], ["agent:deep_editor|write"], ["code:Number guard + charts"], ["end:/deep-research|+ Substack draft"]]
        regions: [{from: 0, to: 1, label: "Loop · max 2 grill rounds"}]
        loops: [{from: 1, to: 0, label: "next round"}]
