# Agent registry — one entry per LLM agent, shown on the dashboard's /agents page.
#
# Adding an agent: add an entry here. `class` (a StructuredAgent) makes the page read the
# live system prompt, model tier and output schema from code. For agents that aren't
# StructuredAgents, point `prompt` at a module-level prompt constant and `schema` at the
# output model ("module.path:NAME"). tools/memory/dependencies are descriptions you maintain
# here; `dependencies` lists the env keys the agent needs (required or optional).
# tests/test_agent_catalog.py fails if a StructuredAgent class is missing from this file.

agents:
  # ── Briefings ───────────────────────────────────────────────────────────
  - id: update_orchestrator
    name: Update Orchestrator
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM calls (gpt-6-sol)"}
    class: castelino.agents.update.orchestrator.UpdateOrchestrator
    summary: >-
      Runs the morning research desk: briefs the Macro, News and Alt agents from memory, then
      reviews what they found and sends up to one follow-up ask per agent (max 2 rounds).
    tools:
      - {name: "plan()", does: "One brief per agent, no numbers"}
      - {name: "review()", does: "done, or follow-up asks for gaps or conflicts between agents"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: []
      persists: "Nothing of its own; the Editor's themes update the shared two-tier memory."

  - id: macro_agent
    name: Macro Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
      - {key: BLS_API_KEY, required: false, why: "BLS data; keyless allows 25 requests a day"}
    class: castelino.agents.update.macro.MacroAgent
    summary: >-
      Code pulls FRED releases, BLS CPI components and wages, jobless claims and market moves into
      numbered facts; the agent picks the findings that matter and cites the facts they rest on.
    tools:
      - {name: "collect()", does: "FRED releases + 1d/1w/1m returns for the instrument universe"}
      - {name: "bls_facts()", does: "CPI shelter, energy, food and average hourly earnings m/m"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: news_agent
    name: News Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.news.NewsAgent
    summary: >-
      One cited web search for the day's market-moving stories; every cited line becomes a fact,
      and the agent picks findings from those facts only.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: alt_agent
    name: Alt Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search for X (gpt-6-luna)"}
    class: castelino.agents.update.alt.AltAgent
    summary: >-
      Polymarket odds and their 1-day / 1-week moves on economy markets (code, no key) plus what
      financial X is saying (cited web search); picks the findings where the crowd moved.
    tools:
      - {name: "polymarket.facts()", does: "Gamma API economy events ranked by odds move"}
      - {name: "X via web_search", does: "Cited lines of what macro accounts are posting"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: ai_agent
    name: AI Analyst
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.ai.AiAgent
    summary: >-
      One cited web search for the day's AI model releases, credibly reported upcoming releases,
      new AI chips and AI industry news; every cited line becomes a fact, and the agent picks
      findings from those facts only. The Editor always gives it one item when it found any.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: update_editor
    name: Update Editor
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol)"}
    class: castelino.agents.update.editor.UpdateEditor
    summary: >-
      Writes the Morning Note (headline, 3 key takeaways, 5 ranked items of about 400 words that
      run what happened, why, then how it came about from code-pulled background) and picks each
      item's chart form. A number guard checks every figure.
    tools:
      - {name: "Background (code)", does: "Stock price history, a release's last 12 readings or a series' recent moves, and earlier ARC notes, linked to the findings as facts"}
      - {name: "Chart agent (code)", does: "Draws the picked form (range, movers, ladder, columns, dumbbell, vs expected, compare, line); a bad pick falls back to a line chart"}
      - {name: "check_note (guard)", does: "Every %, bp or pp must be in the facts behind the cited findings; one retry"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: ["Theme notes (touched and new)", "data/updates/<date>.json — written last, marks the day done"]
      persists: >-
        Two-tier markdown in data/update_agent/memory/. Caps (5 short / 20 long) and eviction by
        importance minus whole months unused are enforced in code, not the prompt.

  - id: theme_picker
    name: Theme Picker
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol) + web search (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED series; falls back to the keyless CSV endpoint when unset"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN and X_ACCESS_SECRET, the 08:00 weekday run posts its X thread; else it only logs it"}
    class: castelino.agents.themes.ThemePicker
    summary: >-
      At 08:00 ET on weekdays, picks the single most popular US macro theme from what news and
      financial X discuss, the biggest market moves and Polymarket odds swings, then picks 6
      charts that show it (at least 5 must draw). Code fetches and draws every plotted number. Each
      run is published on Substack (a card on /themes) and posted to X as a thread
      linking that post, with no approval step for either.
    tools:
      - {name: "gather() (code)", does: "One cited web search for the most-discussed macro themes, 1d/1w/1m market moves, Polymarket economy + Fed odds swings"}
      - {name: "resolve() (code)", does: "Fetches each fred:/yahoo: series a chart names; the weekly guard drops a chart that can't be drawn"}
      - {name: "Chart renderer (code)", does: "The Weekly Deep Dive's line / compare / movers exhibits plus heatmap, together (how often two markets moved the same way) and range (theme_charts.py), kicker THEME CHARTS"}
      - {name: "Number guard", does: "Every %, bp or pp in the theme, why and signals must be in the cited facts; one retry"}
      - {name: "Substack post (code)", does: "Weekdays at 08:00: theme as title, why, the three signals, every chart, sources; published in Financial Markets, web only (no email); URL in data/themes/substack/, never posted twice"}
      - {name: "X thread (code)", does: "Weekdays after the 08:00 publish: theme + why with chart 1, one post per further chart (title + code-written subtitle + the Chart Explainer's plain line), then the Substack post's link; ids and texts in data/x_posts/themes/, never posted twice"}
    memory:
      reads: ["The last 6 runs' themes (data/themes/*.json)"]
      writes: ["data/themes/<date>-<am|pm>.json + charts/<run>/exhibit_N.png"]
      persists: "Each run's record; its theme and streak are the next run's memory."

  - id: chart_explainer
    name: Chart Explainer
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.themes.ChartExplainer
    summary: >-
      Before the weekday X thread goes out, one cheap call writes a short heading and one plain
      sentence under each chart after the first, saying what it shows for the day's theme. No
      figures: a line with any digit is dropped, so every number on X stays the code's. If the call
      fails, the thread posts without the lines.
    tools: []
    memory: {reads: ["The run's theme and why, and each chart's title, kind and code-written data line"], writes: ["The posted texts, saved with the X ids in data/x_posts/themes/"], persists: "Nothing between runs."}

  - id: chart_commentary
    name: Chart Commentary
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.themes.ChartCommentary
    summary: >-
      When the weekday Theme Charts post is published on Substack, one cheap call writes two or
      three plain sentences under every chart: what it shows and why it matters for the day's
      theme. A paragraph with a %, bp or pp figure that isn't among the run's facts or that chart's
      data line is dropped; if the call fails, the post publishes without commentary.
    tools: []
    memory: {reads: ["The run's theme, why and three signals, and each chart's title, kind and code-written data line"], writes: ["The paragraphs, inside the Substack post"], persists: "Nothing between runs."}

  - id: move_explainer
    name: Move Explainer
    group: Market alerts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Web search (web_search.model)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_MOVES_LIVE=1, posts go live; else dry run"}
    prompt: "castelino.x_moves:SYSTEM"
    summary: >-
      Every 30 minutes in US trading hours code checks 10 markets on Yahoo; one that moves at least
      2.5x its typical daily move is posted to X. Code writes every number; this one cited web
      search adds the one-sentence "Why:" line, dropped when the search cited nothing.
    tools:
      - {name: "check() (code)", does: "5y of Yahoo daily bars per market: today's move, z vs the past 252 days, last day as big"}
      - {name: "web_search", does: "One cited search per post; only a cited sentence of at most 200 characters is kept"}
      - {name: "compose() + post (code)", does: "Lead move, up to 3 others, the why if it fits 280 characters, the link; x_post.post or the dry-run log"}
    memory:
      reads: ["Today's posts (data/x_posts/moves/<date>.json)"]
      writes: ["data/x_posts/moves/<date>.json"]
      persists: "Each day's posts: a market posts once a day, at most 3 posts a day."

  - id: x_chart_picker
    name: Chart Picker
    group: Market alerts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (fast tier)"}
      - {key: FRED_API_KEY, required: false, why: "A fred: context series; falls back to the keyless CSV endpoint when unset"}
    class: castelino.x_moves.ChartPicker
    summary: >-
      Picks the one chart for each market-alert post: today's intraday path (the default) or a
      context chart of one series the Why line points at (a yield, oil, a stock, a release). Code
      fetches and draws every plotted value; any failure falls back to the intraday chart, then to
      a text-only post.
    tools:
      - {name: "intraday_chart() (code)", does: "Yahoo 5-minute bars, change since yesterday's close, one line per market of the lead's unit"}
      - {name: "context_chart() (code)", does: "One fred:/yahoo: series over 30-365 days via Theme Charts' fetch_series, drawn with the Morning Note's line chart"}
    memory:
      reads: ["The post being made: its markets, moves and Why line"]
      writes: ["data/x_posts/moves/<date>/<HHMM>.png"]
      persists: "Nothing; the day file records which chart went out and why."

  - id: x_scout_search
    name: Scout Search
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Web search (x_scout.search_model, gpt-6-luna)"}
    prompt: "castelino.x_scout:SCAN_USER"
    summary: >-
      Every 2 hours on weekdays from 10:15 ET (and Saturday noon), one cited web search lists up to 8 macro and AI
      items from the last 6 hours: data releases against forecasts, central banks, model and chip
      launches, AI capex. Lines without a citation are dropped before the Scout sees them.
    tools:
      - {name: "web_search", does: "One cited search per run; each cited line becomes a fact with its numbers and source"}
    memory: {reads: ["The time of the run"], writes: ["Nothing; the cited items go straight to the Scout"], persists: "Nothing between runs."}

  - id: x_scout
    name: Scout
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (x_scout.scout_model, gpt-6-sol)"}
      - {key: FRED_API_KEY, required: false, why: "A fred: chart series; falls back to the keyless CSV endpoint when unset"}
    class: castelino.x_scout.Scout
    summary: >-
      Picks the one cited item a macro investor would stop scrolling for, or nothing (the usual
      answer), and names 1-4 FRED or Yahoo series to chart it. Code fetches and draws every plotted
      value; a chart that can't be drawn means no post.
    tools:
      - {name: "chart() (code)", does: "fetch_series per series, drawn as one line or 2-4 compared (prices rebased to 100) with the Morning Note renderer"}
    memory:
      reads: ["The cited items", "This account's posts from the last 7 days (data/x_posts/scout/)", "Today's market alerts (data/x_posts/moves/)"]
      writes: ["data/x_posts/scout/<date>/<HHMM>.png"]
      persists: "Each day's posts; code also refuses a source URL already posted in the last 7 days."

  - id: x_scout_writer
    name: Scout Writer
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (x_scout.writer_model, gpt-6-luna)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_SCOUT_LIVE=1, posts go live; else dry run"}
    class: castelino.x_scout.Writer
    summary: >-
      Writes the lead post (the finding and what the chart shows) and one reply (2-3 sentences of
      analysis) from the cited line and the chart's code-computed numbers. Any number not among
      them, or a post over 280 characters, gets one retry, then nothing is posted. Code adds the
      topic tag and the source link.
    tools:
      - {name: "check() (code)", does: "Every figure must be in the source line or the chart data (unit figures via the Morning Note guard); each post ≤280"}
      - {name: "x_post (code)", does: "Uploads the chart, posts the lead, then the reply under it; dry-run log until X_SCOUT_LIVE=1"}
    memory:
      reads: ["The picked cited line", "The chart's numbers: last, change, high, low, below the high, rebased level"]
      writes: ["data/x_posts/scout/<date>.json (texts, chart, X ids, dry_run)"]
      persists: "Each day's posts: at most 2 a day."

  - id: desk_chat
    name: Desk Chat
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.update.desk.DeskChatAgent
    summary: >-
      On the private admin Daily desk, answers questions about one agent's work on one day
      (Macro, News, Alt, AI or the Editor), from that day's saved findings and facts only, citing
      their ids. Read-only: re-runs, rebuilds and Substack drafts are separate buttons.
    tools: []
    memory: {reads: ["The day's findings and facts for that agent (the Editor also sees the note)", "The conversation so far, sent by the browser"], writes: [], persists: "Nothing."}

  - id: cover_artist
    name: Cover Artist
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (fast tier) + image model (cover.model, gpt-image-2)"}
      - {key: SUBSTACK_SID, required: false, why: "Sets the image as the draft's cover; unset = no draft, no cover"}
    class: castelino.cover.CoverArtist
    summary: >-
      Gives each Morning Note and Weekly Deep Dive Substack draft a cover image. One fast call turns
      the headline and stories into a 2-3 word title, the public figures the post names (Fed
      officials, CEOs) and a few things to draw, with the companies' logos; code keeps only people
      the post names, wraps it in a fixed style and the image model draws a 16:9 cover (redrawn
      once with generic people if it refuses a real person). Only a draft with no cover gets one, so a
      cover set by hand is kept; a failure leaves the draft without one.
    tools:
      - {name: "draw() (code)", does: "One image call (config cover: gpt-image-2, 1536x864, high) with the fixed STYLE prompt + title + scene"}
      - {name: "substack.push(cover=)", does: "Uploads the PNG and sets it as the draft's cover_image"}
    memory:
      reads: ["The finished note: headline + story titles (weekly: report title + trend titles)"]
      writes: ["data/updates/covers/<day>.png", "data/deep/covers/<week>.png"]
      persists: "The PNG, so a rerun never pays twice; `python -m castelino.cover <day|week>` redraws it."

  # ── Trade Lab (/admin only) ─────────────────────────────────────────────
  - id: trade_framer
    name: Trade Lab · Framer
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
      - {key: OPENAI_API_KEY, required: true, why: "Fallback model and the why-now web search"}
    prompt: "castelino.agents.trade.framer:SYSTEM"
    schema: "castelino.agents.trade.models:Frame"
    summary: >-
      Turns a trade idea into a testable thesis: Yahoo tickers for the subject and its benchmarks, a
      horizon, and 1 to 3 tests that would prove it wrong. Code checks every ticker has prices and
      adds one cited search on why the idea matters now.
    tools:
      - {name: "Ticker check (code)", does: "Each ticker must return Yahoo prices; one retry naming the bad ones"}
      - {name: "Why-now search", does: "One cited web search; up to 8 cited lines become facts"}
    memory:
      reads: ["The user's sentence"]
      writes: ["Frame + F facts in data/trades/<id>/idea.json"]
      persists: "The idea record."

  - id: trade_bull
    name: Trade Lab · Bull
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
      - {key: OPENAI_API_KEY, required: true, why: "Web search (gpt-6-luna) and the fallback model"}
    prompt: "castelino.agents.trade.debate:BULL"
    schema: "castelino.agents.trade.models:TurnDraft"
    summary: >-
      Argues for the idea: researches its own case (up to 8 tool calls), then answers the bear twice.
      Every number must be in a fact it cites.
    tools:
      - {name: "yahoo_prices / fred_series / technicals / polymarket_odds / web_search", does: "Facts computed by code or cited lines"}
    memory:
      reads: ["Frame, framer facts, the bear's last turn"]
      writes: ["Turns + B facts"]
      persists: "The idea record."

  - id: trade_bear
    name: Trade Lab · Bear
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
      - {key: OPENAI_API_KEY, required: true, why: "Web search (gpt-6-luna) and the fallback model"}
    prompt: "castelino.agents.trade.debate:BEAR"
    schema: "castelino.agents.trade.models:TurnDraft"
    summary: >-
      Argues against the idea the same way: its own research, then two rebuttals. No winner is named.
    tools:
      - {name: "yahoo_prices / fred_series / technicals / polymarket_odds / web_search", does: "Facts computed by code or cited lines"}
    memory:
      reads: ["Frame, framer facts, the bull's last turn"]
      writes: ["Turns + R facts"]
      persists: "The idea record."

  - id: trade_moderator
    name: Trade Lab · Moderator
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
    prompt: "castelino.agents.trade.debate:MODERATOR"
    schema: "castelino.agents.trade.models:Moderation"
    summary: >-
      Lists what the debate settled (with fact ids) and 2 to 4 open questions, which start the research
      list. Never picks a winner.
    tools: []
    memory:
      reads: ["The six turns and their facts"]
      writes: ["Settled points and open questions"]
      persists: "The idea record."

  - id: trade_talk
    name: Trade Lab · Talk
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: true, why: "Claude Haiku 5.5 via OpenRouter; edits it fails twice go to Claude Sonnet 5.5"}
    prompt: "castelino.agents.trade.talk:SYSTEM"
    schema: "castelino.agents.trade.talk:Reply"
    summary: >-
      Answers the user in Talk 1 (after the debate) from what the idea already holds. Talk 2 is an
      assistant: each message runs as a job that searches first when it needs new facts (one news desk,
      up to 4 searches), answers, edits every part asked and updates the draft, listing each step, model
      and cost. No rounds.
    tools:
      - {name: "Number check (code)", does: "Figures must be in cited facts; else a plain refusal"}
      - {name: "News desk (Talk 2)", does: "Up to 4 cited searches in parallel; facts numbered Q<n>."}
      - {name: "Revise", does: "Claude Haiku 5.5 rewrites a part; two failed number checks hand it to Claude Sonnet 5.5"}
    memory:
      reads: ["Debate, findings, draft, facts, the last 6 messages"]
      writes: ["Talk messages with their trail; research items (Talk 1); Q facts; edited report parts"]
      persists: "The idea record."

  - id: trade_decide
    name: Trade Lab · Decisions
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "OpenAI Decisions API (/v1/decisions, gpt-6-luna)"}
    prompt: "castelino.agents.trade.decide:PROMPT"
    schema: "castelino.agents.trade.decide:YesNo"
    summary: >-
      Says yes or no after each talk message: worth researching (Talk 1: added to the list; Talk 2:
      searched right away) and, in Talk 2, an edit to the draft. Falls back to a gpt-6-luna yes/no if
      the beta API fails.
    tools: []
    memory:
      reads: ["The talk context and the latest message"]
      writes: ["A probability per question"]
      persists: "Logged with each message."

  - id: trade_orchestrator
    name: Trade Lab · Orchestrator
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "gpt-6-sol"}
    prompt: "castelino.agents.trade.orchestrator:SYSTEM"
    schema: "castelino.agents.trade.models:Briefs"
    summary: >-
      Turns the debate, the user's talk and the research list into three briefs: two news desks and the
      technical desk. Every research item must land in a brief.
    tools: []
    memory:
      reads: ["Debate, talk, research list, earlier rounds' briefs"]
      writes: ["Briefs for this round"]
      persists: "The idea record."

  - id: trade_news_desk
    name: Trade Lab · News desk
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "gpt-6-luna tool loop + cited web search"}
    prompt: "castelino.agents.trade.desks:NEWS"
    schema: "castelino.agents.trade.models:DeskReport"
    summary: >-
      Two run in parallel. Each searches widely (up to 12 calls: wires, press, regional press, filings,
      central banks), running a turn's searches at once; fewer than 6 outlets earns 3 more searches
      aimed at new ones.
    tools:
      - {name: "web_search / fred_series / yahoo_prices", does: "One fact per cited line or computed series"}
    memory:
      reads: ["Its brief and the facts so far"]
      writes: ["Findings + NA/NB facts"]
      persists: "The idea record."

  - id: trade_technical_desk
    name: Trade Lab · Technical desk
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "gpt-6-luna tool loop"}
    prompt: "castelino.agents.trade.desks:TECH"
    schema: "castelino.agents.trade.models:DeskReport"
    summary: >-
      Explains the price action with RSI, MACD, moving averages, 52-week range, volatility, drawdown,
      relative strength and COT positioning, all computed by code (up to 16 calls).
    tools:
      - {name: "technicals / cot / yahoo_prices / fred_series", does: "Numbers computed by code"}
    memory:
      reads: ["Its brief and the facts so far"]
      writes: ["Findings + T facts"]
      persists: "The idea record."

  - id: trade_chartist
    name: Trade Lab · Chart agent
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "gpt-6-luna; \"+ Another idea\" on the talk model (Claude Haiku 5.5)"}
    prompt: "castelino.agents.trade.chartist:SYSTEM"
    schema: "castelino.agents.trade.models:SpecList"
    summary: >-
      Brainstorms 3 charts for each of the report's 7 sections from a catalog of 12 forms (asking again
      for a section that drew only one), marking its pick. Code fetches and draws every option; picks
      need 6+ forms and at most 2 plain ones.
    tools:
      - {name: "Chart forms (code)", does: "treemap, quadrant, underwater, slope, waterfall, threshold band, dial, calendar, scatter, line, compare, bars"}
    memory:
      reads: ["Thesis, debate, findings, the user's questions"]
      writes: ["Chart options + C facts; PNGs in data/trades/<id>/charts/"]
      persists: "The idea record."

  - id: chart_desk
    name: Chart desk
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "gpt-6-luna, the chat default"}
      - {key: OPENROUTER_API_KEY, required: false, why: "Kimi K3 and the other open-weights models, when picked in the chat or Compare"}
    prompt: "castelino.agents.chart_desk:SYSTEM"
    schema: "castelino.agents.chart_desk:Proposal"
    summary: >-
      On the private admin Charts tab, turns your idea (and the thread so far) into up to 4 charts from
      Trade Lab's 12 forms; code fetches FRED / Yahoo data and draws each one. Compare models runs one
      prompt on several models side by side and you vote for the best. gpt-6-luna by default, only here.
    tools:
      - {name: "Chart forms (code)", does: "The same 12 forms as Trade Lab, kicker CHART DESK; a chart that can't be drawn shows why"}
    memory:
      reads: ["Your messages and the specs of the charts already drawn in this thread", "The 12-form catalog"]
      writes: ["data/chart_desk/<id>/run.json + PNGs; votes"]
      persists: "Threads, compare runs and votes, as files on the Fly volume."

  - id: trade_editor
    name: Trade Lab · Editor
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: ANTHROPIC_API_KEY, required: true, why: "Claude Opus 5.5 (effort high)"}
      - {key: SUBSTACK_SID, required: true, why: "Draft in Special Topics"}
    prompt: "castelino.agents.trade.editor:SYSTEM"
    schema: "castelino.agents.trade.models:Report"
    summary: >-
      Writes the report: introduction, takeaways, bull case, bear case, the user's questions tested,
      technical picture, our read, What to watch. Number check, one retry; a Substack draft, never published.
    tools:
      - {name: "Number guard (code)", does: "Every %, bp or pp must be in the cited facts"}
    memory:
      reads: ["Everything in the idea"]
      writes: ["The report; the draft id in data/trades/<id>/substack.json"]
      persists: "The idea record and the draft."

  - id: sector_narrative
    name: Sector Sentiment Narrative
    group: Briefings
    family: Sector Sentiment
    dependencies:
      - {key: OPENAI_API_KEY, required: false, why: "LLM call (OpenAI); without it the Sector Sentiment numbers still ship, just without the narrative"}
    class: castelino.agents.sector_explainer.SectorNarrativeAgent
    summary: >-
      Once a day after the Sector Sentiment refresh on dashboard start: a 3-5 sentence read
      of the sector divergence table, shown on /models. Describes only; never recommends.
    tools: []
    memory:
      reads: ["Today's SectorSentimentSnapshot (sectors, verdicts, notable stocks)", "The previous snapshot's narrative"]
      writes: ["snapshot.narrative in data/sector_sentiment.json"]
      persists: "The narrative is stored on the snapshot; the next day's run reads it for continuity."

  - id: sector_prose
    name: Sector Explainer
    group: Briefings
    family: Sector Sentiment
    dependencies:
      - {key: OPENAI_API_KEY, required: false, why: "LLM call (OpenAI); without it each sector drawer shows only the computed stats"}
    class: castelino.agents.sector_explainer.SectorProseAgent
    summary: >-
      One call per sector (11/day): 2-3 sentences explaining whether a sector's divergence is
      one stock's story or the whole sector's. The verdict is computed in code; the agent only
      explains it.
    tools: []
    memory:
      reads: ["One SectorScore + its 10 constituents' metrics and contributions"]
      writes: ["sector.explanation.prose in data/sector_sentiment.json"]
      persists: "None of its own."

  # ── Weekly deep dive ────────────────────────────────────────────────────
  - id: weekly_lead
    name: Deep Lead
    group: Weekly deep dive
    family: Weekly Deep Dive
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol)"}
    class: castelino.agents.weekly.lead.DeepLead
    summary: >-
      Sunday morning: reads Monday–Friday's Morning Notes, picks the 10-12 trends that mattered and
      staffs 5 specialist desks, each owning 2-3 named trends with a goal and the tools it may use.
    tools:
      - {name: "plan()", does: "Trends + desk specs {name, description, goal, tools, related}"}
    memory:
      reads: ["The week's Morning Notes (data/updates/<day>.json)", "MEMORY.md — top 5 themes"]
      writes: []
      persists: "Nothing; the plan is saved in data/deep/<week>.json."

  - id: deep_trend_agent
    name: Trend Desk (sub-agent)
    group: Weekly deep dive
    family: Weekly Deep Dive
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Tool loop and web search (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
      - {key: BLS_API_KEY, required: false, why: "BLS data; keyless allows 25 requests a day"}
    prompt: "castelino.agents.weekly.subagent:SYSTEM"
    schema: "castelino.agents.weekly.models:FindingDrafts"
    summary: >-
      One instance per desk the Lead staffs (5, in parallel, 2-3 trends each). Owns the deep
      research: for each trend it works out why it happened, pulls a breakdown (sectors,
      components, regions) and the market reaction, with only the tools it was given (≤16 calls);
      code turns every result into a fact. Shares facts with related desks on a board, and
      answers the Editor's challenges with up to 4 more calls.
    tools:
      - {name: "fred_series / yahoo_prices / bls_series", does: "A series over a chosen window → one fact with levels and changes"}
      - {name: "polymarket_odds / web_search", does: "Odds and moves; cited search lines → facts"}
      - {name: "post_to_board / read_board", does: "Share facts with related desks"}
    memory: {reads: ["Its goal and trends from the Lead", "The week's Morning Notes"], writes: [], persists: "Nothing."}

  - id: deep_editor
    name: Deep Editor
    group: Weekly deep dive
    family: Weekly Deep Dive
    dependencies:
      - {key: ANTHROPIC_API_KEY, required: true, why: "Claude Opus 5.5 (effort high)"}
    prompt: "castelino.agents.weekly.editor:SYSTEM"
    schema: "castelino.agents.weekly.models:WeeklyReport"
    summary: >-
      Claude Opus 5.5 in one append-only conversation: grills every desk's research against the
      week's Morning Notes for up to 2 rounds, then writes each trend as a high level (from our
      notes) plus deep research (why, under the surface, what it means for markets, what to
      watch). A number guard checks every figure, including chart values.
    tools:
      - {name: "Grill", does: "Questions routed back to the owning desk, answers appended"}
      - {name: "check_report (guard)", does: "Every %, bp or pp must be in the cited facts; one retry"}
      - {name: "Chart agent (code)", does: "Editor-chosen form per exhibit: line, compare, release, breakdown, movers, dumbbell"}
    memory:
      reads: ["The plan, every desk's findings and facts, the board"]
      writes: ["data/deep/<week>.json — written last, marks the week done"]
      persists: "The report and the grill log in the week's record."

  # ── Trading pipeline ────────────────────────────────────────────────────
  - id: deep_clarifier
    name: Deep Research · Clarifier
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.deep.clarifier.ClarifierAgent
    summary: "Rewords the raw question and asks up to 3 clarifying questions before research starts."
    tools: []
    memory:
      reads: ["The raw query"]
      writes: ["Reworded query + clarifying questions"]
      persists: "Session saved to data/research/<id>.json."

  - id: deep_lead
    name: Deep Research · Lead
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.deep.lead.LeadAgent
    summary: "Decomposes the clarified question into at most 6 sub-questions; re-plans on gaps in later rounds."
    tools: []
    memory:
      reads: ["Reworded query + answers", "Round number", "Gaps from the previous synthesis"]
      writes: ["Sub-questions → parallel sub-agents"]
      persists: "Session file."

  - id: deep_sub_agent
    name: Deep Research · Sub-agent
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (OpenAI web_search tool)"}
    prompt: "castelino.agents.research.deep.sub_agent:SYSTEM"
    schema: "castelino.agents.research.deep.models:SubFinding"
    tier: fast
    summary: "One per sub-question, run in parallel: searches the web (OpenAI web_search) and distils cited findings."
    tools:
      - {name: "OpenAI web_search", does: "Web search with citations (global budget of 15 calls per report)"}
    memory:
      reads: ["One sub-question"]
      writes: ["Cited findings → Synthesizer"]
      persists: "Session file."

  - id: deep_synthesizer
    name: Deep Research · Synthesizer
    group: Deep research
    family: Deep Research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: OPENBB_PAT, required: false, why: "OpenBB data; uses saved OpenBB user settings or degrades gracefully when unset"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
    prompt: "castelino.agents.research.deep.synthesizer:SYNTH_SYSTEM"
    schema: "castelino.agents.research.deep.models:DeepResearchReport"
    tier: reasoning
    summary: "Writes the cited report from all findings, reflects on gaps (up to 2 rounds) and proposes supporting charts."
    tools:
      - {name: "ChartResolver", does: "Deterministic: maps chart specs to OpenBB/FRED data; bad specs are dropped"}
    memory:
      reads: ["All sub-agent findings", "Previous round's gaps"]
      writes: ["DeepResearchReport (answer, citations, charts)"]
      persists: "Report saved to data/research/<id>.json; not fed into the trading pipeline."

  # ── Research metrics ────────────────────────────────────────────────────
  - id: adoption_extractor
    name: AI Adoption · Claim extractor
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.adoption.extract.AdoptionExtractor
    summary: >-
      Reads AI passages from a company's latest 10-K/10-Q and returns verbatim quotes rated
      1 pilot, 2 deployed, 3 revenue-linked. Feeds the Talk pillar of the AI Adoption Index
      (`ckm adoption run`); research metric, not wired into the trading pipeline.
    tools:
      - {name: "ai_passages", does: "Deterministic keyword prefilter: only text windows around AI mentions are sent"}
      - {name: "keep_verified (quote guard)", does: "Drops any claim whose quote is not in the filing text, has a depth outside 1-3, or repeats"}
    memory:
      reads: ["AI passages from one filing"]
      writes: ["Guard-passed claims → Talk score"]
      persists: "Claims and Talk cached per filing in data/adoption/adoption.db; an unchanged filing is never re-sent."

  - id: recipe_writer
    name: AI Adoption · Job-board recipe writer
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "GPT-6 Astra tool loop (OpenAI Responses API)"}
    prompt: "castelino.adoption.recipe_agent:SYSTEM"
    schema: "castelino.adoption.sources.recipes:Recipe"
    summary: >-
      Layer 3 of the Hire pillar. For a company whose careers site has no known data address,
      GPT-6 Astra explores it once in a headless browser and proposes a Recipe saying where the
      job titles live. Our replay code tests and saves it; every refresh replays the recipe with
      no model. Run by hand (scripts/write_recipes.py), capped at 15 steps and $3 per company.
    tools:
      - {name: "open_page", does: "Headless Chromium load: visible text, job links, and the JSON requests the page made"}
      - {name: "sample_selector", does: "Texts matching a CSS selector, to check a page-element recipe"}
      - {name: "test_recipe", does: "Runs the recipe with our replay code; returns count and 10 sample titles"}
      - {name: "submit_recipe (guard)", does: "Accepted only if our replay returns titles from the company's site or a known hiring platform"}
    memory:
      reads: ["Ticker, company name, careers start URL", "Its own tool results within one company"]
      writes: ["Recipe → data/adoption/recipes/<TICKER>.json (saved by the script)"]
      persists: "Only the accepted recipe file; nothing carries over between companies."

  # ── Triggers ────────────────────────────────────────────────────────────
# System architecture diagrams on /agents: one entry per `group` above. The first entry is
# the page's default view. A lane is a list of steps (left → right) and each step is a list
# of boxes drawn stacked (parallel). Box string = "kind:text|caption", where kind is
# agent (text = an agent id; opens it), code (deterministic), gate (waits for a human),
# end (output), system (text = another group; opens its diagram), or no kind = an input.
# loops/regions use 0-based step indexes. Keep lanes ≤ 5 steps (so they fit the card); split long ones into
# numbered stages. tests/test_agent_catalog.py checks every reference.
systems:
  - group: Briefings
    trigger: "Top-bar Refresh button (once a day)"
    output: "The /updates Morning Note and the Fear & Greed · Sector Sentiment card on Radar"
    blurb: >-
      An Orchestrator briefs four research agents and reviews what they find; an Editor writes
      the Morning Note. Code supplies every number, and a guard checks each figure before saving.
    lanes:
      - title: "Daily Update 1 · Research"
        flow: [["Refresh"], ["agent:update_orchestrator|plan briefs"], ["agent:macro_agent|FRED · BLS · Yahoo", "agent:news_agent|web_search", "agent:alt_agent|Polymarket · X", "agent:ai_agent|AI models · chips"], ["agent:update_orchestrator|review"], ["end:↓ to stage 2"]]
        regions: [{from: 1, to: 3, label: "Loop · max 2 follow-up rounds"}]
        loops: [{from: 3, to: 2, label: "follow-ups"}]
      - title: "Daily Update 2 · Write"
        flow: [["code:Background|stock · data · past notes"], ["agent:update_editor|Morning Note"], ["code:Number guard|1 retry"], ["code:Chart agent|8 chart forms", "agent:cover_artist|Substack cover"], ["end:/updates|+ 2-tier memory"]]
        loops: [{from: 2, to: 1, label: "retry with errors"}]
      - title: "Admin · Daily desk"
        flow: [["Your question on /admin"], ["agent:desk_chat|one day · one agent"], ["end:Answer with fact ids"]]
      - title: "Sector Sentiment"
        flow: [["Refresh"], ["code:Divergence scores|top-10 per sector", "code:Fear & Greed|5 market signals"], ["agent:sector_narrative|1 call", "agent:sector_prose|11 calls"], ["end:Card on Radar"]]

  - group: Trade Lab
    trigger: "You, in /admin → Trade Lab"
    output: "A Special Topics draft on Substack (you publish)"
    blurb: >-
      A bull and a bear debate your trade idea with real data, you talk it through, three desks dig into
      what's open, you pick a chart per section, and Claude writes a checked draft. Then you edit it by
      talking to an assistant.
    lanes:
      - title: "Trade Lab 1 · Debate"
        flow: [["Your idea"], ["agent:trade_framer|thesis + tickers"], ["agent:trade_bull|own research", "agent:trade_bear|own research"], ["agent:trade_moderator|settled · open"], ["end:↓ Talk 1"]]
        loops: [{from: 2, to: 2, label: "2 rebuttals"}]
      - title: "Trade Lab 2 · Talk and research"
        flow: [["agent:trade_talk|Talk 1"], ["agent:trade_decide|research? yes/no"], ["agent:trade_orchestrator|3 briefs"], ["agent:trade_news_desk|2 news desks", "agent:trade_technical_desk|technical"], ["end:↓ charts"]]
      - title: "Trade Lab 3 · Charts and draft"
        flow: [["agent:trade_chartist|up to 3 per section"], ["gate:You pick|one per section"], ["agent:trade_editor|Claude"], ["code:Number guard|1 retry"], ["end:Substack draft|↓ Talk 2"]]
      - title: "Trade Lab 4 · Talk 2 assistant"
        flow: [["Your message"], ["agent:trade_decide|research? edit?"], ["agent:trade_news_desk|≤4 searches, if needed"], ["agent:trade_talk|Haiku answers + edits"], ["end:Draft updated|Sonnet if checks fail"]]
      - title: "Charts tab · chat and compare"
        flow: [["Your idea"], ["agent:chart_desk|gpt-6-luna · or 2-8 models"], ["code:Spec check|1 retry"], ["code:Chart forms|FRED · Yahoo"], ["end:Admin Charts|chat · ★ vote"]]

  - group: Theme Charts
    trigger: "Cron on the Fly server at 08:00 ET, weekdays"
    output: "The top macro theme, three signals and 5-6 charts, published on Substack (a card on /themes) and posted to X as a thread"
    blurb: >-
      Code gathers three signals: what news and financial X discuss most, the biggest market moves
      and Polymarket odds swings. One Theme Picker call names the theme and picks the charts; code
      fetches and draws every plotted number, and a guard checks each figure.
    lanes:
      - title: "Theme Charts 1 · Pick"
        flow: [["08:00 ET · Mon-Fri"], ["code:News & X|cited web search", "code:Market moves|1d · 1w · 1m", "code:Polymarket|odds swings"], ["agent:theme_picker|#1 theme + 5-6 charts"], ["code:Number guard|1 retry"], ["end:↓ to stage 2"]]
        loops: [{from: 3, to: 2, label: "retry with errors"}]
      - title: "Theme Charts 2 · Chart & publish"
        flow: [["code:Fetch series|FRED · Yahoo"], ["code:Chart forms|heatmap · together · range"], ["code:Save run|last 6 runs = memory"], ["agent:chart_explainer|X: one line per chart", "agent:chart_commentary|Substack: 2-3 sentences per chart"], ["end:Substack post|08:00 weekdays · /themes card", "end:X thread|08:00 weekdays"]]

  - group: Market alerts
    trigger: "Cron on the Fly server every 30 minutes, 9:35-16:05 ET on weekdays"
    output: "A post on X with one chart for each market move of at least 2.5 sigma (dry run until X_MOVES_LIVE=1)"
    blurb: >-
      Code measures today's move in 10 markets against their past year and decides what to post.
      One Move Explainer search adds a cited reason; code writes every number in the post.
    lanes:
      - title: "Market alerts"
        flow: [["Every 30 min"], ["code:Market check|10 markets · z ≥ 2.5"], ["agent:move_explainer|cited why"], ["agent:x_chart_picker|intraday or context chart"], ["end:Post on X|+ chart · or dry-run log"]]

  - group: X Scout
    trigger: "Cron on the Fly server every 2 hours, 10:15-18:15 ET on weekdays (an hour clear of the Theme Charts thread), and 12:15 on Saturdays"
    output: "At most 2 X posts a day: a cited macro or AI finding with a code-drawn chart, and one reply of analysis (dry run until X_SCOUT_LIVE=1)"
    blurb: >-
      A cited search finds the last 6 hours of macro and AI news; the Scout picks one item worth a
      post (usually none) and the series that chart it. Code draws the chart, and every figure the
      Writer uses must come from the source line or the chart data.
    lanes:
      - title: "X Scout"
        flow: [["Every 2 h"], ["agent:x_scout_search|cited macro + AI"], ["agent:x_scout|1 item or nothing"], ["agent:x_scout_writer|post + reply"], ["end:Post on X|+ chart · or dry-run log"]]

  - group: Deep research
    trigger: "A question asked on /deep-research"
    output: "A cited report with charts in data/research/"
    blurb: >-
      A plain asyncio state machine. Sub-agents search the web in parallel and the Synthesizer
      can send gaps back to the Lead. Capped at 15 web searches per report.
    lanes:
      - title: "1 · Clarify"
        flow: [["Your question"], ["agent:deep_clarifier"], ["gate:You answer|or skip"], ["end:↓ to stage 2"]]
      - title: "2 · Research"
        flow: [["agent:deep_lead"], ["agent:deep_sub_agent|web_search", "agent:deep_sub_agent|web_search", "agent:deep_sub_agent|≤6 in parallel"], ["agent:deep_synthesizer"], ["code:ChartResolver|OpenBB / FRED"], ["end:Cited report"]]
        regions: [{from: 0, to: 2, label: "Loop · max 2 rounds"}]
        loops: [{from: 2, to: 0, label: "gaps → re-plan"}]

  - group: Research metrics
    trigger: "Refresh (AI Adoption Index); recipes are written by hand"
    output: "Talk and Hire scores in the AI Adoption Index"
    blurb: >-
      The LLM is fenced in by code on both sides: a quote is kept only if it is really in the
      filing, and a recipe only if our own replay returns real job titles.
    lanes:
      - title: "Talk pillar"
        flow: [["10-K / 10-Q"], ["code:AI-passage prefilter"], ["agent:adoption_extractor"], ["code:Quote guard|quote must be in filing"], ["end:Talk score|cached per filing"]]
      - title: "Hire pillar · layer 3"
        flow: [["Custom careers site"], ["agent:recipe_writer|≤15 steps, $3"], ["code:Replay test|≥90% coverage"], ["end:Saved recipe|replayed, no model"]]
        loops: [{from: 2, to: 1, label: "rejected → try again"}]

  - group: Weekly deep dive
    trigger: "Sunday 06:00 ET (cron), or Refresh once a report is due"
    output: "The Weekly Deep Dive on /deep-research and a full Substack draft"
    blurb: >-
      A Lead picks the week's 10-12 trends and staffs 5 desks that pull their own data and share a
      board. Claude Opus 5.5 grills every desk, then writes the report; code checks each figure.
    lanes:
      - title: "Weekly Deep Dive 1 · Research"
        flow: [["Week's Morning Notes"], ["agent:weekly_lead|trends + desks"], ["agent:deep_trend_agent|desk 1", "agent:deep_trend_agent|desk 2", "agent:deep_trend_agent|5 desks, shared board"], ["end:↓ to stage 2"]]
      - title: "Weekly Deep Dive 2 · Grill & write"
        flow: [["agent:deep_editor|grill"], ["agent:deep_trend_agent|answers"], ["agent:deep_editor|write"], ["code:Number guard + charts", "agent:cover_artist|Substack cover"], ["end:/deep-research|+ Substack draft"]]
        regions: [{from: 0, to: 1, label: "Loop · max 2 grill rounds"}]
        loops: [{from: 1, to: 0, label: "next round"}]

# Pipelines on the public /agents page: one layered graph per product, with a ▶ Play run walk-through.
# Layers, top to bottom: sources (where facts come from), agents, guardrails (code that checks their
# work), delivery (where you read it). A node sits in its layer at x (px on the canvas, left edge;
# the layer labels take the first 140px), centred vertically and nudged by dy. Default size 150×58;
# a source with no `sub` is a small chip. kind: source | llm | code | guard | trigger | human | out | stop.
# `agent` links an llm node to an agent id above. Groups draw a dashed box round their nodes and can
# be an edge's end. Edges are "from > to", routed from the boxes' positions, or
# "from > to | below|above|right|left | label" for a loop drawn round that side. A step lights its
# nodes (a group lights its members) and edges; its number sits on its first edge.
# tests/test_agent_catalog.py checks every reference and that each agent is drawn (desk_chat is admin-only).
pipelines:
  - id: morning-note
    name: Morning Note
    trigger: "cron · 17:00 ET · every day"
    guardrails: "number check · charts drawn by code"
    delivery: "Morning Note on Substack"
    groups:
      - {id: tools, label: ANALYST TOOLS, nodes: [fred, bls, yahoo, web, polymarket, x]}
      - {id: analysts, label: 4 ANALYSTS, note: RUN IN PARALLEL, nodes: [macro, news, alt, ai]}
    nodes:
      - {id: memory, kind: source, layer: sources, x: 316, w: 140, name: ARC memory, sub: recent notes, does: "The themes and trends from ARC's recent notes, so each run builds on what came before."}
      - {id: fred, kind: source, layer: sources, x: 514, dy: -18, w: 100, name: FRED, does: "Federal Reserve economic data: inflation, rates, jobs and hundreds of other official series."}
      - {id: bls, kind: source, layer: sources, x: 624, dy: -18, w: 100, name: BLS, does: "Bureau of Labor Statistics: the parts of CPI, wages and payroll detail."}
      - {id: yahoo, kind: source, layer: sources, x: 734, dy: -18, w: 100, name: Yahoo Finance, does: "Market prices: stocks, indexes, bonds, currencies and commodities."}
      - {id: web, kind: source, layer: sources, x: 514, dy: 18, w: 100, name: web search, does: "A web search that returns cited sources; only lines with a citation are kept."}
      - {id: polymarket, kind: source, layer: sources, x: 624, dy: 18, w: 100, name: Polymarket, does: "Prediction-market odds and how they moved."}
      - {id: x, kind: source, layer: sources, x: 734, dy: 18, w: 100, name: X, does: "Posts from financial X, found through a cited search."}
      - {id: background, kind: code, layer: sources, x: 872, w: 164, name: Background facts, sub: prices · past notes, does: "Plain code adds context to the findings: a stock's moves this year, a data series' recent history, ARC's earlier notes."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: 17:00 ET, does: "A scheduled job on ARC's server starts the run at 5 pm New York time every day."}
      - {id: orch, kind: llm, agent: update_orchestrator, layer: agents, x: 316, w: 140, name: Orchestrator, sub: plan · review, does: "The lead agent. It writes each analyst a brief, then reviews what they found and can send follow-up questions."}
      - {id: macro, kind: llm, agent: macro_agent, layer: agents, x: 518, dy: -40, w: 145, name: Macro analyst, sub: fred · bls · yahoo, does: "Reads today's official data releases (inflation, jobs, rates) and market moves, and picks the ones that matter."}
      - {id: news, kind: llm, agent: news_agent, layer: agents, x: 675, dy: -40, w: 145, name: News analyst, sub: web search, does: "Searches the day's market-moving news. Every line it keeps has a cited source."}
      - {id: alt, kind: llm, agent: alt_agent, layer: agents, x: 518, dy: 40, w: 145, name: Alt-data analyst, sub: polymarket · x, does: "Checks prediction-market odds and what financial X is saying."}
      - {id: ai, kind: llm, agent: ai_agent, layer: agents, x: 675, dy: 40, w: 145, name: AI analyst, sub: web search, does: "Tracks AI model launches, chips and AI-industry news, with sources."}
      - {id: editor, kind: llm, agent: update_editor, layer: agents, x: 884, w: 140, name: Editor, sub: writes 5 stories, does: "Writes the note's five stories (what happened, why, what to watch) and cites a fact for every claim."}
      - {id: guard, kind: guard, layer: guardrails, x: 884, w: 140, name: Number guard, sub: figures vs facts, does: "Plain code compares every number in the draft with the facts. A number that isn't in the data sends the draft back to the Editor."}
      - {id: charts, kind: code, layer: guardrails, x: 660, w: 160, name: Chart renderer, sub: from source data, does: "Draws each chart straight from the source data. The Editor picks the chart type, never the numbers."}
      - {id: cover, kind: llm, agent: cover_artist, layer: guardrails, x: 440, w: 160, name: Cover Artist, sub: cover image, does: "Turns the note's headline and stories into a short title and a scene, and an image model draws the post's cover."}
      - {id: substack, kind: out, layer: delivery, x: 660, w: 160, name: Substack, sub: Morning Note, does: "The finished Morning Note is published on Substack."}
      - {id: memo, kind: out, layer: delivery, x: 440, w: 160, name: Memo page, sub: lists every note, does: "The Memo page on this site lists every published note and links to it."}
    edges:
      - schedule > orch
      - memory > orch
      - orch > analysts
      - tools > analysts
      - analysts > orch | below | follow-ups · max 2 rounds
      - analysts > editor
      - background > editor
      - editor > guard
      - guard > editor | right | retry
      - guard > charts
      - charts > cover
      - cover > substack
      - substack > memo
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > orch], io: ["in: clock", "out: start run"], text: "A scheduled job starts the run at 5 pm New York time every day. Nobody has to press a button."}
      - {title: Plan, nodes: [orch, memory], edges: [orch > analysts, memory > orch], io: ["in: recent notes", "out: 4 briefs"], text: "The Orchestrator, an LLM agent, reads ARC's memory of recent notes and writes each analyst a brief: what to look into today."}
      - {title: Pull data with tools, nodes: [tools, analysts], edges: [tools > analysts], io: ["in: brief + data", "out: findings + fact ids"], text: "Four analyst agents run at the same time, each limited to its own tools: official data (FRED, BLS, Yahoo Finance), a cited web search, prediction markets and X. Code turns every result into numbered facts that the agents must cite."}
      - {title: Report back, nodes: [analysts, orch], edges: [analysts > orch], io: ["in: findings", "out: follow-ups or done"], text: "The analysts' findings go back to the Orchestrator, which can send any of them a follow-up question, for at most two rounds."}
      - {title: Write, nodes: [background, editor], edges: [analysts > editor, background > editor], io: ["in: findings + background", "out: draft note"], text: "Code adds background (price history, earlier notes). The Editor agent writes five stories (what happened, why, what to watch) and cites a fact for every claim."}
      - {title: Check every number, nodes: [guard, editor], edges: [editor > guard, guard > editor], io: ["in: draft", "out: pass or errors"], text: "Plain code checks every number in the draft against the facts. If a figure isn't in the data, the draft goes back to the Editor with the errors, once."}
      - {title: Chart and publish, nodes: [charts, cover, substack, memo], edges: [guard > charts, charts > cover, cover > substack, substack > memo], io: ["in: checked note", "out: Substack post"], text: "Code draws each chart from the source data, the Cover Artist draws the post's cover image, and the note is published on Substack and listed on the Memo page."}

  - id: weekly-deep-dive
    name: Weekly Deep Dive
    trigger: "first 17:00 ET run from Sunday"
    guardrails: "number check incl. chart values"
    delivery: "Weekly Deep Dive on Substack"
    groups:
      - {id: tools, label: DESK TOOLS, nodes: [fred, bls, yahoo, polymarket, web]}
      - {id: desks, label: 5 DESKS, note: SHARED BOARD, nodes: [desk1, desk2]}
    nodes:
      - {id: notes, kind: source, layer: sources, x: 316, w: 150, name: Morning Notes, sub: Monday to Friday, does: "The week's five Morning Notes: the starting point for picking the week's trends."}
      - {id: fred, kind: source, layer: sources, x: 516, dy: -18, w: 64, name: FRED, does: "Federal Reserve economic data."}
      - {id: bls, kind: source, layer: sources, x: 588, dy: -18, w: 64, name: BLS, does: "Bureau of Labor Statistics data."}
      - {id: yahoo, kind: source, layer: sources, x: 660, dy: -18, w: 64, name: Yahoo, does: "Market prices from Yahoo Finance."}
      - {id: polymarket, kind: source, layer: sources, x: 516, dy: 18, w: 100, name: Polymarket, does: "Prediction-market odds."}
      - {id: web, kind: source, layer: sources, x: 624, dy: 18, w: 100, name: web search, does: "A web search that returns cited sources."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: Sunday, does: "The report is due once the week is over: the first 5 pm New York run from Sunday builds it, and later runs skip it."}
      - {id: lead, kind: llm, agent: weekly_lead, layer: agents, x: 316, w: 150, name: Deep Lead, sub: trends · desks, does: "Reads the week's Morning Notes, picks the 10-12 trends that mattered and splits them across five research desks."}
      - {id: desk1, kind: llm, agent: deep_trend_agent, layer: agents, x: 520, dy: -40, w: 204, name: Desk 1, sub: 2-3 trends · own tools, does: "One of five desk agents: researches its trends with its own tools and shares facts with related desks on a board."}
      - {id: desk2, kind: llm, agent: deep_trend_agent, layer: agents, x: 520, dy: 40, w: 204, name: Desks 2-5, sub: "same, in parallel", does: "The other four desks, running at the same time."}
      - {id: editor, kind: llm, agent: deep_editor, layer: agents, x: 790, w: 160, name: Deep Editor, sub: Claude Opus, does: "Claude Opus questions every desk's research, then writes each trend: what happened, why, what's under the surface, what it means for markets."}
      - {id: guard, kind: guard, layer: guardrails, x: 790, w: 160, name: Number guard, sub: figures + charts, does: "Plain code checks every figure, including chart values, against the facts the desks pulled."}
      - {id: charts, kind: code, layer: guardrails, x: 560, w: 160, name: Chart renderer, sub: from source data, does: "Draws each exhibit from the source data in the form the Editor picked."}
      - {id: cover, kind: llm, agent: cover_artist, layer: guardrails, x: 340, w: 160, name: Cover Artist, sub: cover image, does: "Turns the report's title and trends into a short title and a scene, and an image model draws the post's cover."}
      - {id: substack, kind: out, layer: delivery, x: 560, w: 160, name: Substack, sub: Weekly Deep Dive, does: "The report is drafted on Substack and published there."}
      - {id: page, kind: out, layer: delivery, x: 340, w: 170, name: Deep Research page, sub: lists every week, does: "The Deep Research page on this site lists every weekly report and links to it."}
    edges:
      - schedule > lead
      - notes > lead
      - lead > desks
      - tools > desks
      - desks > editor
      - editor > desks | below | grill · max 2 rounds
      - editor > guard
      - guard > editor | right | retry
      - guard > charts
      - charts > cover
      - cover > substack
      - substack > page
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > lead], io: ["in: a finished week", "out: start run"], text: "Once Monday to Friday's Morning Notes are in, the first scheduled run from Sunday builds the report."}
      - {title: Plan, nodes: [lead, notes], edges: [lead > desks, notes > lead], io: ["in: 5 Morning Notes", "out: 10-12 trends · 5 desks"], text: "The Deep Lead reads the week's Morning Notes, picks the 10-12 trends that mattered and splits them across five research desks."}
      - {title: Research in parallel, nodes: [tools, desks], edges: [tools > desks], io: ["in: trends + tools", "out: findings + facts"], text: "Five desk agents research their trends at the same time, each with its own tools (official data, prices, prediction markets, a cited web search), and share facts on a common board. Code turns every result into a numbered fact."}
      - {title: Grill, nodes: [editor, desks], edges: [desks > editor, editor > desks], io: ["in: desk findings", "out: questions + answers"], text: "Claude, as the Deep Editor, questions every desk's research for up to two rounds, and the desks answer with fresh data."}
      - {title: Write and check, nodes: [editor, guard], edges: [editor > guard, guard > editor], io: ["in: report draft", "out: pass or errors"], text: "The Editor writes the report. Plain code checks every figure, chart values included, against the facts, and sends the draft back once if one doesn't match."}
      - {title: Chart and publish, nodes: [charts, cover, substack, page], edges: [guard > charts, charts > cover, cover > substack, substack > page], io: ["in: checked report", "out: Substack post"], text: "Code draws each exhibit from the source data, the Cover Artist draws the cover image, and the report goes out on Substack and onto the Deep Research page."}

  - id: theme-charts
    name: Theme Charts
    trigger: "cron · 08:00 ET · weekdays"
    guardrails: "number check · charts drawn by code"
    delivery: "Substack post + X thread"
    groups:
      - {id: signals, label: SIGNALS, nodes: [web, x, yahoo, polymarket]}
    nodes:
      - {id: web, kind: source, layer: sources, x: 316, dy: -18, w: 110, name: web search, does: "A cited web search for the macro themes news and financial X discuss most."}
      - {id: x, kind: source, layer: sources, x: 316, dy: 18, w: 110, name: X, does: "Financial X, found through a cited search."}
      - {id: yahoo, kind: source, layer: sources, x: 438, w: 116, name: Yahoo Finance, does: "Market prices: the biggest 1-day, 1-week and 1-month moves."}
      - {id: polymarket, kind: source, layer: sources, x: 566, w: 104, name: Polymarket, does: "The biggest swings in prediction-market odds."}
      - {id: memory, kind: source, layer: sources, x: 720, w: 140, name: ARC memory, sub: last 6 runs, does: "The picker's last six runs, so it doesn't pick the same theme again."}
      - {id: series, kind: source, layer: sources, x: 900, w: 150, name: FRED · Yahoo, sub: series to plot, does: "Every series that ends up on a chart is downloaded straight from FRED or Yahoo Finance."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: 08:00 ET, does: "A scheduled job starts the run at 8 am New York time, Monday to Friday."}
      - {id: gather, kind: code, layer: agents, x: 316, w: 170, name: Signal gatherer, sub: 3 signals → facts, does: "Plain code gathers the three signals and turns them into numbered facts."}
      - {id: picker, kind: llm, agent: theme_picker, layer: agents, x: 560, w: 170, name: Theme picker, sub: theme + 5-6 charts, does: "One LLM call names today's #1 macro theme, the three signals behind it and the 5-6 charts that tell it."}
      - {id: guard, kind: guard, layer: guardrails, x: 560, w: 170, name: Number guard, sub: figures vs facts, does: "Every figure in the write-up must be among the facts' numbers, or the picker tries again once."}
      - {id: charts, kind: code, layer: guardrails, x: 800, w: 160, name: Chart renderer, sub: fetch + draw, does: "Downloads every series and draws the charts (lines, heatmaps, together lines, ranges). The AI never supplies a plotted number."}
      - {id: substack, kind: out, layer: delivery, x: 800, w: 160, name: Substack, sub: post · /themes card, does: "Each run is published on Substack and shown as a card on the Theme Charts page."}
      - {id: xthread, kind: out, layer: delivery, x: 990, w: 140, name: X thread, sub: links the post, does: "Posted to X as a thread that links the Substack post."}
      - {id: explainer, kind: llm, agent: chart_explainer, layer: agents, x: 990, w: 150, name: Chart explainer, sub: one line per chart, does: "A light model writes one plain sentence under each chart in the X thread. It may not use figures, so every number on X stays the code's."}
      - {id: commentary, kind: llm, agent: chart_commentary, layer: delivery, x: 600, w: 160, name: Chart commentary, sub: 2-3 sentences a chart, does: "A light model writes two or three plain sentences under every chart in the Substack post. A paragraph with a figure code can't trace to the run's facts or the chart's own data line is dropped."}
    edges:
      - schedule > gather
      - signals > gather
      - gather > picker
      - memory > picker
      - picker > guard
      - guard > picker | right | retry
      - guard > charts
      - series > charts
      - charts > substack
      - substack > xthread
      - explainer > xthread
      - commentary > substack
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > gather], io: ["in: clock", "out: start run"], text: "A scheduled job starts the run at 8 am New York time, Monday to Friday."}
      - {title: Gather signals, nodes: [signals, gather], edges: [signals > gather], io: ["in: web · prices · odds", "out: facts"], text: "Plain code gathers three signals: what news and financial X discuss most, the biggest market moves, and the biggest swings in prediction-market odds."}
      - {title: Pick the theme, nodes: [picker, memory], edges: [gather > picker, memory > picker], io: ["in: facts + memory", "out: theme + chart plan"], text: "One LLM call names the day's #1 macro theme and the 5-6 charts that tell it. It sees its last six runs so it doesn't repeat itself."}
      - {title: Check every number, nodes: [guard, picker], edges: [picker > guard, guard > picker], io: ["in: write-up", "out: pass or errors"], text: "Code checks every figure in the write-up against the facts; a miss sends it back to the picker once."}
      - {title: Chart, nodes: [charts, series], edges: [guard > charts, series > charts], io: ["in: chart plan", "out: charts"], text: "Code downloads every series from FRED and Yahoo Finance and draws the charts, so every plotted number comes from the source."}
      - {title: Publish, nodes: [substack, xthread, explainer, commentary], edges: [charts > substack, substack > xthread, explainer > xthread, commentary > substack], io: ["in: charts + text", "out: post + thread"], text: "The run is published on Substack with a light model's two or three sentences under each chart, and posted to X as a thread with a one-line read under each chart."}

  - id: market-alerts
    name: Market alerts
    trigger: "cron · every 30 min · market hours"
    guardrails: "unusual-move test · numbers by code"
    delivery: "post on X · max 3 a day"
    nodes:
      - {id: yahoo, kind: source, layer: sources, x: 326, name: Yahoo Finance, sub: 10 markets · 5y bars, does: "Prices for 10 markets: stocks, Treasuries, oil, gold, the dollar and more."}
      - {id: web, kind: source, layer: sources, x: 560, name: web search, sub: cited sources, does: "A web search that returns cited sources."}
      - {id: series, kind: source, layer: sources, x: 794, name: FRED · Yahoo, sub: context series, does: "A longer data series for a context chart, downloaded straight from the source."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: every 30 min, does: "Runs every 30 minutes while US markets are open on weekdays."}
      - {id: explainer, kind: llm, agent: move_explainer, layer: agents, x: 560, name: Move explainer, sub: cited why, does: "Searches for why the market moved and keeps the reason only if it can cite a source."}
      - {id: picker, kind: llm, agent: x_chart_picker, layer: agents, x: 794, name: Chart picker, sub: intraday | context, does: "Chooses the chart: today's intraday moves, or a longer backdrop series."}
      - {id: test, kind: guard, layer: guardrails, x: 326, name: Unusual-move test, sub: z ≥ 2.5 vs 1 year, does: "Plain code compares today's move in each market with the past year of daily moves. Only a move 2.5 standard deviations from normal goes on."}
      - {id: writer, kind: guard, layer: guardrails, x: 794, name: Post writer, sub: numbers by code, does: "Code writes every number in the post and enforces the limits: each market once a day, at most three posts a day."}
      - {id: stop, kind: stop, layer: delivery, x: 326, name: No big move, sub: until next check, does: "Most checks find nothing unusual, and the run simply stops."}
      - {id: post, kind: out, layer: delivery, x: 794, name: X post, sub: + chart, does: "The alert is posted to X with its chart. While the feature is in test mode, posts are only logged."}
    edges:
      - schedule > test
      - yahoo > test
      - test > stop
      - test > explainer
      - web > explainer
      - explainer > picker
      - series > picker
      - picker > writer
      - writer > post
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > test], io: ["in: clock", "out: start check"], text: "Every 30 minutes during US market hours, a scheduled job starts a check."}
      - {title: Unusual-move test, nodes: [test, yahoo, stop], edges: [yahoo > test, test > stop], io: ["in: prices", "out: big moves or stop"], text: "Plain code compares today's move in 10 markets with a normal day over the past year. Only a move 2.5 standard deviations or more goes on; otherwise the run stops here."}
      - {title: Explain, nodes: [explainer, web], edges: [test > explainer, web > explainer], io: ["in: the move", "out: cited reason"], text: "The Move explainer agent searches the web for the reason and keeps it only if it can cite a source."}
      - {title: Pick a chart, nodes: [picker, series], edges: [explainer > picker, series > picker], io: ["in: post text", "out: chart choice"], text: "The Chart picker agent chooses today's intraday moves or a longer backdrop series."}
      - {title: Write and post, nodes: [writer, post], edges: [picker > writer, writer > post], io: ["in: text + chart", "out: X post"], text: "Code writes every number in the post, enforces the daily limits and draws the chart, and the alert goes out on X."}

  - id: x-scout
    name: X Scout
    trigger: "cron · every 2 h · weekdays + Sat noon"
    guardrails: "number check · no repeats · max 2 a day"
    delivery: "post + chart on X, one reply"
    nodes:
      - {id: web, kind: source, layer: sources, x: 326, name: web search, sub: cited sources, does: "A web search that returns cited sources; only lines with a citation are kept."}
      - {id: series, kind: source, layer: sources, x: 794, name: FRED · Yahoo, sub: chart series, does: "The data series behind the chart, downloaded straight from the source."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 120, name: Schedule, sub: every 2 h, does: "Runs every 2 hours from 10:15 to 18:15 New York time on weekdays, and at 12:15 on Saturdays, never within an hour of the morning Theme Charts thread."}
      - {id: search, kind: llm, agent: x_scout_search, layer: agents, x: 326, name: Scout search, sub: macro + AI news, does: "Searches the last 6 hours of macro and AI news and keeps only the lines it can cite."}
      - {id: scout, kind: llm, agent: x_scout, layer: agents, x: 560, name: Scout, sub: 1 item or nothing, does: "Picks the one item worth a post, or nothing, and names the data series that chart it."}
      - {id: writer, kind: llm, agent: x_scout_writer, layer: agents, x: 794, name: Writer, sub: post + reply, does: "Writes the post and one reply of analysis from the cited line and the chart's numbers."}
      - {id: limits, kind: guard, layer: guardrails, x: 560, name: No repeats, sub: 7 days · 2 a day, does: "The Scout sees what this account posted in the last week and today's market alerts; code refuses a story already posted and stops after two posts a day."}
      - {id: check, kind: guard, layer: guardrails, x: 794, name: Number check, sub: source or chart data, does: "Code draws the chart. Every number in the post must come from the cited source or the chart's data, and each post must fit 280 characters, or the post is dropped after one retry."}
      - {id: stop, kind: stop, layer: delivery, x: 560, name: Nothing worth posting, sub: until next run, does: "Most runs find nothing worth a post, and the run simply stops."}
      - {id: post, kind: out, layer: delivery, x: 794, name: X post, sub: + chart · 1 reply, does: "The finding is posted to X with its chart, and the analysis follows as a reply with the source link. While the feature is in test mode, posts are only logged."}
    edges:
      - schedule > search
      - web > search
      - search > scout
      - limits > scout
      - scout > stop
      - scout > writer
      - series > writer
      - writer > check
      - check > post
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > search], io: ["in: clock", "out: start run"], text: "Every 2 hours on weekdays, and once on Saturdays, a scheduled job starts a run."}
      - {title: Scan, nodes: [search, web], edges: [web > search], io: ["in: last 6 hours of news", "out: cited items"], text: "The Scout search agent lists the macro and AI news of the last 6 hours, and only lines with a citation go on."}
      - {title: Pick, nodes: [scout, limits, stop], edges: [search > scout, limits > scout, scout > stop], io: ["in: cited items + past posts", "out: one item or stop"], text: "The Scout agent picks the one item worth a post and the series that chart it. It skips anything already posted, and most runs stop here."}
      - {title: Chart and write, nodes: [writer, series], edges: [scout > writer, series > writer], io: ["in: item + chart data", "out: post + reply"], text: "Code downloads the series and draws the chart; the Writer agent writes the post and one reply of analysis."}
      - {title: Check and post, nodes: [check, post], edges: [writer > check, check > post], io: ["in: post + reply", "out: X post"], text: "Code checks every number against the source and the chart and the 280-character limit, then posts the chart and the reply on X."}

  - id: sector-sentiment
    name: Sector Sentiment
    trigger: "cron · 09:30 + 17:00 ET"
    guardrails: "every sector scored, or keep the last one"
    delivery: "Fear & Greed card on Radar"
    groups:
      - {id: data, label: MARKET DATA, nodes: [yahoo, fred]}
      - {id: calc, label: SCORES, nodes: [scores, feargreed]}
      - {id: writers, label: EXPLAINERS, nodes: [narrative, prose]}
    nodes:
      - {id: yahoo, kind: source, layer: sources, x: 340, w: 112, name: Yahoo Finance, does: "Prices, valuations and analysts' earnings estimates for the 10 biggest companies in each sector, plus the S&P 500, VIX and Treasuries."}
      - {id: fred, kind: source, layer: sources, x: 462, w: 48, name: FRED, does: "The high-yield credit spread, one of the five Fear & Greed signals."}
      - {id: schedule, kind: trigger, layer: agents, x: 150, w: 140, name: Schedule, sub: 09:30 + 17:00 ET, does: "Runs twice a day: after the 8:30 data releases and with the 5 pm run."}
      - {id: scores, kind: code, layer: agents, x: 340, dy: -40, w: 170, name: Divergence scores, sub: top 10 per sector, does: "Plain code scores each sector's mood: how far price momentum has run ahead of (or behind) the fundamentals."}
      - {id: feargreed, kind: code, layer: agents, x: 340, dy: 40, w: 170, name: Fear & Greed, sub: 5 market signals, does: "Plain code ranks five market signals against the past two years and averages them into one 0-100 reading."}
      - {id: narrative, kind: llm, agent: sector_narrative, layer: agents, x: 600, dy: -40, w: 180, name: Narrative, sub: 1 call · the summary, does: "Writes the card's short summary of what the numbers say."}
      - {id: prose, kind: llm, agent: sector_prose, layer: agents, x: 600, dy: 40, w: 180, name: Sector explainer, sub: one call per sector, does: "Writes a short explanation for each sector from its scores and its 10 companies."}
      - {id: check, kind: guard, layer: guardrails, x: 600, w: 180, name: Snapshot check, sub: all sectors or keep last, does: "If any sector can't be scored, code keeps the previous snapshot instead of publishing a partial one. If the writing fails, the card ships with numbers only."}
      - {id: card, kind: out, layer: delivery, x: 600, w: 180, name: Radar card, sub: Fear & Greed · sectors, does: "The Fear & Greed · Sector Sentiment card on the Radar page."}
    edges:
      - schedule > calc
      - data > calc
      - calc > writers
      - writers > check
      - check > card
    steps:
      - {title: Trigger, nodes: [schedule], edges: [schedule > calc], io: ["in: clock", "out: start run"], text: "A scheduled job runs at 9:30 am, after the morning data releases, and again at 5 pm New York time."}
      - {title: Score, nodes: [data, calc], edges: [data > calc], io: ["in: prices · estimates · spreads", "out: scores"], text: "Plain code scores each sector's mood (price momentum against fundamentals) from its 10 biggest companies, and the market's Fear & Greed reading from five signals."}
      - {title: Explain, nodes: [writers], edges: [calc > writers], io: ["in: scores", "out: summary + sector notes"], text: "Two LLM agents turn the numbers into words: one writes the summary, the other a short note for each sector. They never change a number."}
      - {title: Check, nodes: [check], edges: [writers > check], io: ["in: snapshot", "out: publish or keep last"], text: "If any sector couldn't be scored, code keeps the previous snapshot rather than publish a partial one."}
      - {title: Publish, nodes: [card], edges: [check > card], io: ["in: checked snapshot", "out: Radar card"], text: "The scores and notes appear on the Fear & Greed · Sector Sentiment card on Radar."}

  - id: deep-research
    name: Deep Research
    trigger: "on request · a research question"
    guardrails: "15-search cap · charts from real data"
    delivery: "a cited report"
    groups:
      - {id: subs, label: SUB-AGENTS, note: UP TO 6 IN PARALLEL, nodes: [sub1, subs2]}
    nodes:
      - {id: web, kind: source, layer: sources, x: 680, w: 120, name: web search, does: "A web search that returns cited sources."}
      - {id: openbb, kind: source, layer: sources, x: 1046, w: 110, name: OpenBB · FRED, does: "Market and economic data for the report's charts."}
      - {id: question, kind: trigger, layer: agents, x: 150, w: 120, name: Question, sub: on request, does: "Someone asks a research question."}
      - {id: clarifier, kind: llm, agent: deep_clarifier, layer: agents, x: 316, w: 130, name: Clarifier, sub: rewords · asks, does: "Rewords the question and asks up to three clarifying questions."}
      - {id: lead, kind: llm, agent: deep_lead, layer: agents, x: 490, w: 130, name: Lead, sub: ≤ 6 questions, does: "Splits the question into at most six sub-questions, and re-plans if the Synthesizer finds gaps."}
      - {id: sub1, kind: llm, agent: deep_sub_agent, layer: agents, x: 666, dy: -40, w: 150, name: Sub-agent 1, sub: web search, does: "One sub-agent per sub-question: searches the web and keeps cited findings."}
      - {id: subs2, kind: llm, agent: deep_sub_agent, layer: agents, x: 666, dy: 40, w: 150, name: Sub-agents 2-6, sub: "same, in parallel", does: "The other sub-agents, running at the same time."}
      - {id: synth, kind: llm, agent: deep_synthesizer, layer: agents, x: 870, w: 140, name: Synthesizer, sub: cited report, does: "Writes the cited report from every finding, looks for gaps, and proposes supporting charts."}
      - {id: you, kind: human, layer: guardrails, x: 316, w: 130, name: You answer, sub: or skip, does: "The person who asked answers the clarifying questions, or skips them."}
      - {id: charts, kind: code, layer: guardrails, x: 870, w: 140, name: Chart resolver, sub: real data only, does: "Plain code fetches the data for each proposed chart and drops any chart it can't draw."}
      - {id: report, kind: out, layer: delivery, x: 870, w: 140, name: Cited report, sub: with charts, does: "The finished report, with a citation for every claim."}
    edges:
      - question > clarifier
      - clarifier > you
      - you > lead
      - lead > subs
      - web > subs
      - subs > synth
      - synth > lead | below | gaps → re-plan · max 2 rounds
      - synth > charts
      - openbb > charts
      - charts > report
    steps:
      - {title: Ask, nodes: [question], edges: [question > clarifier], io: ["in: a question", "out: start"], text: "Someone asks a research question."}
      - {title: Clarify, nodes: [clarifier, you], edges: [clarifier > you, you > lead], io: ["in: raw question", "out: clarified question"], text: "The Clarifier rewords the question and asks up to three clarifying questions; the person answers them or skips."}
      - {title: Plan, nodes: [lead], edges: [lead > subs], io: ["in: clarified question", "out: ≤ 6 sub-questions"], text: "The Lead splits the question into at most six sub-questions."}
      - {title: Research in parallel, nodes: [subs, web], edges: [web > subs], io: ["in: sub-question", "out: cited findings"], text: "One sub-agent per sub-question searches the web at the same time and keeps cited findings, with at most 15 searches per report."}
      - {title: Synthesize, nodes: [synth, lead], edges: [subs > synth, synth > lead], io: ["in: all findings", "out: report or gaps"], text: "The Synthesizer writes the cited report and can send gaps back to the Lead for up to two more rounds."}
      - {title: Chart and save, nodes: [charts, openbb, report], edges: [synth > charts, openbb > charts, charts > report], io: ["in: report + chart ideas", "out: cited report"], text: "Code fetches the data for each proposed chart, drops any it can't draw, and saves the cited report."}

  - id: ai-adoption
    name: AI Adoption
    trigger: "cron · 17:00 ET · recipes by hand"
    guardrails: "quote check · recipe replay test"
    delivery: "Talk and Hire scores"
    nodes:
      - {id: filings, kind: source, layer: sources, x: 316, w: 160, name: SEC filings, sub: latest 10-K / 10-Q, does: "Each company's latest annual or quarterly report from the SEC."}
      - {id: careers, kind: source, layer: sources, x: 880, w: 160, name: Careers sites, sub: custom job boards, does: "Company careers sites that no standard job-board reader covers."}
      - {id: run, kind: trigger, layer: agents, x: 150, w: 120, name: Index run, sub: 17:00 ET, does: "The AI Adoption Index runs with the 5 pm New York job."}
      - {id: filter, kind: code, layer: agents, x: 316, w: 160, name: AI-passage filter, sub: keyword prefilter, does: "Plain code keeps only the passages of a filing that mention AI, so the model reads less."}
      - {id: extractor, kind: llm, agent: adoption_extractor, layer: agents, x: 530, w: 160, name: Claim extractor, sub: verbatim quotes, does: "Returns word-for-word quotes about AI, each rated pilot, deployed or revenue-linked."}
      - {id: hand, kind: human, layer: agents, x: 720, w: 120, name: By hand, sub: one company, does: "Someone runs the Recipe writer by hand for a company whose careers site has no known data address."}
      - {id: recipe, kind: llm, agent: recipe_writer, layer: agents, x: 880, w: 160, name: Recipe writer, sub: ≤ 15 steps · $3, does: "Explores the careers site once in a headless browser and proposes a recipe saying where the job titles live."}
      - {id: quote, kind: guard, layer: guardrails, x: 530, w: 160, name: Quote check, sub: found in the filing, does: "Code keeps a quote only if it really appears in the filing."}
      - {id: replay, kind: guard, layer: guardrails, x: 880, w: 160, name: Replay test, sub: ≥ 90% coverage, does: "Our own code replays the recipe; it's saved only if it returns real job titles covering at least 90% of what the site shows."}
      - {id: talk, kind: out, layer: delivery, x: 530, w: 160, name: Talk score, sub: cached per filing, does: "How deeply each company talks about AI in its filings, scored from the kept quotes."}
      - {id: hire, kind: out, layer: delivery, x: 880, w: 160, name: Hire score, sub: "replayed, no model", does: "The share of each company's open jobs that are AI or ML roles, counted in code from the replayed recipe."}
    edges:
      - run > filter
      - filings > filter
      - filter > extractor
      - extractor > quote
      - quote > talk
      - hand > recipe
      - careers > recipe
      - recipe > replay
      - replay > recipe | right | rejected → try again
      - replay > hire
    steps:
      - {title: Read the filings, nodes: [run, filings, filter], edges: [filings > filter, run > filter], io: ["in: SEC filing", "out: AI passages"], text: "On each index run, code downloads each company's latest 10-K or 10-Q from the SEC and keeps only the passages that mention AI."}
      - {title: Extract claims, nodes: [extractor], edges: [filter > extractor], io: ["in: AI passages", "out: rated quotes"], text: "The Claim extractor returns word-for-word quotes, each rated pilot, deployed or revenue-linked."}
      - {title: Check the quotes, nodes: [quote, talk], edges: [extractor > quote, quote > talk], io: ["in: quotes", "out: Talk score"], text: "Code keeps a quote only if it really appears in the filing, and the kept quotes become the Talk score."}
      - {title: Write a recipe, nodes: [hand, careers, recipe], edges: [careers > recipe, hand > recipe], io: ["in: careers site", "out: proposed recipe"], text: "For a careers site no standard reader covers, someone runs the Recipe writer by hand: it explores the site once and proposes where the job titles live."}
      - {title: Replay test, nodes: [replay, recipe], edges: [recipe > replay, replay > recipe], io: ["in: recipe", "out: saved or rejected"], text: "Our own code replays the recipe and saves it only if it returns real job titles covering at least 90% of what the site shows."}
      - {title: Hire score, nodes: [hire], edges: [replay > hire], io: ["in: saved recipe", "out: Hire score"], text: "Every index run replays the saved recipes with no model and counts AI and ML job titles in code."}
