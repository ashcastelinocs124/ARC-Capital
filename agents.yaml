# Agent registry — one entry per LLM agent, shown on the dashboard's /agents page.
#
# Adding an agent: add an entry here. `class` (a StructuredAgent) makes the page read the
# live system prompt, model tier and output schema from code. For agents that aren't
# StructuredAgents, point `prompt` at a module-level prompt constant and `schema` at the
# output model ("module.path:NAME"). tools/memory/dependencies are descriptions you maintain
# here; `dependencies` lists the env keys the agent needs (required or optional).
# tests/test_agent_catalog.py fails if a StructuredAgent class is missing from this file.

agents:
  # ── Briefings ───────────────────────────────────────────────────────────
  - id: update_orchestrator
    name: Update Orchestrator
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM calls (gpt-6-sol)"}
    class: castelino.agents.update.orchestrator.UpdateOrchestrator
    summary: >-
      Runs the morning research desk: briefs the Macro, News and Alt agents from memory, then
      reviews what they found and sends up to one follow-up ask per agent (max 2 rounds).
    tools:
      - {name: "plan()", does: "One brief per agent, no numbers"}
      - {name: "review()", does: "done, or follow-up asks for gaps or conflicts between agents"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: []
      persists: "Nothing of its own; the Editor's themes update the shared two-tier memory."

  - id: macro_agent
    name: Macro Agent
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
      - {key: BLS_API_KEY, required: false, why: "BLS data; keyless allows 25 requests a day"}
    class: castelino.agents.update.macro.MacroAgent
    summary: >-
      Code pulls FRED releases, BLS CPI components and wages, jobless claims and market moves into
      numbered facts; the agent picks the findings that matter and cites the facts they rest on.
    tools:
      - {name: "collect()", does: "FRED releases + 1d/1w/1m returns for the instrument universe"}
      - {name: "bls_facts()", does: "CPI shelter, energy, food and average hourly earnings m/m"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: news_agent
    name: News Agent
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.news.NewsAgent
    summary: >-
      One cited web search for the day's market-moving stories; every cited line becomes a fact,
      and the agent picks findings from those facts only.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: alt_agent
    name: Alt Agent
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search for X (gpt-6-luna)"}
    class: castelino.agents.update.alt.AltAgent
    summary: >-
      Polymarket odds and their 1-day / 1-week moves on economy markets (code, no key) plus what
      financial X is saying (cited web search); picks the findings where the crowd moved.
    tools:
      - {name: "polymarket.facts()", does: "Gamma API economy events ranked by odds move"}
      - {name: "X via web_search", does: "Cited lines of what macro accounts are posting"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: update_editor
    name: Update Editor
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol)"}
    class: castelino.agents.update.editor.UpdateEditor
    summary: >-
      Writes the Morning Note (headline, 3 key takeaways, 3-5 ranked items) and picks which
      findings get an exhibit from the Chart agent. A number guard checks every figure.
    tools:
      - {name: "Chart agent (code)", does: "Institutional exhibits: last 7 observations, or previous vs latest release"}
      - {name: "check_note (guard)", does: "Every %, bp or pp must be in the facts behind the cited findings; one retry"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: ["Theme notes (touched and new)", "data/updates/<date>.json — written last, marks the day done"]
      persists: >-
        Two-tier markdown in data/update_agent/memory/. Caps (5 short / 20 long) and eviction by
        importance minus whole months unused are enforced in code, not the prompt.

  - id: sector_narrative
    name: Sector Sentiment Narrative
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: false, why: "LLM call (OpenAI); without it the Sector Sentiment numbers still ship, just without the narrative"}
    class: castelino.agents.sector_explainer.SectorNarrativeAgent
    summary: >-
      Once a day after the Sector Sentiment refresh on dashboard start: a 3-5 sentence read
      of the sector divergence table, shown on /models. Describes only; never recommends.
    tools: []
    memory:
      reads: ["Today's SectorSentimentSnapshot (sectors, verdicts, notable stocks)", "The previous snapshot's narrative"]
      writes: ["snapshot.narrative in data/sector_sentiment.json"]
      persists: "The narrative is stored on the snapshot; the next day's run reads it for continuity."

  - id: sector_prose
    name: Sector Explainer
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: false, why: "LLM call (OpenAI); without it each sector drawer shows only the computed stats"}
    class: castelino.agents.sector_explainer.SectorProseAgent
    summary: >-
      One call per sector (11/day): 2-3 sentences explaining whether a sector's divergence is
      one stock's story or the whole sector's. The verdict is computed in code; the agent only
      explains it.
    tools: []
    memory:
      reads: ["One SectorScore + its 10 constituents' metrics and contributions"]
      writes: ["sector.explanation.prose in data/sector_sentiment.json"]
      persists: "None of its own."

  # ── Trading pipeline ────────────────────────────────────────────────────
  - id: current_event
    name: Current Event
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.current_event.CurrentEventAgent
    summary: "First node after a trigger fires: a broad scan of what just changed in the world, as a world-state brief."
    tools: []
    memory:
      reads: ["The trigger record", "Recent headlines", "Source summaries (calendar, news, speech)"]
      writes: ["WorldStateBrief → short-term journal"]
      persists: "Journal entry in the fund's short-term memory."

  - id: hypothesis
    name: Macro Hypothesis
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.hypothesis.HypothesisAgent
    summary: "Turns the world-state brief into ONE falsifiable macro thesis with kill criteria, horizon and conviction. Stops at the post-hypothesis human gate."
    tools: []
    memory:
      reads: ["WorldStateBrief", "Regime nowcast context", "Figure-deviation context (Fed speakers)", "Long-term journal lessons"]
      writes: ["Hypothesis → short-term journal", "Approval queue item (human gate)"]
      persists: "Journal entry; the Curator later distils lessons into long-term memory."

  - id: asset_selection
    name: Asset Selection
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.asset_selection.AssetSelectionAgent
    summary: "Picks the 1–3 best instruments to express the approved thesis, given the current portfolio."
    tools: []
    memory:
      reads: ["Hypothesis", "Portfolio state", "Regime sector playbook"]
      writes: ["Trade expressions → Research Desk"]
      persists: "Journal entry."

  - id: bull
    name: Bull
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.bull.BullAgent
    summary: "Argues FOR the proposed trade using only the shared research bundle."
    tools: []
    memory:
      reads: ["Expression + hypothesis", "Research bundle (TA, web, backtest, risk)", "Regime context", "Past similar setups in short-term memory"]
      writes: ["BullCase → Debate"]
      persists: "Journal entry."

  - id: bear
    name: Bear
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.bear.BearAgent
    summary: "Argues AGAINST the proposed trade from the same research bundle."
    tools: []
    memory:
      reads: ["Expression + hypothesis", "Research bundle", "Regime context"]
      writes: ["BearCase → Debate"]
      persists: "Journal entry."

  - id: debate
    name: Debate
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.debate.DebateAgent
    summary: "Adjudicates Bull vs Bear into a verdict. Stops at the post-debate human gate."
    tools: []
    memory:
      reads: ["BullCase", "BearCase", "Hypothesis", "Regime context"]
      writes: ["Verdict → Principles Guard", "Approval queue item (human gate)"]
      persists: "Journal entry."

  - id: guard_soft
    name: Principles Guard
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.guard.GuardSoftAgent
    summary: "Hybrid guard: deterministic hard vetoes run first, then the LLM judges soft principles from the fund constitution."
    tools:
      - {name: "Deterministic hard rules", does: "Veto checks computed in code before the LLM is called; passed in as hard_warnings"}
    memory:
      reads: ["Verdict, expression, hypothesis", "Portfolio", "Core principles (data/core_principles.md)", "Recent journal entries"]
      writes: ["GuardDecision → Portfolio"]
      persists: "Journal entry."

  - id: portfolio
    name: Portfolio
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.portfolio.PortfolioAgent
    summary: "Translates an approved verdict plus guard decision into a sized trade order (simulation only)."
    tools: []
    memory:
      reads: ["Verdict", "GuardDecision", "Expression + hypothesis", "Portfolio state"]
      writes: ["TradeOrder → accounting layer"]
      persists: "Order and fills in the portfolio ledger."

  - id: curator
    name: Memory Curator
    group: Trading pipeline
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.curator.CuratorAgent
    summary: "Weekly job: distils recent journal entries into durable long-term lessons and trims short-term memory."
    tools: []
    memory:
      reads: ["Recent short-term journal entries", "Existing long-term lessons"]
      writes: ["New long-term lessons", "Trimmed short-term journal"]
      persists: "The fund's long-term memory — read back by the Hypothesis agent."

  # ── Research desk ───────────────────────────────────────────────────────
  - id: web_research
    name: Web Research
    group: Research desk
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: OPENBB_PAT, required: false, why: "OpenBB data; uses saved OpenBB user settings or degrades gracefully when unset"}
    class: castelino.agents.research.web.WebResearchAgent
    summary: "Instrument-specific news and sentiment for each trade expression."
    tools:
      - {name: "OpenBB news", does: "Recent articles for the instrument"}
    memory:
      reads: ["Expression", "WorldStateBrief"]
      writes: ["WebResearch → research bundle"]
      persists: "None of its own."

  - id: technical_analysis
    name: Technical Analysis
    group: Research desk
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: OPENBB_PAT, required: false, why: "OpenBB data; uses saved OpenBB user settings or degrades gracefully when unset"}
    class: castelino.agents.research.technical.TechnicalAnalysisAgent
    summary: "Deterministic indicators computed in code, then an LLM interpretation of the setup."
    tools:
      - {name: "OpenBB price history + indicators", does: "Moving averages, momentum and trend features computed before the call"}
    memory:
      reads: ["Expression", "Computed TA features"]
      writes: ["TAReport → research bundle"]
      persists: "None of its own."

  - id: backtesting
    name: Backtesting
    group: Research desk
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.backtest.BacktestingAgent
    summary: "Finds similar historical setups for the instrument and summarises how they played out."
    tools:
      - {name: "Historical setup stats", does: "Analog statistics computed in code and passed in"}
    memory:
      reads: ["Expression + hypothesis", "Backtest stats"]
      writes: ["BacktestReport → research bundle"]
      persists: "None of its own."

  - id: risk
    name: Risk
    group: Research desk
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: OPENBB_PAT, required: false, why: "OpenBB data; uses saved OpenBB user settings or degrades gracefully when unset"}
    class: castelino.agents.research.risk.RiskAgent
    summary: "Volatility, correlation, marginal VaR and a maximum suggested size for the expression."
    tools:
      - {name: "OpenBB risk features", does: "Vol, correlation and VaR computed in code before the call"}
    memory:
      reads: ["Expression", "Computed risk features"]
      writes: ["RiskReport → research bundle"]
      persists: "None of its own."

  # ── Deep research ───────────────────────────────────────────────────────
  - id: deep_clarifier
    name: Deep Research · Clarifier
    group: Deep research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.deep.clarifier.ClarifierAgent
    summary: "Rewords the raw question and asks up to 3 clarifying questions before research starts."
    tools: []
    memory:
      reads: ["The raw query"]
      writes: ["Reworded query + clarifying questions"]
      persists: "Session saved to data/research/<id>.json."

  - id: deep_lead
    name: Deep Research · Lead
    group: Deep research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.agents.research.deep.lead.LeadAgent
    summary: "Decomposes the clarified question into at most 6 sub-questions; re-plans on gaps in later rounds."
    tools: []
    memory:
      reads: ["Reworded query + answers", "Round number", "Gaps from the previous synthesis"]
      writes: ["Sub-questions → parallel sub-agents"]
      persists: "Session file."

  - id: deep_sub_agent
    name: Deep Research · Sub-agent
    group: Deep research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (OpenAI web_search tool)"}
    prompt: "castelino.agents.research.deep.sub_agent:SYSTEM"
    schema: "castelino.agents.research.deep.models:SubFinding"
    tier: fast
    summary: "One per sub-question, run in parallel: searches the web (OpenAI web_search) and distils cited findings."
    tools:
      - {name: "OpenAI web_search", does: "Web search with citations (global budget of 15 calls per report)"}
    memory:
      reads: ["One sub-question"]
      writes: ["Cited findings → Synthesizer"]
      persists: "Session file."

  - id: deep_synthesizer
    name: Deep Research · Synthesizer
    group: Deep research
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: OPENBB_PAT, required: false, why: "OpenBB data; uses saved OpenBB user settings or degrades gracefully when unset"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
    prompt: "castelino.agents.research.deep.synthesizer:SYNTH_SYSTEM"
    schema: "castelino.agents.research.deep.models:DeepResearchReport"
    tier: reasoning
    summary: "Writes the cited report from all findings, reflects on gaps (up to 2 rounds) and proposes supporting charts."
    tools:
      - {name: "ChartResolver", does: "Deterministic: maps chart specs to OpenBB/FRED data; bad specs are dropped"}
    memory:
      reads: ["All sub-agent findings", "Previous round's gaps"]
      writes: ["DeepResearchReport (answer, citations, charts)"]
      persists: "Report saved to data/research/<id>.json; not fed into the trading pipeline."

  # ── Research metrics ────────────────────────────────────────────────────
  - id: adoption_extractor
    name: AI Adoption · Claim extractor
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.adoption.extract.AdoptionExtractor
    summary: >-
      Reads AI passages from a company's latest 10-K/10-Q and returns verbatim quotes rated
      1 pilot, 2 deployed, 3 revenue-linked. Feeds the Talk pillar of the AI Adoption Index
      (`ckm adoption run`); research metric, not wired into the trading pipeline.
    tools:
      - {name: "ai_passages", does: "Deterministic keyword prefilter: only text windows around AI mentions are sent"}
      - {name: "keep_verified (quote guard)", does: "Drops any claim whose quote is not in the filing text, has a depth outside 1-3, or repeats"}
    memory:
      reads: ["AI passages from one filing"]
      writes: ["Guard-passed claims → Talk score"]
      persists: "Claims and Talk cached per filing in data/adoption/adoption.db; an unchanged filing is never re-sent."

  - id: recipe_writer
    name: AI Adoption · Job-board recipe writer
    group: Research metrics
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "GPT-6 Astra tool loop (OpenAI Responses API)"}
    prompt: "castelino.adoption.recipe_agent:SYSTEM"
    schema: "castelino.adoption.sources.recipes:Recipe"
    summary: >-
      Layer 3 of the Hire pillar. For a company whose careers site has no known data address,
      GPT-6 Astra explores it once in a headless browser and proposes a Recipe saying where the
      job titles live. Our replay code tests and saves it; every refresh replays the recipe with
      no model. Run by hand (scripts/write_recipes.py), capped at 15 steps and $3 per company.
    tools:
      - {name: "open_page", does: "Headless Chromium load: visible text, job links, and the JSON requests the page made"}
      - {name: "sample_selector", does: "Texts matching a CSS selector, to check a page-element recipe"}
      - {name: "test_recipe", does: "Runs the recipe with our replay code; returns count and 10 sample titles"}
      - {name: "submit_recipe (guard)", does: "Accepted only if our replay returns titles from the company's site or a known hiring platform"}
    memory:
      reads: ["Ticker, company name, careers start URL", "Its own tool results within one company"]
      writes: ["Recipe → data/adoption/recipes/<TICKER>.json (saved by the script)"]
      persists: "Only the accepted recipe file; nothing carries over between companies."

  # ── Triggers ────────────────────────────────────────────────────────────
  - id: significance
    name: Significance Classifier
    group: Triggers
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    class: castelino.triggers.significance.SignificanceClassifier
    summary: "Scores each batch of RSS headlines for market significance; high scores feed the conviction ledger or fire the pipeline."
    tools: []
    memory:
      reads: ["Headline batch"]
      writes: ["Scores → conviction ledger"]
      persists: "Conviction ledger with a 12-hour half-life."

  - id: significance_rescore
    name: Significance Re-scorer
    group: Triggers
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: X_API_BEARER_TOKEN, required: false, why: "X (Twitter) data; the step is skipped when unset"}
    class: castelino.triggers.significance.RescoreClassifier
    summary: "Second pass for borderline headlines (0.4–0.8), re-scored with enrichment (Polymarket, X sentiment)."
    tools:
      - {name: "Input enrichment", does: "Polymarket odds and X sentiment attached before the call"}
    memory:
      reads: ["Borderline items + enrichment"]
      writes: ["Updated scores → conviction ledger"]
      persists: "Conviction ledger."

  - id: figure_deviation_stage_b
    name: Fed Speaker Deviation · Stage B
    group: Triggers
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
      - {key: X_API_BEARER_TOKEN, required: false, why: "X (Twitter) data; the step is skipped when unset"}
    prompt: "castelino.triggers.figure_deviation.stage_b:_STAGE_B_SYSTEM_PROMPT"
    schema: "castelino.triggers.figure_deviation.stage_b:DeviationConfirmation"
    tier: fast
    summary: "Confirms a statistical tone deviation from a speaker's 12-month baseline before it can fire the pipeline."
    tools:
      - {name: "Stage A z-score", does: "Deterministic lexicon score vs the speaker's baseline; the LLM is only called above 1.5σ"}
    memory:
      reads: ["Recent sentences", "Speaker profile card + baseline"]
      writes: ["Confirmed SPEECH_DEVIATION trigger (once per event)"]
      persists: "Speaker baselines rebuilt from the scored corpus."

  # ── Advisors ────────────────────────────────────────────────────────────
  - id: persona
    name: Persona Advisor
    group: Advisors
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Chat replies, corpus embeddings, and the web-search fallback when the scraped corpus is thin (OpenAI)"}
    schema: "castelino.agents.personas.agent:PersonaResponse"
    tier: fast
    summary: "RAG-backed simulated economists and investors (Krugman, El-Erian, Summers, Druckenmiller, Dalio, Tudor Jones) for consultation; never part of the trading pipeline."
    tools:
      - {name: "Chroma retrieval", does: "Top-k chunks from the persona's scraped corpus (data/personas/chroma)"}
      - {name: "OpenAI web_search fallback", does: "Fills thin corpora with recent commentary (cached 24h)"}
    memory:
      reads: ["Persona profile card", "Retrieved corpus chunks", "Rolling 30-day conversation window"]
      writes: ["Reply with cited sources"]
      persists: "One thread per persona in data/personas/conversations/<id>.json."

  - id: persona_panel
    name: Persona Panel Synthesis
    group: Advisors
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (OpenAI)"}
    prompt: "castelino.agents.personas.panel:SYNTHESIS_SYSTEM"
    schema: "castelino.agents.personas.models:PanelSynthesis"
    tier: reasoning
    summary: "Runs several personas in parallel (no peer visibility) and synthesises consensus, disagreements and the strongest objection."
    tools: []
    memory:
      reads: ["Each persona's independent answer"]
      writes: ["PanelSynthesis"]
      persists: "Attached to the approval item it was run for."

# System architecture diagrams on /agents: one entry per `group` above. The first entry is
# the page's default view. A lane is a list of steps (left → right) and each step is a list
# of boxes drawn stacked (parallel). Box string = "kind:text|caption", where kind is
# agent (text = an agent id; opens it), code (deterministic), gate (waits for a human),
# end (output), system (text = another group; opens its diagram), or no kind = an input.
# loops/regions use 0-based step indexes. Keep lanes ≤ 5 steps (so they fit the card); split long ones into
# numbered stages. tests/test_agent_catalog.py checks every reference.
systems:
  - group: Trading pipeline
    trigger: "A trigger fires (headlines, Fed speech, calendar)"
    output: "A sized trade order in the simulated portfolio"
    blurb: >-
      A LangGraph DAG of LLM agents with two human approval gates. Hard risk rules run in code
      before the Principles Guard's LLM is asked.
    lanes:
      - title: "1 · Idea"
        flow: [["Trigger"], ["agent:current_event"], ["agent:hypothesis"], ["gate:Human gate|approve thesis"], ["end:↓ to stage 2"]]
      - title: "2 · Research & debate"
        flow: [["Approved thesis"], ["agent:asset_selection"], ["system:Research desk|4 in parallel"], ["agent:bull", "agent:bear"], ["agent:debate"]]
        regions: [{from: 3, to: 4, label: "Adversarial debate"}]
      - title: "3 · Execution"
        flow: [["gate:Human gate|approve verdict"], ["code:Hard rules|veto in code"], ["agent:guard_soft"], ["agent:portfolio"], ["end:Trade order|→ ledger"]]
      - title: "Weekly"
        flow: [["Short-term journal"], ["agent:curator"], ["end:Long-term lessons|read by Hypothesis"]]

  - group: Research desk
    trigger: "Asset Selection proposes a trade expression"
    output: "One research bundle shared by Bull and Bear"
    blurb: >-
      Four specialists run in parallel. Each one's numbers are computed in code first; the LLM
      only interprets them.
    lanes:
      - title: "Per expression"
        flow: [["Trade expression"], ["code:OpenBB data|prices, news, analogs, VaR"], ["agent:web_research", "agent:technical_analysis", "agent:backtesting", "agent:risk"], ["end:Research bundle|→ Bull / Bear"]]

  - group: Deep research
    trigger: "A question asked on /deep-research"
    output: "A cited report with charts in data/research/"
    blurb: >-
      A plain asyncio state machine. Sub-agents search the web in parallel and the Synthesizer
      can send gaps back to the Lead. Capped at 15 web searches per report.
    lanes:
      - title: "1 · Clarify"
        flow: [["Your question"], ["agent:deep_clarifier"], ["gate:You answer|or skip"], ["end:↓ to stage 2"]]
      - title: "2 · Research"
        flow: [["agent:deep_lead"], ["agent:deep_sub_agent|web_search", "agent:deep_sub_agent|web_search", "agent:deep_sub_agent|≤6 in parallel"], ["agent:deep_synthesizer"], ["code:ChartResolver|OpenBB / FRED"], ["end:Cited report"]]
        regions: [{from: 0, to: 2, label: "Loop · max 2 rounds"}]
        loops: [{from: 2, to: 0, label: "gaps → re-plan"}]

  - group: Briefings
    trigger: "Top-bar Refresh button (once a day)"
    output: "The /updates Morning Note, the refitted Pulse/Pressure models and the Sector Sentiment card on /models"
    blurb: >-
      An Orchestrator briefs three research agents and reviews what they find; an Editor writes
      the Morning Note. Code supplies every number, and a guard checks each figure before saving.
    lanes:
      - title: "Daily Update 1 · Research"
        flow: [["Refresh"], ["agent:update_orchestrator|plan briefs"], ["agent:macro_agent|FRED · BLS · Yahoo", "agent:news_agent|web_search", "agent:alt_agent|Polymarket · X"], ["agent:update_orchestrator|review"], ["end:↓ to stage 2"]]
        regions: [{from: 1, to: 3, label: "Loop · max 2 follow-up rounds"}]
        loops: [{from: 3, to: 2, label: "follow-ups"}]
      - title: "Daily Update 2 · Write"
        flow: [["agent:update_editor|Morning Note"], ["code:Number guard|1 retry"], ["code:Chart agent|exhibits"], ["end:/updates|+ 2-tier memory"]]
        loops: [{from: 1, to: 0, label: "retry with errors"}]
      - title: "Model refit"
        flow: [["Refresh"], ["code:Refit Pulse / Pressure|XGBoost"], ["code:Promotion gate|Brier +0.02"], ["end:/models · /macro"]]
      - title: "Sector Sentiment"
        flow: [["Refresh"], ["code:Divergence scores|top-10 per sector"], ["agent:sector_narrative|1 call", "agent:sector_prose|11 calls"], ["end:Card on /models"]]

  - group: Research metrics
    trigger: "Refresh (AI Adoption Index); recipes are written by hand"
    output: "Talk and Hire scores in the AI Adoption Index"
    blurb: >-
      The LLM is fenced in by code on both sides: a quote is kept only if it is really in the
      filing, and a recipe only if our own replay returns real job titles.
    lanes:
      - title: "Talk pillar"
        flow: [["10-K / 10-Q"], ["code:AI-passage prefilter"], ["agent:adoption_extractor"], ["code:Quote guard|quote must be in filing"], ["end:Talk score|cached per filing"]]
      - title: "Hire pillar · layer 3"
        flow: [["Custom careers site"], ["agent:recipe_writer|≤15 steps, $3"], ["code:Replay test|≥90% coverage"], ["end:Saved recipe|replayed, no model"]]
        loops: [{from: 2, to: 1, label: "rejected → try again"}]

  - group: Triggers
    trigger: "News feeds and live Fed speeches, continuously"
    output: "Fires the Trading pipeline"
    blurb: >-
      Cheap filters first, LLM second. Borderline headlines get a second, enriched look; a
      speech must deviate more than 1.5σ from the speaker's baseline before any LLM is asked.
    lanes:
      - title: "Headlines"
        flow: [["RSS headlines"], ["agent:significance"], ["agent:significance_rescore|borderline 0.4–0.8"], ["code:Conviction ledger|12h half-life"], ["system:Trading pipeline"]]
      - title: "Fed speech"
        flow: [["Live audio|Deepgram STT"], ["code:Stage A z-score|vs 12-month baseline"], ["agent:figure_deviation_stage_b|only above 1.5σ"], ["system:Trading pipeline"]]

  - group: Advisors
    trigger: "A user consults a persona"
    output: "A cited reply, or a panel synthesis"
    blurb: >-
      RAG over each persona's own scraped writing. Panel members answer independently without
      seeing each other, then one call synthesises them. Never part of the trading pipeline.
    lanes:
      - title: "Chat"
        flow: [["Your question"], ["code:Chroma top-k|persona corpus"], ["agent:persona"], ["end:Reply|with sources"]]
      - title: "Panel"
        flow: [["Your question"], ["agent:persona|Krugman", "agent:persona|Dalio", "agent:persona|El-Erian"], ["agent:persona_panel"], ["end:Synthesis|consensus, objections"]]
