# Agent registry — one entry per LLM agent, shown on the dashboard's /agents page.
#
# Adding an agent: add an entry here. `class` (a StructuredAgent) makes the page read the
# live system prompt, model tier and output schema from code. For agents that aren't
# StructuredAgents, point `prompt` at a module-level prompt constant and `schema` at the
# output model ("module.path:NAME"). tools/memory/dependencies are descriptions you maintain
# here; `dependencies` lists the env keys the agent needs (required or optional).
# tests/test_agent_catalog.py fails if a StructuredAgent class is missing from this file.

agents:
  # ── Briefings ───────────────────────────────────────────────────────────
  - id: update_orchestrator
    name: Update Orchestrator
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM calls (gpt-6-sol)"}
    class: castelino.agents.update.orchestrator.UpdateOrchestrator
    summary: >-
      Runs the morning research desk: briefs the Macro, News and Alt agents from memory, then
      reviews what they found and sends up to one follow-up ask per agent (max 2 rounds).
    tools:
      - {name: "plan()", does: "One brief per agent, no numbers"}
      - {name: "review()", does: "done, or follow-up asks for gaps or conflicts between agents"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: []
      persists: "Nothing of its own; the Editor's themes update the shared two-tier memory."

  - id: macro_agent
    name: Macro Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED data; falls back to the keyless CSV endpoint when unset"}
      - {key: BLS_API_KEY, required: false, why: "BLS data; keyless allows 25 requests a day"}
    class: castelino.agents.update.macro.MacroAgent
    summary: >-
      Code pulls FRED releases, BLS CPI components and wages, jobless claims and market moves into
      numbered facts; the agent picks the findings that matter and cites the facts they rest on.
    tools:
      - {name: "collect()", does: "FRED releases + 1d/1w/1m returns for the instrument universe"}
      - {name: "bls_facts()", does: "CPI shelter, energy, food and average hourly earnings m/m"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: news_agent
    name: News Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.news.NewsAgent
    summary: >-
      One cited web search for the day's market-moving stories; every cited line becomes a fact,
      and the agent picks findings from those facts only.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: alt_agent
    name: Alt Agent
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search for X (gpt-6-luna)"}
    class: castelino.agents.update.alt.AltAgent
    summary: >-
      Polymarket odds and their 1-day / 1-week moves on economy markets (code, no key) plus what
      financial X is saying (cited web search); picks the findings where the crowd moved.
    tools:
      - {name: "polymarket.facts()", does: "Gamma API economy events ranked by odds move"}
      - {name: "X via web_search", does: "Cited lines of what macro accounts are posting"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: ai_agent
    name: AI Analyst
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call and web search (gpt-6-luna)"}
    class: castelino.agents.update.ai.AiAgent
    summary: >-
      One cited web search for the day's AI model releases, credibly reported upcoming releases,
      new AI chips and AI industry news; every cited line becomes a fact, and the agent picks
      findings from those facts only. The Editor always gives it one item when it found any.
    tools:
      - {name: "web_search.search_cited()", does: "OpenAI Responses web_search with citation positions"}
    memory: {reads: ["Today's brief from the Orchestrator"], writes: [], persists: "Nothing."}

  - id: update_editor
    name: Update Editor
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol)"}
    class: castelino.agents.update.editor.UpdateEditor
    summary: >-
      Writes the Morning Note (headline, 3 key takeaways, 5 ranked items of about 400 words that
      run what happened, why, then how it came about from code-pulled background) and picks each
      item's chart form. A number guard checks every figure.
    tools:
      - {name: "Background (code)", does: "Stock price history, a release's last 12 readings or a series' recent moves, and earlier ARC notes, linked to the findings as facts"}
      - {name: "Chart agent (code)", does: "Draws the picked form (range, movers, ladder, columns, dumbbell, vs expected, compare, line); a bad pick falls back to a line chart"}
      - {name: "check_note (guard)", does: "Every %, bp or pp must be in the facts behind the cited findings; one retry"}
    memory:
      reads: ["MEMORY.md — top 5 themes", "long-term.md — older themes"]
      writes: ["Theme notes (touched and new)", "data/updates/<date>.json — written last, marks the day done"]
      persists: >-
        Two-tier markdown in data/update_agent/memory/. Caps (5 short / 20 long) and eviction by
        importance minus whole months unused are enforced in code, not the prompt.

  - id: theme_picker
    name: Theme Picker
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-sol) + web search (gpt-6-luna)"}
      - {key: FRED_API_KEY, required: false, why: "FRED series; falls back to the keyless CSV endpoint when unset"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN and X_ACCESS_SECRET, the 08:00 weekday run posts its X thread; else it only logs it"}
    class: castelino.agents.themes.ThemePicker
    summary: >-
      At 08:00 ET on weekdays, picks the US macro theme an analyst or trader must know before the
      open, from what news and financial X discuss, the biggest market moves, Polymarket odds swings
      and today's calendar (Week Ahead's releases and biggest earnings), then picks 6 charts that
      each answer a pre-open question (what moved overnight, what's priced, how stretched, what
      trades together; at least 5 must draw). Code fetches and draws every plotted number. Each
      run is published on Substack (a card on /themes) and posted to X as a thread
      linking that post, with no approval step for either.
    tools:
      - {name: "gather() (code)", does: "One cited web search for the most-discussed macro themes, 1d/1w/1m market moves, Polymarket economy + Fed odds swings, and today's calendar from data/week_ahead.json (C facts: US releases and inflation/jobs abroad with consensus, the 5 biggest earnings)"}
      - {name: "resolve() (code)", does: "Fetches each fred:/yahoo: series a chart names; the weekly guard drops a chart that can't be drawn"}
      - {name: "Chart renderer (code)", does: "The Weekly Deep Dive's line / compare / movers exhibits plus heatmap, together (how often two markets moved the same way) and range (theme_charts.py), kicker THEME CHARTS"}
      - {name: "Number guard", does: "Every %, bp or pp in the theme, why and signals must be in the cited facts; one retry"}
      - {name: "Substack post (code)", does: "Weekdays at 08:00: theme as title, why, the three signals, today's calendar (code-written), every chart with the Chart Commentary's bold read under it, sources; published in Financial Markets, web only (no email); URL in data/themes/substack/, never posted twice"}
      - {name: "X thread (code)", does: "Weekdays after the 08:00 publish: theme + chart 1's read + as much of the why as fits, with chart 1; one post per further chart (title + code-written subtitle + the Chart Explainer's read), then today's calendar (as many entries as fit) and the Substack post's link; ids and texts in data/x_posts/themes/, never posted twice"}
    memory:
      reads: ["The last 6 runs' themes (data/themes/*.json)"]
      writes: ["data/themes/<date>-<am|pm>.json + charts/<run>/exhibit_N.png"]
      persists: "Each run's record; its theme and streak are the next run's memory."

  - id: chart_explainer
    name: Chart Explainer
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.themes.ChartExplainer
    summary: >-
      Before the weekday X thread goes out, one cheap call writes a trader's read under every
      chart: a 2-6 word heading and one sentence on what it means for today's trading. It may
      quote levels, but every number must be one code drew on that chart (last value, one-year
      high/low, heat cells, bars) or a fact's, and a time must be a calendar entry's; a line with
      any other number is dropped. Never buy/sell advice. If the call fails, the thread posts
      without the lines.
    tools: []
    memory: {reads: ["The run's theme, why, three signals and today's calendar, and each chart's title, kind, code-written data line and key numbers"], writes: ["The posted texts, saved with the X ids in data/x_posts/themes/"], persists: "Nothing between runs."}

  - id: chart_commentary
    name: Chart Commentary
    group: Theme Charts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.themes.ChartCommentary
    summary: >-
      When the weekday Theme Charts post is published on Substack, one cheap call writes a
      trader's read under every chart: a bold 2-6 word heading and one or two sentences on what it
      means for today's trading, under 280 characters. Same number rule as the Chart Explainer
      (only that chart's code-drawn numbers, the facts and calendar times); a read that breaks it
      is dropped, and if the call fails the post publishes without commentary.
    tools: []
    memory: {reads: ["The run's theme, why, three signals and today's calendar, and each chart's title, kind, code-written data line and key numbers"], writes: ["The reads, inside the Substack post"], persists: "Nothing between runs."}

  - id: move_explainer
    name: Move Explainer
    group: Market alerts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Web search (web_search.model)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_MOVES_LIVE=1, posts go live; else dry run"}
    prompt: "castelino.x_moves:SYSTEM"
    summary: >-
      Every 30 minutes in US trading hours code checks 10 markets on Yahoo; one that moves at least
      2.5x its typical daily move is posted to X. Code writes every number; this one cited web
      search adds the one-sentence "Why:" line, dropped when the search cited nothing.
    tools:
      - {name: "check() (code)", does: "5y of Yahoo daily bars per market: today's move, z vs the past 252 days, last day as big"}
      - {name: "web_search", does: "One cited search per post; only a cited sentence of at most 200 characters is kept"}
      - {name: "compose() + post (code)", does: "Lead move, up to 3 others, the why if it fits 280 characters, the link; x_post.post or the dry-run log"}
    memory:
      reads: ["Today's posts (data/x_posts/moves/<date>.json)"]
      writes: ["data/x_posts/moves/<date>.json"]
      persists: "Each day's posts: a market posts once a day, at most 3 posts a day."

  - id: x_chart_picker
    name: Chart Picker
    group: Market alerts
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (fast tier)"}
      - {key: FRED_API_KEY, required: false, why: "A fred: context series; falls back to the keyless CSV endpoint when unset"}
    class: castelino.x_moves.ChartPicker
    summary: >-
      Picks the one chart for each market-alert post: today's intraday path (the default) or a
      context chart of one series the Why line points at (a yield, oil, a stock, a release). Code
      fetches and draws every plotted value; any failure falls back to the intraday chart, then to
      a text-only post.
    tools:
      - {name: "intraday_chart() (code)", does: "Yahoo 5-minute bars, change since yesterday's close, one line per market of the lead's unit"}
      - {name: "context_chart() (code)", does: "One fred:/yahoo: series over 30-365 days via Theme Charts' fetch_series, drawn with the Morning Note's line chart"}
    memory:
      reads: ["The post being made: its markets, moves and Why line"]
      writes: ["data/x_posts/moves/<date>/<HHMM>.png"]
      persists: "Nothing; the day file records which chart went out and why."

  - id: x_scout_search
    name: Scout Search
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Web search (x_scout.search_model, gpt-6-luna)"}
    prompt: "castelino.x_scout:SCAN_USER"
    summary: >-
      Every 2 hours (10:15-22:15 ET on weekdays, 08:15-22:15 at weekends), one cited web search lists up to 8 macro and AI
      items from the last 6 hours: data releases against forecasts, central banks, model and chip
      launches, AI capex. Lines without a citation are dropped before the Scout sees them.
    tools:
      - {name: "web_search", does: "One cited search per run; each cited line becomes a fact with its numbers and source"}
    memory: {reads: ["The time of the run"], writes: ["Nothing; the cited items go straight to the Scout"], persists: "Nothing between runs."}

  - id: x_scout
    name: Scout
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (x_scout.scout_model, gpt-6-sol)"}
      - {key: FRED_API_KEY, required: false, why: "A fred: chart series; falls back to the keyless CSV endpoint when unset"}
    class: castelino.x_scout.Scout
    summary: >-
      Picks the one cited item a macro investor would stop scrolling for and names 1-4 FRED or
      Yahoo series to chart it. When nothing clears the bar (or the pick can't be charted or
      written), code searches the last 24 hours and the Scout must pick the best item not yet
      posted, so a run posts unless everything is old. Code fetches and draws every plotted value.
    tools:
      - {name: "chart() (code)", does: "fetch_series per series, drawn as one line or 2-4 compared (prices rebased to 100) with the Morning Note renderer"}
    memory:
      reads: ["The cited items", "This account's posts from the last 7 days (data/x_posts/scout/)", "Today's market alerts (data/x_posts/moves/)"]
      writes: ["data/x_posts/scout/<date>/<HHMM>.png"]
      persists: "Each day's posts; code also refuses a source URL already posted in the last 7 days."

  - id: x_scout_writer
    name: Scout Writer
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (x_scout.writer_model, gpt-6-luna)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_SCOUT_LIVE=1, posts go live; else dry run"}
    class: castelino.x_scout.Writer
    summary: >-
      Writes the lead post (the finding and what the chart shows) and one reply (2-3 sentences of
      analysis) from the cited line and the chart's code-computed numbers. Any number not among
      them, a link or web address, or a post over 280 characters, gets one retry, then nothing is
      posted. It names the source; code adds the topic tag and "Source: <name>" to the lead (no link:
      X bills a post with one at $0.200, a plain post $0.015).
    tools:
      - {name: "check() (code)", does: "Every figure must be in the source line or the chart data (unit figures via the Morning Note guard); no link or domain anywhere; each post ≤280"}
      - {name: "x_post (code)", does: "Uploads the chart, posts the lead, then the reply under it; dry-run log until X_SCOUT_LIVE=1"}
    memory:
      reads: ["The picked cited line", "The chart's numbers: last, change, high, low, below the high, rebased level"]
      writes: ["data/x_posts/scout/<date>.json (texts, chart, X ids, dry_run)"]
      persists: "Each day's posts: at most 2 a day."

  - id: x_calendar_writer
    name: Calendar Writer
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (x_scout.writer_model, gpt-6-luna)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_SCOUT_LIVE=1, posts go live; else dry run"}
    class: castelino.x_scout.CardWriter
    summary: >-
      At 07:00 ET on weekdays code draws the calendar card from Week Ahead (Monday: the week; Tuesday
      to Friday: today, with the rows it will watch marked) and this call writes the short read on
      top. Every figure must be on the card; one retry, then a code-written line.
    tools:
      - {name: "pick() + draw_card() (code)", does: "Key US releases by tier with a consensus, inflation and jobs abroad, the largest companies reporting; drawn in the ARC chart frame"}
      - {name: "x_scout.check (code)", does: "Every figure in the read must be one of the card's numbers; ≤280 characters"}
    memory:
      reads: ["The card's rows (time, release, consensus, previous; company, session, EPS estimate)"]
      writes: ["data/x_posts/calendar/<date>.json (card post, today's watch list)", "data/x_posts/calendar/<date>/card.png"]
      persists: "One card a day; the watch list for the release posts."

  - id: x_release_writer
    name: Release Writer
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (x_scout.writer_model, gpt-6-luna)"}
      - {key: X_API_KEY, required: false, why: "With X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET and X_SCOUT_LIVE=1, posts go live; else dry run"}
    class: castelino.x_scout.ReleaseWriter
    summary: >-
      Every 5 minutes from 07:00 to 19:55 ET on weekdays code checks Nasdaq's live calendar (data) and
      the Earnings Reader (earnings); when a watched release lands, code writes the numbers line
      (actual vs expected, previous) and this call adds one plain sentence with no digit, dropped if it has one.
    tools:
      - {name: "landed() (code)", does: "Today's Nasdaq economic and earnings rows matched to the morning's watch list; a release's m/m and y/y post together"}
      - {name: "x_post (code)", does: "One post per release, once, at most 6 a day; may post in the Theme Charts quiet hour"}
    memory:
      reads: ["The release's numbers line"]
      writes: ["data/x_posts/calendar/<date>.json (releases posted, X ids)"]
      persists: "Each day's release posts: never twice, at most 6."

  - id: x_earnings_reader
    name: Earnings Reader
    group: X Scout
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "Cited web search + LLM call (x_scout.writer_model, gpt-6-luna)"}
    class: castelino.x_scout.EarningsReader
    summary: >-
      Nasdaq's day calendar never shows reported EPS, so for each watched company code runs a cited
      web search once its session opens (06:30 for pre-market, 16:05 after the close), at most every
      15 minutes. This call reads those cited lines: reported today or not, and the numbers line
      ("SpaceX (SPCX) Q3: EPS $0.35 vs $0.13 expected; revenue ..."). Code posts it only if every
      figure is a cited line's and the ticker trades on Yahoo.
    tools:
      - {name: "earnings_result() (code)", does: "One cited search per check; the reader's line is dropped if a figure is not in the cited lines or the ticker doesn't trade"}
    memory:
      reads: ["The cited lines of one search", "data/x_posts/calendar/<date>.json (when each company was last searched)"]
      writes: ["The search times, in the same file"]
      persists: "Up to 12 searches per company a day."

  - id: desk_chat
    name: Desk Chat
    group: Briefings
    family: Update Agent
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (gpt-6-luna)"}
    class: castelino.agents.update.desk.DeskChatAgent
    summary: >-
      On the private admin Daily desk, answers questions about one agent's work on one day
      (Macro, News, Alt, AI or the Editor), from that day's saved findings and facts only, citing
      their ids. Read-only: re-runs, rebuilds and Substack drafts are separate buttons.
    tools: []
    memory: {reads: ["The day's findings and facts for that agent (the Editor also sees the note)", "The conversation so far, sent by the browser"], writes: [], persists: "Nothing."}

  - id: cover_artist
    name: Cover Artist
    group: Briefings
    dependencies:
      - {key: OPENAI_API_KEY, required: true, why: "LLM call (fast tier) + image model (cover.model, gpt-image-2)"}
      - {key: SUBSTACK_SID, required: false, why: "Sets the image as the draft's cover; unset = no draft, no cover"}
    class: castelino.cover.CoverArtist
    summary: >-
      Gives each Morning Note and Weekly Deep Dive Substack draft a cover image. One fast call turns
      the headline and stories into a 2-3 word title, the public figures the post names (Fed
      officials, CEOs) and a few things to draw, with the companies' logos; code keeps only people
      the post names, wraps it in a fixed style and the image model draws a 16:9 cover (redrawn
      once with generic people if it refuses a real person). Only a draft with no cover gets one, so a
      cover set by hand is kept; a failure leaves the draft without one.
    tools:
      - {name: "draw() (code)", does: "One image call (config cover: gpt-image-2, 1536x864, high) with the fixed STYLE prompt + title + scene"}
      - {name: "substack.push(cover=)", does: "Uploads the PNG and sets it as the draft's cover_image"}
    memory:
      reads: ["The finished note: headline + story titles (weekly: report title + trend titles)"]
      writes: ["data/updates/covers/<day>.png", "data/deep/covers/<week>.png"]
      persists: "The PNG, so a rerun never pays twice; `python -m castelino.cover <day|week>` redraws it."

  # ── Trade Lab (/admin only) ─────────────────────────────────────────────
  - id: trade_framer
    name: Trade Lab · Framer
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
      - {key: OPENAI_API_KEY, required: true, why: "Fallback model and the why-now web search"}
    prompt: "castelino.agents.trade.framer:SYSTEM"
    schema: "castelino.agents.trade.models:Frame"
    summary: >-
      Turns a trade idea into a testable thesis: Yahoo tickers for the subject and its benchmarks, a
      horizon, and 1 to 3 tests that would prove it wrong. Code checks every ticker has prices and
      adds one cited search on why the idea matters now.
    tools:
      - {name: "Ticker check (code)", does: "Each ticker must return Yahoo prices; one retry naming the bad ones"}
      - {name: "Why-now search", does: "One cited web search; up to 8 cited lines become facts"}
    memory:
      reads: ["The user's sentence"]
      writes: ["Frame + F facts in data/trades/<id>/idea.json"]
      persists: "The idea record."

  - id: trade_bull
    name: Trade Lab · Bull
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
      - {key: OPENAI_API_KEY, required: true, why: "Web search (gpt-6-luna) and the fallback model"}
    prompt: "castelino.agents.trade.debate:BULL"
    schema: "castelino.agents.trade.models:TurnDraft"
    summary: >-
      Argues for the idea: researches its own case (up to 8 tool calls), then answers the bear twice.
      Every number must be in a fact it cites.
    tools:
      - {name: "yahoo_prices / fred_series / technicals / polymarket_odds / web_search", does: "Facts computed by code or cited lines"}
    memory:
      reads: ["Frame, framer facts, the bear's last turn"]
      writes: ["Turns + B facts"]
      persists: "The idea record."

  - id: trade_bear
    name: Trade Lab · Bear
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
      - {key: OPENAI_API_KEY, required: true, why: "Web search (gpt-6-luna) and the fallback model"}
    prompt: "castelino.agents.trade.debate:BEAR"
    schema: "castelino.agents.trade.models:TurnDraft"
    summary: >-
      Argues against the idea the same way: its own research, then two rebuttals. No winner is named.
    tools:
      - {name: "yahoo_prices / fred_series / technicals / polymarket_odds / web_search", does: "Facts computed by code or cited lines"}
    memory:
      reads: ["Frame, framer facts, the bull's last turn"]
      writes: ["Turns + R facts"]
      persists: "The idea record."

  - id: trade_moderator
    name: Trade Lab · Moderator
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: false, why: "DeepSeek V4.1 Flash via OpenRouter; unset = gpt-6-sol"}
    prompt: "castelino.agents.trade.debate:MODERATOR"
    schema: "castelino.agents.trade.models:Moderation"
    summary: >-
      Lists what the debate settled (with fact ids) and 2 to 4 open questions, which start the research
      list. Never picks a winner.
    tools: []
    memory:
      reads: ["The six turns and their facts"]
      writes: ["Settled points and open questions"]
      persists: "The idea record."

  - id: trade_talk
    name: Trade Lab · Talk
    group: Trade Lab
    family: Trade Lab
    dependencies:
      - {key: OPENROUTER_API_KEY, required: true, why: "Claude Haiku 5.5 via OpenRouter; edits it fails twice go to Claude Sonnet 5.5"}
    prompt: "castelino.agents.trade.talk:SYSTEM"
    schema: "castelino.agents.trade.talk:Reply"
    summary: >-
      Answers the user in Talk 1 (after the debate) from what the idea already holds. Talk 2 is an
      assistant: each message runs as a job that searches first when it needs new facts (one news desk,
      up to 4 searches), answers, edits every part asked and updates the draft, listing each step, model
      and cost. No rounds.
    tools:
      - {name: "Number check (code)", does: "Figures must be in cited facts; else a plain refusal"}
      - {name: "News desk (Talk 2)", does: "Up to 4 cited searches in parallel; facts numbered Q<n>."}
      - {name: "Revise", does: "Claude Haiku 5.5 rewrites a part; two failed number checks hand it to Claude Sonnet 5.5"}
    memory:
      reads: ["Debate, findings, draft, facts, the last 6 messages"]
      writes: ["Talk messages with their trail; research items (Talk 1); Q facts; edited report parts"]
      persists: "The idea record."

  - id: trade_decide
