# Daily refresh + publish server (Dockerfile, deploy/crontab). The only public service is the
# admin Daily desk API (dashboard/desk_app.py), behind ADMIN_PASSWORD; Refresh is not reachable.
app = "arc-research-backend"
primary_region = "iad"

[env]
  TZ = "America/New_York"
  VERCEL_ORG_ID = "team_BsHOg3CKHR9ZEzbgdX9M1U19"
  VERCEL_PROJECT_ID = "prj_oxSCUqfLdewuJyglbdzYBwDaLn2t"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"  # the 17:00 cron needs the machine up
  auto_start_machines = false
  min_machines_running = 1

[mounts]
  source = "arc_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
