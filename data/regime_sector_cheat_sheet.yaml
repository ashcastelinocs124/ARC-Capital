# Growth × inflation quadrants → macro label + sector playbook for downstream agents.
# `preferred_instrument_ids` must exist in `instruments.py` and be tradable.
#
# Interpretation: combine `growth.up` and `inflation.up` from `regime_forecast.json`
# (month-ahead directional nowcasts) to pick a quadrant.
#
# `growth.up` = next-month growth survey index in expansion (>0).
# `inflation.up` = inflation ACCELERATING (next CPI MoM% > this month's), NOT merely
# "prices rising"; `inflation_down` = steady or decelerating inflation.

quadrants:
  growth_up_inflation_up:
    label: "Reflation"
    blurb: >
      Expanding activity with accelerating inflation. Cyclicals and real assets
      often outperform; long duration can lag if yields rise with activity.
    sectors:
      - Energy
      - Industrials
      - Consumer discretionary
      - Commodities
      - Financials
      - Digital assets
    preferred_instrument_ids:
      - XLE
      - XLI
      - XLY
      - XLF
      - USO
      - GLD
      - IBIT

  growth_up_inflation_down:
    label: "Goldilocks"
    blurb: >
      Growth with steady or decelerating inflation. Growth and momentum factors often work;
      long duration tends to be better supported than in reflation.
    sectors:
      - Technology
      - Consumer discretionary
      - Broad equities
    preferred_instrument_ids:
      - XLK
      - QQQ
      - XLY
      - SPY

  growth_down_inflation_up:
    label: "Stagflation risk"
    blurb: >
      Weak growth with accelerating inflation. Real assets and defensives often
      outperform; cyclicals and high-duration growth can lag.
    sectors:
      - Energy
      - Commodities
      - Health care
    preferred_instrument_ids:
      - XLE
      - GLD
      - USO
      - XLV

  growth_down_inflation_down:
    label: "Disinflation / slowdown"
    blurb: >
      Weak growth with steady or decelerating inflation. Duration and quality defensives
      often lead until activity stabilizes.
    sectors:
      - Long-duration Treasuries
      - Investment-grade credit
      - Health care
    preferred_instrument_ids:
      - TLT
      - IEF
      - LQD
      - XLV
      - SHY
