# Leading indicators for the GROWTH forecaster (target: ISM Manufacturing PMI composite).
#
# FRED discontinued the ISM series (`NAPM`) in June 2024. The target is the mean
# of the Empire State (GACDISA066MSFRBNY) and Philly Fed (GACDFSA066MSFRBPHI)
# general-business-conditions diffusion indices, snapshotted in
# `data/ism_manufacturing_pmi.csv`. Refresh: `python scripts/build_ism_pmi_proxy.py`
# Swap in the licensed ISM headline series (same `date,value` schema) if available.
#
# Label: next-month level > 0 (expansion), via `level_threshold` below.
# Self-lags of the target series are always included automatically.

version: 1

target:
  id: ISM_MFG_PMI
  source: local_csv
  path: data/ism_manufacturing_pmi.csv
  name: "Regional Fed manufacturing composite (Empire State + Philly, diffusion index; ISM proxy)"
  level_threshold: 0  # label = expansion (>0) next month, not noisy MoM direction

indicators:
  - id: DGS10
    source: fred
    fred_id: DGS10
    name: "10-year Treasury yield"

  - id: ICSA
    source: fred
    fred_id: ICSA
    name: "Initial jobless claims"

  - id: USSLIND
    source: fred
    fred_id: USSLIND
    name: "Leading Index for the United States (Phila Fed; discontinued 2020 — XGBoost tolerates NaN lags)"

  - id: cyclicals_defensives
    source: yfinance_ratio
    numerator: XLY
    denominator: XLP
    name: "Cyclicals (XLY) vs. defensives (XLP)"

  - id: DSPIC96
    source: fred
    fred_id: DSPIC96
    name: "Real disposable personal income"
