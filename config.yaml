# Castelino Capital — runtime configuration
# Tunable knobs live here; structural decisions live in code.

models:
  # OpenAI model IDs by tier.
  # - reasoning: gpt-5.5 (heavy) — Hypothesis, Asset Selection, Bull, Bear,
  #   Debate, Guard soft, Portfolio, Curator. These nodes do real analysis;
  #   the extra cost is justified.
  # - fast: gpt-5.4-mini (light) — Current Event, Web, TA, Backtest, Risk.
  #   These mostly summarize/frame deterministic numbers; cheap is fine.
  # - significance: gpt-5.4-mini — runs in batches against every RSS pull.
  reasoning: "gpt-5.5"
  fast: "gpt-5.4-mini"
  significance: "gpt-5.4-mini"

openai:
  request_timeout_s: 60
  max_retries: 3
  # Cap structured-output requests so a runaway agent can't burn the budget.
  max_output_tokens: 2048

fred:
  releases:
    10:
      name: "US CPI YoY"
      impact: "high"
      asset_classes: ["equity", "bond_etf", "fx"]
    13:
      name: "US Retail Sales"
      impact: "medium"
      asset_classes: ["equity"]
    14:
      name: "FOMC Rate Decision"
      impact: "high"
      asset_classes: ["equity", "bond_etf", "fx", "commodity_etf"]
    21:
      name: "US PCE YoY"
      impact: "high"
      asset_classes: ["equity", "bond_etf"]
    50:
      name: "US Non-Farm Payrolls"
      impact: "high"
      asset_classes: ["equity", "bond_etf", "fx"]
    53:
      name: "US GDP"
      impact: "high"
      asset_classes: ["equity", "bond_etf", "fx"]
    46:
      name: "US PPI"
      impact: "medium"
      asset_classes: ["equity", "bond_etf"]
  cache_ttl_hours: 24

openbb:
  preferred_provider: yfinance
  fallback_enabled: true
  cache_ttl_minutes: 15

web_search:
  # OpenAI Responses API + web_search tool (replaced Perplexity Sonar 2026-10-03)
  cache_ttl_hours: 12
  model: "gpt-5.4-mini"
  regions: ["EU", "UK", "JP", "CN", "GLOBAL"]

adoption:
  enabled: true
  data_dir: data/adoption
  top_n: 100
  sec_user_agent: ""   # set to "ARC Research you@example.com" before `ckm adoption run`
  hire_smoothing_periods: 7
  thin_cell_below: 5
  max_passages: 40
  passage_window_chars: 300
  request_interval_s: 0.12

deep_research:
  # General Deep Research (/admin → Research): any topic, up to 8 research agents, Claude writes the
  # points, the editor desk revises one point at a time.
  enabled: true
  data_dir: data/research
  clarifier_model: gpt-6-sol
  lead_model: gpt-6-sol
  critic_model: gpt-6-sol
  agent_model: deepseek/deepseek-v4.1-flash-1017
  agent_fallback_model: gpt-6-luna
  search_model: gpt-6-luna
  writer_model: claude-opus-5-5
  writer_effort: high
  writer_max_tokens: 32000
  revise_model: anthropic/claude-haiku-5.5
  revise_fallback_model: anthropic/claude-sonnet-5.5
  revise_openai_model: gpt-6-sol
  compact_model: gpt-6-luna
  chart_model: gpt-6-luna
  clarify_max_questions: 3
  max_agents: 8
  max_gap_agents: 4
  max_tool_calls: 12
  gap_rounds: 1
  agent_concurrency: 4
  session_concurrency: 2
  answer_tool_calls: 4
  x_posts_per_call: 10
  x_posts_per_report: 100
  keep_full_days: 14
  cost_cap_usd: 8.0

paths:
  data_dir: "data"
  reports_dir: "reports"
  cache_dir: "data/cache"

update_agent:
  enabled: true
  orchestrator_model: gpt-6-sol
  editor_model: gpt-6-sol
  agent_model: gpt-6-luna
  search_model: gpt-6-luna
  max_rounds: 2
  max_findings_per_agent: 6
  items: 5
  max_guard_retries: 1
  max_output_tokens: 32000  # ~400-word items x 5 plus reasoning outgrew 16000
  short_term_notes: 5
  long_term_notes: 20
  long_term_refresh_days: 7
  data_dir: data/update_agent
  updates_dir: data/updates

themes:
  # Theme Charts: the macro theme a trader needs before the open, 08:00 ET on weekdays (deploy/crontab).
  picker_model: gpt-6-sol
  search_model: gpt-6-luna
  explainer_model: gpt-6-luna   # the trader read under every chart, in the X thread and the Substack post
  max_charts: 6
  min_charts: 5   # fewer on the first try → one retry told why; the retry publishes what passed
  memory_runs: 6
  data_dir: data/themes

x_scout:
  # X Scout (x_scout.py): a cited macro/AI finding + chart on X, weekdays every 2 h and Saturday noon.
  search_model: gpt-6-luna
  scout_model: gpt-6-sol    # picks the item worth posting, or nothing
  writer_model: gpt-6-luna  # the lead post and its reply

cover:
  # Cover art on the Morning Note and Weekly Deep Dive Substack drafts (src/castelino/cover.py).
  model: gpt-image-2
  size: 1536x864   # 16:9; width and height must be divisible by 16
  quality: high

model_refit:
  gate_tolerance: 0.02

sector_sentiment:
  # Divergence = technical score - fundamental score, per sector, -1..+1.
  enabled: true
  euphoric_threshold: 0.3    # divergence >= this -> "euphoric"
  fearful_threshold: -0.3    # divergence <= this -> "fearful"
  # Sector explainer verdict: is a sector's divergence one stock or the whole sector?
  stock_specific_top_share: 0.5  # top contributor supplies >= 50% -> stock_specific
  sector_wide_min_agree: 7       # >= 7 of 10 stocks share the sign (and top < 50%) -> sector_wide
  universe_cache_hours: 24   # top-10-by-mktcap screener cache
  fundamentals_cache_hours: 24
  top_n_per_sector: 10
  min_history_for_zscore: 20 # sector needs this many daily obs before z-score
  refresh_interval_hours: 24  # refresh on `ckm serve` start self-throttles to once a day

deep_dive:
  # Weekly Deep Dive: Sunday-morning report on Mon-Fri, on /deep-research and Substack.
  enabled: true
  lead_model: gpt-6-sol
  agent_model: gpt-6-luna
  search_model: gpt-6-luna
  editor_model: claude-opus-5-5
  editor_effort: high
  min_trends: 10
  max_trends: 12
  max_agents: 5
  max_tool_calls: 16
  editor_max_tokens: 64000
  max_answer_tool_calls: 4
  max_grill_rounds: 2
  max_guard_retries: 1
  min_notes: 3
  data_dir: data/deep

trade_lab:
  # Trade Lab (/admin): idea → bull/bear debate → your view → research desks → charts → Claude editor → Substack draft.
  data_dir: data/trades
  # DeepSeek V4.1 Flash 1017 framed the India idea well and finished the debate; V4 Pro framed it worse and
  # failed a rebuttal on the number check (2026-10-17)
  framer_model: deepseek/deepseek-v4.1-flash-1017
  debate_model: deepseek/deepseek-v4.1-flash-1017
  talk_model: anthropic/claude-haiku-5.5  # answers and slight edits; 4 of 4 test edits passed (2026-10-16)
  orchestrator_model: gpt-6-sol
  desk_model: gpt-6-luna
  chart_model: gpt-6-luna
  search_model: gpt-6-luna
  decide_model: gpt-6-luna
  editor_model: claude-opus-5-5
  editor_effort: high
  fallback_debate_model: gpt-6-sol
  fallback_talk_model: anthropic/claude-sonnet-5.5  # edits Haiku fails the number check on twice
  talk_research_calls: 4
  cost_cap_usd: 5.0
  concurrency: 2

chart_desk:
  # Admin → Charts (src/castelino/agents/chart_desk.py): talking to the chart agent directly, and
  # Compare models. Only for direct use: never changes another workflow's model (trade_lab above).
  chat_model: gpt-6-luna   # cheapest and fastest in the Oct 16 comparison
  compare_models:
    - gpt-6-luna            # Trade Lab's chart model, for reference
    - moonshotai/kimi-k3
    - deepseek/deepseek-v4-pro
    - qwen/qwen3.8-max-0902
    - z-ai/glm-5.3
    - mistralai/mistral-large-4-0
    - deepseek/deepseek-v4.1-flash
  compare_default: 5        # the first 5 start ticked
